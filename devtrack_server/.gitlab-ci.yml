stages:
  - test
  - docker

variables:
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache

core-tests:
  stage: test
  image: python:3.12-slim
  cache:
    key: uv-core-$CI_COMMIT_REF_SLUG
    paths:
      - .venv/
      - .uv-cache/
  before_script:
    - pip install uv --quiet
    - uv sync --group dev
  script:
    - uv run pytest backend/tests/ -x -q --tb=short --ignore=backend/tests/test_nlp_parser.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

full-tests:
  stage: test
  image: python:3.12-slim
  cache:
    key: uv-full-$CI_COMMIT_REF_SLUG
    paths:
      - .venv/
      - .uv-cache/
  before_script:
    - pip install uv --quiet
    - uv sync --extra ai --group dev
  script:
    - uv run pytest backend/tests/ -x -q --tb=short
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

docker:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE -t $IMAGE_LATEST -f Dockerfile.server .
    - docker push $IMAGE
    - docker push $IMAGE_LATEST
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
