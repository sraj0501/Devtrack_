[project]
name = "devtrack-server"
version = "1.1.0"
description = "The Swiss Army knife for developer workflows — Git monitoring, AI-enhanced commit messages, ticket sync, daily reports, and a local LLM git agent, all wired together and personalized to how you write"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiohttp>=3.12.13",
    "azure-identity>=1.23.0",
    "duckdb>=1.3.1",
    "fastapi[standard]>=0.115.12",
    "msgraph-sdk>=1.35.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "pygithub>=2.6.1",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "ollama>=0.1.0",
    # Task Matching & Parsing
    "fuzzywuzzy>=0.18.0",
    "python-Levenshtein>=0.21.0",
    "dateparser>=1.2.0",
    "openai>=2.24.0",
    "python-telegram-bot>=22.7",
    "motor>=3.7.1",
    "runtime-narrative>=0.1.0",
    # Server TUI (CS-2)
    "textual>=0.65.0",
    "psutil>=5.9.0",
    # Admin Console (CS-3)
    "pyjwt>=2.8.0",
    # Slack bot
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.27.0",
]

[project.optional-dependencies]
ai = [
    "spacy>=3.7.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "chromadb>=0.4.0",
]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
cloud = ["openai>=1.0.0", "anthropic>=0.25.0"]
mongodb = ["motor>=3.3.0"]
notifications = ["plyer>=2.1"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pandas-stubs==2.3.2.250926",
]
