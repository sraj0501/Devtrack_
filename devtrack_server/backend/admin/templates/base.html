<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DevTrack Admin{% endblock %}</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2uodhrgzmieviBW7GkHxV3xNFr1EFPaFvEY" crossorigin="anonymous"></script>
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6.5 12 2l8 4.5v9L12 20l-8-4.5z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg>
      </div>
      <div class="brand-copy">
        <div class="brand-name">Dev<span>Track</span></div>
        <div class="sidebar-version">Admin Console</div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-label">Workspace</div>
      <a href="/admin/" class="{{ 'active' if active == 'dashboard' }}">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span> Dashboard
      </a>
      <a href="/admin/queue" class="{{ 'active' if active == 'queue' }}">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span> Pending actions
      </a>
      <a href="/admin/users" class="{{ 'active' if active == 'users' }}">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 2-6 6-6s6 2 6 6M16 6.5a3 3 0 0 1 0 5.5M16 15c3.3.2 5 1.9 5 5"/></svg></span> Users
      </a>
      <a href="/admin/server" class="{{ 'active' if active == 'server' }}">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01M17 7h1M17 17h1"/></svg></span> Server
      </a>
      <div class="nav-label" style="margin-top:20px">Governance</div>
      <a href="/admin/audit" class="{{ 'active' if active == 'audit' }}">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H6a2 2 0 0 0-2 2v12h16V7a2 2 0 0 0-2-2h-3"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M8 11h8M8 15h6"/></svg></span> Audit Log
      </a>
      <a href="/admin/license" class="{{ 'active' if active == 'license' }}">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v18M5 6h14M7 6l-4 7h8zM17 6l-4 7h8zM8 21h8"/></svg></span> License
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">{{ current_user[:1] | upper }}</div>
        <div class="user-details"><div class="user-name">{{ current_user }}</div><a class="sign-out" href="/admin/logout">Sign out</a></div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="topbar-title">{% block page_title %}Dashboard{% endblock %}</div>
      </div>
      <div class="topbar-right">
        <span class="live-status">System live</span>
        <span class="clock-wrap"><span id="clock" class="mono"></span></span>
      </div>
    </header>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<script>
  // Live clock
  function tick() {
    const el = document.getElementById('clock');
    if (el) el.textContent = new Date().toLocaleTimeString();
  }
  tick(); setInterval(tick, 1000);

  const menu = document.querySelector('.menu-toggle');
  const sidebar = document.getElementById('sidebar');
  function setNavigation(open) {
    document.body.classList.toggle('nav-open', open);
    if (menu) menu.setAttribute('aria-expanded', String(open));
  }
  if (menu) menu.addEventListener('click', () => setNavigation(!document.body.classList.contains('nav-open')));
  document.addEventListener('click', (event) => {
    if (document.body.classList.contains('nav-open') && !sidebar.contains(event.target) && !menu.contains(event.target)) setNavigation(false);
  });
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') setNavigation(false); });
</script>
</body>
</html>
