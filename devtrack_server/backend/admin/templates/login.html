<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTrack Admin — Sign In</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6.5 12 2l8 4.5v9L12 20l-8-4.5z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg></div>
      <div class="login-copy">Dev<span>Track</span><small>Admin console</small></div>
    </div>
    {% if error %}
    <div class="error-msg" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login">
      <div class="form-row">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus required>
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">
        Sign in
      </button>
    </form>
  </div>
</div>
</body>
</html>
