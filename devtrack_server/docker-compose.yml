# docker-compose.yml
# Optional local infrastructure for DevTrack.
#
# DevTrack does NOT need any of this to run. Its own state lives in local SQLite.
# These services are only for opt-in extras:
#   - MongoDB    — Microsoft Teams messages as an extra voice-learning source
#   - PostgreSQL — multi-user mode for the Python-owned tables (POSTGRES_URL)
#
# DevTrack itself runs natively (Go binary + uv Python), NOT in Docker.
# See docs/INSTALLATION.md for setup.
#
# Usage:
#   docker compose up -d mongo      # start a service
#   docker compose down             # stop services
#   docker compose down -v          # stop + wipe volumes

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  # Used by: personalization (RAG samples, user profiles), managed mode
  mongo:
    image: mongo:7
    container_name: devtrack-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-devtrack}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-devtrack}
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-devtrack}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - devtrack-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  # Used by: managed cloud mode (user accounts, API keys, team config)
  postgres:
    image: postgres:16-alpine
    container_name: devtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devtrack}
      POSTGRES_DB: ${POSTGRES_DB:-devtrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - devtrack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devtrack} -d ${POSTGRES_DB:-devtrack}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  postgres-data:

networks:
  devtrack-network:
    driver: bridge
