# docker-compose.yml
# Runs the DevTrack Python server in a container. The Go client stays on the host
# and talks to it over HTTPS with DEVTRACK_SERVER_MODE=external.
#
# The server is the only service you need. MongoDB and PostgreSQL are opt-in extras
# (Teams voice source; multi-user mode) — DevTrack's own state lives in local SQLite.
#
# Usage:
#   docker compose up -d devtrack_server   # the server
#   docker compose up -d mongo             # optional extras, by name
#   docker compose down                    # stop
#   docker compose down -v                 # stop + wipe volumes

services:
  # ── DevTrack Python server ───────────────────────────────────────────────────
  devtrack_server:
    build:
      context: .
      dockerfile: Dockerfile
    image: devtrack-server
    container_name: devtrack-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DEVTRACK_SERVER_PORT:-8089}:8089"
    volumes:
      - ./Data:/app/Data
    networks:
      - devtrack-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  # Optional: Microsoft Teams messages as an extra voice-learning source.
  mongo:
    image: mongo:7
    container_name: devtrack-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-devtrack}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-devtrack}
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-devtrack}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - devtrack-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  # Used by: managed cloud mode (user accounts, API keys, team config)
  postgres:
    image: postgres:16-alpine
    container_name: devtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devtrack}
      POSTGRES_DB: ${POSTGRES_DB:-devtrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - devtrack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devtrack} -d ${POSTGRES_DB:-devtrack}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  postgres-data:

networks:
  devtrack-network:
    driver: bridge
