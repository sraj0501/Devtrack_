[project]
name = "devtrack-client"
version = "0.1.0"
description = "git-sage — local LLM-powered git assistant bundled with the devtrack client binary"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
git-sage = "gitsage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gitsage"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]
