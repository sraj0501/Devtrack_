version: 2

project_name: devtrack

before:
  hooks:
    - bash -c "go mod tidy"

builds:
  - id: devtrack
    main: .
    binary: devtrack
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.ShortCommit}}
      - -X main.BuildTime={{.Date}}

archives:
  - id: devtrack
    ids:
      - devtrack
    name_template: "devtrack_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  groups:
    - title: "New Features"
      regexp: "^feat"
      order: 0
    - title: "Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"
      - typo
      - Merge pull request
      - Merge branch

release:
  gitlab:
    owner: devtrack3_cloud
    name: devtrack_client
  name_template: "DevTrack {{.Version}}"
  header: |
    ## DevTrack {{.Version}}

    Pre-built binaries for macOS (Apple Silicon + Intel) and Linux (amd64 + arm64).

    > **Two deployment modes** — choose during `devtrack setup`:
    > - **Standalone** (new): git tracking, CLI tools, and AI commit messages — no Python backend required.
    > - **Full**: all of the above plus AI work updates, project management sync, and reporting (requires Python backend).

    ### Quick install

    ```bash
    OS=$(uname -s | tr '[:upper:]' '[:lower:]')
    ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && ARCH="amd64"; [ "$ARCH" = "aarch64" ] && ARCH="arm64"
    curl -fsSL "https://github.com/sraj0501/Devtrack_/releases/latest/download/devtrack_${OS}_${ARCH}.tar.gz" | tar xz
    sudo mv devtrack /usr/local/bin/
    devtrack setup
    ```

    See [Installation Guide](https://github.com/sraj0501/Devtrack_/blob/main/docs/INSTALLATION.md) for full setup.
  footer: |
    **Full Changelog**: https://github.com/sraj0501/Devtrack_/compare/{{.PreviousTag}}...{{.Tag}}
