stages:
  - test
  - release
  - publish-release

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.go-cache
  CGO_ENABLED: "0"

.go-cache: &go-cache
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .go/pkg/
      - .go-cache/

test:
  stage: test
  image: golang:1.24-alpine
  <<: *go-cache
  script:
    - go vet ./...
    - go test ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

release:
  stage: release
  image: golang:1.24-alpine
  <<: *go-cache
  before_script:
    - apk add --no-cache curl tar zip
  script:
    - |
      VERSION=${CI_COMMIT_TAG}

      build_and_upload() {
        local os=$1 arch=$2 ext=${3:-""}
        local name="devtrack_${os}_${arch}"

        GOOS=$os GOARCH=$arch go build \
          -ldflags="-s -w \
            -X main.Version=${VERSION} \
            -X main.GitCommit=${CI_COMMIT_SHORT_SHA} \
            -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -o devtrack${ext} .

        if [ -n "$ext" ]; then
          zip ${name}.zip devtrack${ext}
          curl -s --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --upload-file ${name}.zip \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/devtrack/${VERSION}/${name}.zip"
        else
          tar -czf ${name}.tar.gz devtrack${ext}
          curl -s --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --upload-file ${name}.tar.gz \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/devtrack/${VERSION}/${name}.tar.gz"
        fi

        rm -f devtrack${ext} ${name}.tar.gz ${name}.zip
      }

      build_and_upload linux  amd64
      build_and_upload linux  arm64
      build_and_upload darwin amd64
      build_and_upload darwin arm64
      build_and_upload windows amd64 .exe
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

create-release:
  stage: publish-release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating GitLab release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "DevTrack $CI_COMMIT_TAG"
    description: |
      DevTrack CLI $CI_COMMIT_TAG — pre-built binaries for Linux, macOS, and Windows.

      **Install (Linux/macOS):**
      ```sh
      curl -fsSL https://devtrack.cloud/install.sh | sh
      ```

      **Install (Windows PowerShell):**
      ```powershell
      irm https://devtrack.cloud/install.ps1 | iex
      ```
    assets:
      links:
        - name: "devtrack_linux_amd64.tar.gz"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/devtrack/$CI_COMMIT_TAG/devtrack_linux_amd64.tar.gz"
          link_type: package
        - name: "devtrack_linux_arm64.tar.gz"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/devtrack/$CI_COMMIT_TAG/devtrack_linux_arm64.tar.gz"
          link_type: package
        - name: "devtrack_darwin_amd64.tar.gz"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/devtrack/$CI_COMMIT_TAG/devtrack_darwin_amd64.tar.gz"
          link_type: package
        - name: "devtrack_darwin_arm64.tar.gz"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/devtrack/$CI_COMMIT_TAG/devtrack_darwin_arm64.tar.gz"
          link_type: package
        - name: "devtrack_windows_amd64.zip"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/devtrack/$CI_COMMIT_TAG/devtrack_windows_amd64.zip"
          link_type: package
  needs:
    - release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
