stages:
  - test
  - release

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.go-cache
  CGO_ENABLED: "0"

.go-cache: &go-cache
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .go/pkg/
      - .go-cache/

test:
  stage: test
  image: golang:1.24-alpine
  <<: *go-cache
  script:
    - go vet ./...
    - go test ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

release:
  stage: release
  image: golang:1.24-alpine
  <<: *go-cache
  before_script:
    - apk add --no-cache curl tar zip
  script:
    - |
      VERSION=${CI_COMMIT_TAG}

      build_and_upload() {
        local os=$1 arch=$2 ext=${3:-""}
        local name="devtrack_${os}_${arch}"

        GOOS=$os GOARCH=$arch go build \
          -ldflags="-s -w \
            -X main.Version=${VERSION} \
            -X main.GitCommit=${CI_COMMIT_SHORT_SHA} \
            -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -o devtrack${ext} .

        if [ -n "$ext" ]; then
          zip ${name}.zip devtrack${ext}
          curl -s --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --upload-file ${name}.zip \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/devtrack/${VERSION}/${name}.zip"
        else
          tar -czf ${name}.tar.gz devtrack${ext}
          curl -s --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --upload-file ${name}.tar.gz \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/devtrack/${VERSION}/${name}.tar.gz"
        fi

        rm -f devtrack${ext} ${name}.tar.gz ${name}.zip
      }

      build_and_upload linux  amd64
      build_and_upload linux  arm64
      build_and_upload darwin amd64
      build_and_upload darwin arm64
      build_and_upload windows amd64 .exe
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
