  AZURE_DEVOPS: `<div class="md-body">
<h1>Azure DevOps Integration</h1>
<p>Azure DevOps integration connects a local repository's Git signals to a specific organization and project so DevTrack can browse work items, stage comments and state transitions, poll alerts, and inspect pull-request approval.</p>
<h2>Why Add It</h2>
<p>A branch such as <code>feature/ADO-456-description</code> is a strong local signal, but the ticket's title, state and discussion live in Azure DevOps. The connector lets DevTrack enrich the signal and prepare the administrative update while the developer stays in the terminal.</p>
<h2>1. Create a Least-Privilege PAT</h2>
<p>In Azure DevOps, open User settings → Personal access tokens. Scope the token to the organization/projects DevTrack needs and grant only the work-item/code permissions required by the commands you plan to use.</p>
<pre><code class="language-bash">AZURE_DEVOPS_PAT=&lt;secret&gt;</code></pre>
<h2>2. Configure the Workspace</h2>
<pre><code class="language-yaml">workspaces:
  - name: my-service
    path: /absolute/path/to/my-service
    enabled: true
    pm_platform: azure
    pm_org: my-organization
    pm_project: My Project
    pm_username: developer@example.com
    ticket_pattern: '(ADO-[0-9]+)'</code></pre>
<p>Keep the PAT in the environment. Keep organization, project, username and ticket routing in the workspace file.</p>
<h2>3. Verify Before Sync</h2>
<pre><code class="language-bash">devtrack workspace reload
devtrack azure-check
devtrack azure-list
devtrack azure-view &lt;work-item-id&gt;</code></pre>
<p>Use <code>azure-sync</code> only after list/view resolve the intended project.</p>
<h2>What DevTrack Uses It For</h2>
<ul>
<li>Assigned work-item list and detail retrieval.</li>
<li>Prepared comments and state transitions tied to exact ticket IDs.</li>
<li>GitHub/Azure alert parity for assignment/comment/state events.</li>
<li>Real pull-request approval checks through the Azure Pull Requests API.</li>
</ul>
<h2>Trust and Failure Behavior</h2>
<p>Outbound comments/state changes must enter the pending queue with confidence. An expired PAT, rate limit or unavailable Azure host is logged and retried/degraded; it must not block Git. Verify the exact organization/project if an ID exists in multiple Azure projects.</p>
</div>`,

  GITLAB: `<div class="md-body">

  MCP_CLAUDE_CODE: `<div class="md-body">
<h1>MCP and Agent Memory</h1>
<div class="home-badge" style="margin-bottom:24px;background:var(--callout-tip);border-color:var(--callout-tip-border);color:#166534;">Available in v3.1.1 · official MCP Registry record active/latest</div>
<blockquote><p>The commands on this page ship in v3.1.1. Five privacy-declaring native MCPB bundles are published for Windows, macOS, and Linux.</p></blockquote>

<h2>Why DevTrack Added MCP</h2>
<p>AI coding assistants usually know the files in the current conversation but not the developer's working history. They do not automatically know which ticket is active, what was committed earlier today, what DevTrack is waiting to send, or how the developer normally writes a project update. That missing context forces the developer to repeat information and allows different assistants to build inconsistent versions of the same story.</p>
<p>DevTrack already records those signals locally while doing its normal job. MCP turns that local record into a standard, read-only context interface. An MCP-capable assistant can ask DevTrack for current facts instead of asking the developer to reconstruct them. This makes DevTrack the memory layer shared by coding assistants; it does not replace them and it does not give them permission to perform DevTrack actions.</p>

<h2>What MCP Helps With</h2>
<div class="table-wrap"><table>
<thead><tr><th>Without DevTrack MCP</th><th>With DevTrack MCP</th></tr></thead>
<tbody>
<tr><td>You repeatedly explain the current ticket and repository.</td><td>The assistant reads the latest local ticket mapping and its confidence.</td></tr>
<tr><td>A new chat loses the day's earlier commit context.</td><td>The assistant can retrieve today's commits grouped by ticket.</td></tr>
<tr><td>The assistant may propose work already completed or ignore work still pending.</td><td>It can inspect ticket history and the pending-actions queue before advising.</td></tr>
<tr><td>Generated reports use a generic tone.</td><td>The assistant can read learned style inferences before drafting text.</td></tr>
<tr><td>Building a standup requires manually collecting Git history.</td><td>A deterministic local EOD summary is available even without an LLM.</td></tr>
</tbody></table></div>

<h2>Important Safety Boundary</h2>
<p>All six MCP tools are <strong>read-only</strong>. Their declarations include human-readable titles plus read-only, non-destructive, idempotent, and no-open-world safety hints. They expose selected local context but cannot approve a queue item, post a comment, change a ticket, push Git, edit the database, or start and stop the daemon. Outbound work still uses DevTrack's pending-actions queue and normal CLI review commands.</p>
<p>The MCP process reads the same local SQLite database as the Go client. It does not contact the Python server, PostgreSQL, Ollama, a PM platform or a cloud API. However, the MCP host can see the tool response, so only configure DevTrack in assistants you trust with the displayed ticket metadata, commit messages and action previews.</p>

<h2>How the Connection Works</h2>
<ol>
<li>You run <code>devtrack mcp setup</code> in a project.</li>
<li>DevTrack adds a <code>devtrack</code> server entry to that project's <code>.mcp.json</code>. Existing server entries are preserved.</li>
<li>When the AI host needs a tool, it launches the installed DevTrack binary with the <code>mcp</code> argument.</li>
<li>The host and DevTrack negotiate a finalized MCP handshake version through <code>2025-11-25</code>, retaining compatibility with the earlier <code>2024-11-05</code>, <code>2025-03-26</code>, and <code>2025-06-18</code> revisions.</li>
<li>The selected tool reads local SQLite through DevTrack's database layer and returns structured JSON.</li>
<li>The subprocess exits when the host session shuts down. There is no MCP port or permanent MCP daemon.</li>
</ol>
<pre><code class="language-text">MCP-capable assistant
        |
        | JSON-RPC 2.0 over stdio
        v
devtrack mcp  ---- read only ----> local DevTrack SQLite
        X                              |
  no network call               commits, tickets,
  no PostgreSQL                 pending actions,
  no Ollama                     learned inferences</code></pre>

<h2>Set It Up Step by Step</h2>
<h3>1. Confirm the Installed Release</h3>
<pre><code class="language-bash">devtrack version
devtrack mcp status</code></pre>
<p><code>status</code> should report handshake support through <code>2025-11-25</code>, stdio transport, and six registered tools. The per-request protocol introduced in <code>2026-07-28</code> is not yet supported.</p>

<h3>2. Create the Project Configuration</h3>
<pre><code class="language-bash">cd /path/to/the/project
devtrack mcp setup</code></pre>
<p>To configure another directory without changing directories:</p>
<pre><code class="language-bash">devtrack mcp setup --dir /path/to/the/project</code></pre>
<p>The command is safe to re-run. If the <code>devtrack</code> entry already exists, it reports that state instead of creating a duplicate.</p>

<h3>3. Understand the Generated File</h3>
<pre><code class="language-json">{
  "mcpServers": {
    "devtrack": {
      "command": "/usr/local/bin/devtrack",
      "args": ["mcp"],
      "env": {
        "DEVTRACK_ENV_FILE": "/home/user/.devtrack/devtrack.env"
      }
    }
  }
}</code></pre>
<p><code>command</code> is the absolute path to the DevTrack binary used during setup. <code>DEVTRACK_ENV_FILE</code> points to the configuration registered by <code>devtrack setup</code>, which lets the MCP subprocess locate the same data directory as the daemon.</p>

<h3>4. Understand MCPB Packaging</h3>
<p>v3.1.1 publishes manifest 0.3 MCPB bundles for Windows x64, macOS x64/arm64, and Linux x64/arm64. Each manifest declares the public privacy policy, and each bundled README contains a Privacy Policy section. A packaged host asks the user to select an existing <code>devtrack.db</code>, then starts the bundled binary as:</p>
<pre><code class="language-bash">devtrack mcp serve --database /path/to/devtrack.db</code></pre>
<p>CI creates and executes each native bundle, validates manifests with the official MCPB CLI, and checks clean-project setup plus protocol behavior. The release publishes checksums and <code>server.json</code>; version 3.1.1 is active/latest in the official MCP Registry.</p>

<h3>5. Run the Built-In Self-Test</h3>
<pre><code class="language-bash">devtrack mcp test</code></pre>
<p>The test opens the real local database when available, starts an in-process MCP server, sends <code>initialize</code>, <code>tools/list</code>, <code>get_active_context</code> and <code>shutdown</code>, then prints each response. <code>=== PASS ===</code> proves the protocol loop completed; inspect warnings separately if the database could not be opened.</p>

<h3>6. Reload the AI Host</h3>
<p>Close and reopen, or reload, the MCP-capable assistant in that project so it notices <code>.mcp.json</code>. The server should appear under the name <code>devtrack</code>. No background MCP process should be visible before the assistant invokes it.</p>

<h2>The Six Tools in Detail</h2>
<div class="table-wrap"><table>
<thead><tr><th>Tool</th><th>When an assistant should use it</th><th>Input</th><th>Returned facts</th></tr></thead>
<tbody>
<tr><td><code>get_active_context</code></td><td>At the beginning of a work conversation.</td><td>None</td><td>Most recent ticket mapping, repository, mapping confidence, today's commit count, pending-action count and last commit time.</td></tr>
<tr><td><code>get_today_commits</code></td><td>When summarizing progress or checking what changed today.</td><td>Optional <code>repo_path</code></td><td>Commit hashes, messages, timestamps and repositories grouped by ticket; unlinked commits remain visible.</td></tr>
<tr><td><code>get_pending_actions</code></td><td>Before suggesting that an update be sent or duplicated.</td><td>None</td><td>Pending IDs, types, targets, platforms, confidence, expiry and a bounded payload preview.</td></tr>
<tr><td><code>get_voice_profile</code></td><td>Before drafting text that should sound like the developer.</td><td>Optional context: <code>commit</code>, <code>comment</code>, <code>report</code>, <code>task</code> or <code>ticket_mapping</code></td><td>Local style inferences with confidence/source and learned skills with evidence counts.</td></tr>
<tr><td><code>get_ticket_context</code></td><td>When discussing a named ticket.</td><td>Required <code>ticket_id</code>, such as <code>PROJ-123</code></td><td>Up to ten recent linked commits, actions targeting that ticket and last activity time.</td></tr>
<tr><td><code>get_eod_summary</code></td><td>For a fast standup or end-of-day factual baseline.</td><td>None</td><td>Today's date label, tickets touched, commit count, per-ticket messages and a template narrative. It is not an LLM-generated report.</td></tr>
</tbody></table></div>

<h2>Example Questions and Tool Flow</h2>
<h3>“What am I working on?”</h3>
<ol><li>Call <code>get_active_context</code>.</li><li>If the ticket is known, call <code>get_ticket_context</code>.</li><li>State the confidence and distinguish observed facts from inference.</li></ol>

<h3>“Write my standup update.”</h3>
<ol><li>Call <code>get_eod_summary</code> for the factual baseline.</li><li>Call <code>get_today_commits</code> when commit-level detail is needed.</li><li>Call <code>get_voice_profile</code> with <code>report</code>.</li><li>Draft the text, but do not imply it was sent or approved.</li></ol>

<h3>“What should I do next on PROJ-123?”</h3>
<ol><li>Call <code>get_ticket_context</code> for <code>PROJ-123</code>.</li><li>Call <code>get_pending_actions</code> to avoid duplicating a prepared update.</li><li>Use repository/code context for the implementation recommendation; DevTrack MCP supplies work history, not the full PM ticket body or source tree.</li></ol>

<h2>Data Freshness and Limitations</h2>
<ul>
<li>Results are only as current as the local SQLite records. If the daemon is stopped, new commits may not yet be observed.</li>
<li>The active context is based on the most recent recorded commit. It is not a claim that the developer is currently typing in that repository.</li>
<li>MCP does not fetch live ticket descriptions from GitHub, GitLab, Azure DevOps or Jira.</li>
<li>The voice tool returns Go-owned learned inferences and skills. It is not a direct export of the Python ChromaDB corpus or generated <code>profile.md</code>.</li>
<li>The EOD MCP summary is deterministic and commit-based. Use <code>devtrack eod generate</code> for the richer server-generated narrative.</li>
<li>An empty result is valid on a new installation. It does not mean the MCP connection failed.</li>
</ul>

<h2>Troubleshooting</h2>
<div class="table-wrap"><table>
<thead><tr><th>Problem</th><th>Resolution</th></tr></thead>
<tbody>
<tr><td>The assistant does not list DevTrack</td><td>Confirm <code>.mcp.json</code> is in the project root, reload the assistant, and run <code>devtrack mcp status</code>.</td></tr>
<tr><td>The configured binary no longer exists</td><td>Reinstall DevTrack, remove only the stale <code>devtrack</code> entry, and rerun <code>devtrack mcp setup</code>.</td></tr>
<tr><td>Tools return no commits</td><td>Run <code>devtrack status</code>, confirm the workspace is enabled, and inspect <code>devtrack logs -f</code>. A brand-new database is expected to be empty.</td></tr>

<tr><td>Protocol self-test warns that the database cannot open</td><td>Run normal setup once, verify the data-directory permissions, then rerun <code>devtrack mcp test</code>.</td></tr>

// ── Build Navigation ──────────────────────────────────────────────────────────
function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV.map(group => `
    <div class="nav-group">
      <div class="nav-group-label">${group.group}</div>
      ${group.items.map(item => `

          ${item.label}
        </a>
      `).join('')}

// ── Setup Listeners ───────────────────────────────────────────────────────────
function setupListeners() {
  document.getElementById('themeToggle').onclick = () => setTheme(theme === 'light' ? 'dark' : 'light');
  document.getElementById('sidebarToggle').onclick = toggleSidebar;
  document.getElementById('searchInput').addEventListener('input', handleSearch);
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Escape') { clearSearch(); }
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.sidebar-search')) clearSearch();
  });
  window.addEventListener('hashchange', () => {
    const hash = location.hash.slice(1);
    if (!hash) return;
    // Only navigate to a new doc if this hash is a known doc/content ID.
    // In-page heading anchors (e.g. #local-installation-recommended) are not
    // doc IDs — ignore them so they don't trigger a failed loadMarkdown call.
    const isDocId = hash === 'home' || CONTENT[hash] ||
      NAV.some(g => g.items.some(item => item.id === hash));
    if (isDocId && hash !== currentPage) navigate(hash, false);
  });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      document.getElementById('searchInput').focus();
    }
  });
}

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  const sb = document.getElementById('sidebar');
  if (window.innerWidth <= 768) {
    sb.classList.toggle('open', sidebarOpen);
    sb.classList.remove('collapsed');
  } else {
    sb.classList.toggle('collapsed', !sidebarOpen);
  }
}

// ── Navigate ──────────────────────────────────────────────────────────────────
function navigate(id, pushHistory = true) {
  currentPage = id;
  if (pushHistory) history.replaceState(null, '', '#' + id);

  // Update active nav
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  // Update breadcrumb
  const label = getLabel(id);
  document.getElementById('breadcrumbCurrent').textContent = label;

  // Close mobile sidebar
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
  }

  if (id === 'home') {
    renderHome();
  } else if (CONTENT[id]) {
    renderInlineContent(id);
  } else {
    loadMarkdown(id);
  }

  document.getElementById('contentWrap').scrollTop = 0;
}

function getLabel(id) {
  for (const group of NAV) {
    for (const item of group.items) {
      if (item.id === id) return item.label;
    }
  }
  return id;
}

// ── Inline Content Renderer ───────────────────────────────────────────────────
function renderInlineContent(id) {
  const content = document.getElementById('content');
  content.innerHTML = CONTENT[id];
  addCodeToolbars(content);
  safeHighlightAll();
  buildTOC(content);
}

// ── Load & Render Markdown ────────────────────────────────────────────────────
async function loadMarkdown(id) {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="state-msg"><div class="spinner"></div><span>Loading…</span></div>';

  const url = DOCS_BASE + id + '.md';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md = await res.text();
    renderMarkdown(md, content);
  } catch (err) {
    content.innerHTML = `
      <div class="state-msg">
        <svg width="40" height="40" viewBox="0 0 20 20" fill="currentColor" style="opacity:.3"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
        <strong>Could not load ${id}.md</strong>
        <span style="font-size:.8rem;max-width:320px;">
          Failed to load the document. Please try refreshing the page.
        </span>
      </div>`;
  }
}

function scrollToHeading(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function slugify(text) {
  return text
    .replace(/<[^>]+>/g, '')   // strip HTML tags from text
    .toLowerCase()
    .trim()
    .replace(/[^\w\s-]/g, '')  // remove non-word chars (keeps hyphens)
    .replace(/[\s_]+/g, '-')   // spaces/underscores → hyphens
    .replace(/^-+|-+$/g, '');  // trim leading/trailing hyphens
}

function mermaidTheme() {
  return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'neutral';
}

function safeHighlightAll() {
  if (window.hljs) hljs.highlightAll();
}

function renderMermaid(container) {
  const nodes = Array.from(container.querySelectorAll('.mermaid'));
  if (!nodes.length || !window.mermaid) return;
  mermaid.initialize({ startOnLoad: false, theme: mermaidTheme(), securityLevel: 'loose' });
  mermaid.run({ nodes }).catch(() => {});
}

function renderMarkdown(md, container) {
  if (!window.marked) {
    const escaped = md
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    container.innerHTML = `<div class="md-body"><blockquote><p>Formatted Markdown support could not be loaded. The complete document is shown below.</p></blockquote><pre style="white-space:pre-wrap;overflow-wrap:anywhere;">${escaped}</pre></div>`;
    return;
  }
  // Configure marked
  marked.setOptions({ breaks: true, gfm: true });

  const renderer = new marked.Renderer();

  // Mermaid code fences → div.mermaid (source stored in data-src for theme re-renders)
  const _defaultCode = renderer.code.bind(renderer);
  renderer.code = (code, lang, escaped) => {
    if (lang === 'mermaid') {
      return `<div class="mermaid" data-src="${encodeURIComponent(code)}">${code}</div>\n`;
    }
    return _defaultCode(code, lang, escaped);
  };

  // Headings with slug IDs so in-page anchor links (#section) scroll correctly
  renderer.heading = (text, level) => {
    const id = slugify(text);
    return `<h${level} id="${id}">${text}</h${level}>\n`;
  };

  // Wrap tables
  renderer.table = (header, body) =>
    `<div class="table-wrap"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;

  // Open external links in new tab, rewrite internal .md links, handle in-page anchors
  renderer.link = (href, title, text) => {
    if (href && href.endsWith('.md')) {
      const id = href.replace(/.*\//, '').replace('.md', '');
      return `<a href="#${id}" onclick="navigate('${id}');return false;"${title ? ` title="${title}"` : ''}>${text}</a>`;
    }
    // In-page anchor: content lives inside overflow-y:auto container so native
    // browser anchor scroll targets the wrong scroll context — route through scrollToHeading()
    if (href && href.startsWith('#')) {
      const targetId = href.slice(1);
      return `<a href="${href}" onclick="scrollToHeading('${targetId}');return false;"${title ? ` title="${title}"` : ''}>${text}</a>`;
    }
    const ext = href && !href.startsWith('./') && !href.startsWith('../');
    return `<a href="${href}"${title ? ` title="${title}"` : ''}${ext ? ' target="_blank" rel="noopener"' : ''}>${text}</a>`;
  };

  marked.use({ renderer });

  const html = marked.parse(md);
  container.innerHTML = `<div class="md-body">${html}</div>`;

  addCodeToolbars(container);
  safeHighlightAll();
  buildTOC(container);
  renderMermaid(container);
}

// ── Code Toolbars & Copy Buttons ──────────────────────────────────────────────
function addCodeToolbars(container) {
  container.querySelectorAll('pre').forEach(pre => {
    const code = pre.querySelector('code');
    if (!code) return;
    const lang = (code.className.match(/language-(\w+)/) || [])[1] || '';
    const toolbar = document.createElement('div');
    toolbar.className = 'code-toolbar';
    toolbar.innerHTML = `
      <span class="code-lang">${lang}</span>
      <button class="copy-btn" onclick="copyCode(this)">Copy</button>
    `;
    pre.insertBefore(toolbar, code);
  });
}

function copyCode(btn) {
  const code = btn.closest('pre').querySelector('code');
  navigator.clipboard.writeText(code.innerText).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

// ── Table of Contents ─────────────────────────────────────────────────────────
function buildTOC(container) {
  const headings = container.querySelectorAll('h2, h3');
  if (headings.length < 3) return;

  const existing = document.querySelector('.toc-panel');
  if (existing) existing.remove();

  const toc = document.createElement('div');
  toc.className = 'toc-panel';
  toc.innerHTML = '<h6>On this page</h6>';

  headings.forEach((h, i) => {
    // Preserve slug IDs stamped by renderer.heading; only assign a fallback if missing
    const id = h.id || slugify(h.textContent) || ('heading-' + i);
    h.id = id;
    const a = document.createElement('a');
    a.href = '#' + id;
    a.textContent = h.textContent;
    a.className = h.tagName === 'H3' ? 'toc-h3' : '';
    a.onclick = (e) => {
      e.preventDefault();
      h.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    toc.appendChild(a);
  });

  document.querySelector('.main').appendChild(toc);

  // Highlight active TOC item on scroll
  const wrap = document.getElementById('contentWrap');
  wrap.addEventListener('scroll', () => {
    const links = toc.querySelectorAll('a');
    let active = null;
    headings.forEach((h, i) => {
      if (h.getBoundingClientRect().top < 100) active = i;
    });
    links.forEach((a, i) => a.classList.toggle('active', i === active));
  }, { passive: true });
}

// ── Search ────────────────────────────────────────────────────────────────────
let allItems = [];
NAV.forEach(g => g.items.forEach(item => allItems.push({ ...item, group: g.group })));

function handleSearch(e) {
  const q = e.target.value.trim().toLowerCase();
  const container = document.getElementById('searchResults');
  if (!q) { container.style.display = 'none'; return; }

  const results = allItems.filter(item =>
    item.label.toLowerCase().includes(q) ||
    item.group.toLowerCase().includes(q) ||
    item.id.toLowerCase().includes(q)
  );

  if (results.length === 0) {
    container.style.display = 'block';
    container.innerHTML = '<div class="search-no-results">No results found</div>';
    return;
  }

  container.style.display = 'block';
  container.innerHTML = results.slice(0, 8).map(item => `
    <div class="search-result-item" onclick="navigate('${item.id}'); clearSearch();">
      <div class="search-result-title">${item.label}</div>
      <div class="search-result-section">${item.group}</div>
    </div>
  `).join('');
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').style.display = 'none';
}
</script>
