  TICKET_ALERTER: `<div class="md-body">
<h1>Ticket Alerter</h1>
<p>A background polling service that watches GitHub, Azure DevOps, and Jira for events relevant to you — delivering macOS OS notifications and terminal output so you never miss an assignment or comment.</p>

<h2>Quick Start</h2>
<h3>1. Configure environment variables</h3>
<pre><code class="language-bash">ALERT_ENABLED=true
ALERT_POLL_INTERVAL_SECS=300     # poll every 5 minutes

# Per-source toggles
ALERT_GITHUB_ENABLED=true
ALERT_AZURE_ENABLED=true
ALERT_JIRA_ENABLED=true

# Per-event toggles
ALERT_NOTIFY_ASSIGNED=true
ALERT_NOTIFY_COMMENTS=true
ALERT_NOTIFY_STATUS_CHANGES=true
ALERT_NOTIFY_REVIEW_REQUESTED=true   # GitHub only

# Optional: filter out your own Azure/Jira comments
# AZURE_EMAIL=you@yourorg.com</code></pre>

<h3>2. Start the daemon</h3>
<pre><code class="language-bash">devtrack start</code></pre>
<p>The alerter poller starts automatically as a subprocess of the daemon when <code>ALERT_ENABLED=true</code>.</p>

<h3>3. View notifications</h3>
<pre><code class="language-bash">devtrack alerts            # show unread notifications (last 24h)
devtrack alerts --all      # show all notifications
devtrack alerts --clear    # mark all as read</code></pre>

<h2>Events by Source</h2>
<div class="table-wrap"><table>
<thead><tr><th>Source</th><th>Events</th><th>Notes</th></tr></thead>
<tbody>
<tr><td><strong>GitHub</strong></td><td>Assigned to issue or PR</td><td>Checks <code>assignee</code> field</td></tr>
<tr><td></td><td>Review requested on PR</td><td><code>ALERT_NOTIFY_REVIEW_REQUESTED</code></td></tr>
<tr><td></td><td>Comment on issue/PR you're involved in</td><td>Filters own comments</td></tr>
<tr><td><strong>Azure DevOps</strong></td><td>Work item assigned to you</td><td>First-run guard (skips on cold start)</td></tr>
<tr><td></td><td>Comment added to your work items</td><td>Filters <code>AZURE_EMAIL</code> author</td></tr>
<tr><td></td><td>State changed on your work items</td><td>First-run guard</td></tr>
<tr><td><strong>Jira</strong></td><td>Issue assigned to you</td><td>JQL <code>assignee changed to currentUser()</code></td></tr>
<tr><td></td><td>Comment on your issues</td><td>Filters own email</td></tr>
<tr><td></td><td>Status changed on your issues</td><td>JQL <code>status changed</code></td></tr>
</tbody>
</table></div>

<h2>Notification Delivery</h2>
<h3>macOS OS Notifications</h3>
<p>Uses <code>osascript</code> to show a native notification:</p>
<pre><code>DevTrack Alert — GitHub
"PR Review Requested: Fix login redirect (#142)"</code></pre>
<p>Configure <code>ALERT_NOTIFY_OS=true</code> (default <code>true</code>).</p>

<h3>Terminal Output</h3>
<p>When the daemon is running in a terminal session, alerts are also printed to stdout. Configure <code>ALERT_NOTIFY_TERMINAL=true</code> (default <code>true</code>).</p>

<h2>Architecture</h2>
<pre><code>alert_poller.py  (async, runs as daemon subprocess)
  ├── GitHubAlerter    — GitHub REST API
  ├── AzureAlerter     — Azure DevOps REST API
  └── JiraAlerter      — Jira REST API (v1.4-dev)
          │
          ▼
  MongoAlertsStore     — MongoDB notifications + alert_state collections
  SQLite fallback      — alert_state stored locally when MongoDB unavailable (v1.4-dev)
          │
          ▼
  AlertNotifier
    ├── macOS: osascript
    └── Terminal: stdout (if TTY)</code></pre>
<p>Each alerter tracks <code>last_checked</code> per user in the <code>alert_state</code> collection so only new events are processed on each poll cycle.</p>

<h2>SQLite Fallback <span style="font-size:.75rem;font-weight:400;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 8px;margin-left:6px;">v1.4-dev</span></h2>
<p>When <code>MONGODB_URI</code> is not set, the alerter stores delta-sync timestamps in the local SQLite database. The <code>alert_state</code> table holds the last poll time per source, ensuring you don't see duplicate notifications across daemon restarts. This makes the alerter fully functional in offline-first mode without any external database.</p>
<pre><code class="language-sql">-- alert_state table schema
CREATE TABLE alert_state (
    source TEXT PRIMARY KEY,
    last_checked TEXT NOT NULL  -- ISO8601 timestamp
);</code></pre>

<h2>MongoDB Schema</h2>
<pre><code>notifications collection:
  _id:        ObjectId
  source:     "github" | "azure" | "jira"
  event_type: "assigned" | "comment" | "status_change" | "review_requested"
  ticket_id:  "owner/repo#123" | "PROJ-42"
  title:      "Fix login bug"
  summary:    "Alice commented: LGTM"
  url:        "https://..."
  timestamp:  datetime
  read:       false
  dismissed:  false
  raw:        { ...full API payload... }</code></pre>

<h2>Implementation Files</h2>
<div class="table-wrap"><table>
<thead><tr><th>File</th><th>Purpose</th></tr></thead>
<tbody>
<tr><td><code>backend/alert_poller.py</code></td><td>Main async poller; orchestrates all sources</td></tr>
<tr><td><code>backend/alert_notifier.py</code></td><td>macOS osascript + terminal output</td></tr>
<tr><td><code>backend/alerters/github_alerter.py</code></td><td>GitHub assigned/comments/review-requests</td></tr>
<tr><td><code>backend/alerters/azure_alerter.py</code></td><td>Azure DevOps assigned/comments/state-changes</td></tr>
<tr><td><code>backend/alerters/jira_alerter.py</code></td><td>Jira assigned/comments/status-changes (26 tests)</td></tr>
<tr><td><code>backend/db/mongo_alerts.py</code></td><td>MongoAlertsStore: notifications + alert_state</td></tr>
<tr><td><code>devtrack-bin/database.go</code></td><td>SQLite alert_state Get/Set accessors</td></tr>
</tbody>
</table></div>

<h2>Jira Alerter <span style="font-size:.75rem;font-weight:400;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 8px;margin-left:6px;">v1.4-dev</span></h2>
<p>The <code>JiraAlerter</code> class (fully tested with 26 pytest tests) polls Jira Cloud for three event types:</p>
<ul>
<li><strong>Assigned</strong>: JQL <code>assignee changed to currentUser() AFTER "..."</code> with first-run guard</li>
<li><strong>Comments</strong>: Fetches comments on assigned issues, skips own comments via <code>JIRA_EMAIL</code></li>
<li><strong>Status changes</strong>: JQL + changelog delta, emits <code>old_status → new_status</code> notifications</li>
</ul>
<p>Configuration: <code>ALERT_JIRA_ENABLED=true</code> plus standard <code>JIRA_URL</code>, <code>JIRA_EMAIL</code>, <code>JIRA_API_TOKEN</code> variables.</p>

<h2>Troubleshooting</h2>
<p><strong>No notifications appearing</strong></p>
<ul>
<li>Check <code>ALERT_ENABLED=true</code> and the per-source toggle (<code>ALERT_GITHUB_ENABLED</code>, etc.)</li>
<li>Verify the daemon is running: <code>devtrack status</code></li>
<li>Check logs: <code>devtrack logs | grep alert</code></li>
</ul>
<p><strong>Getting your own comments as notifications</strong></p>
<ul>
<li>Set <code>AZURE_EMAIL=you@yourorg.com</code> (Azure/Jira filter)</li>
<li>The alerters automatically skip comments where the author matches your configured email</li>
</ul>
<p><strong>First poll shows no results (Azure/Jira)</strong></p>
<ul>
<li>Expected — first-run guard skips assigned and state-change events on the initial poll to avoid a flood of old notifications. Subsequent polls will catch new events.</li>
</ul>
<p><strong>MongoDB not configured</strong></p>
<ul>
<li>The alerter works fully without MongoDB — alert state is stored in SQLite and notifications are written to the local SQLite <code>notifications</code> table. Set <code>MONGODB_URI</code> only if you need cross-device notification sync.</li>
</ul>
</div>`,

  TELEMETRY: `<div class="md-body">
<h1>Telemetry</h1>
<div class="home-badge" style="margin-bottom:24px;background:var(--callout-tip);border-color:var(--callout-tip-border);color:#166534;">Tier 2 implemented (v1.4-dev) — Tier 1 &amp; 3 planned</div>

<p>DevTrack's telemetry system is a <strong>privacy-first, three-tier</strong> approach to understanding how many people download and use the tool — without ever collecting personal data. Telemetry is always opt-in and the binary works identically with it on or off.</p>

<blockquote><p><strong>Status (v1.4-dev):</strong> Tier-2 anonymous install and active pings are now implemented in <code>devtrack-bin/ping.go</code> and sent to <code>https://ping.devtrack.dev</code> (Cloudflare Worker). Two events fire: <code>install</code> on first run and <code>active</code> at most once per 24 hours. Tier-1 (GitHub Releases download stats) and Tier-3 (registered-user heartbeats) remain planned.</p></blockquote>

<h2>Three Tiers at a Glance</h2>
<div class="table-wrap"><table>
<thead><tr><th>Tier</th><th>Source</th><th>What it measures</th><th>Code needed</th></tr></thead>
<tbody>
<tr><td><strong>1 — Downloads</strong></td><td>GitHub Releases API</td><td>Binary download counts per release, star count, forks</td><td>None — polled every 15 min by the server</td></tr>
<tr><td><strong>2 — Anonymous usage</strong></td><td>Go binary (opt-in)</td><td>install / command / heartbeat / signup events; random UUID; no PII</td><td><code>devtrack-bin/telemetry.go</code> + CLI wiring</td></tr>
<tr><td><strong>3 — Registered users</strong></td><td>CS-4 cloud server</td><td><code>api_keys.last_seen_at</code> — active registered users (D1/D7/D30)</td><td><code>api_keys</code> table extension</td></tr>
</tbody>
</table></div>

<h2>Privacy Design</h2>
<div class="table-wrap"><table>
<thead><tr><th>Property</th><th>Detail</th></tr></thead>
<tbody>
<tr><td><strong>Default OFF</strong></td><td>Telemetry is disabled until you explicitly run <code>devtrack telemetry on</code></td></tr>
<tr><td><strong>Anonymous UUID</strong></td><td><code>install_id</code> is a random UUID with no link to your identity, email, or machine name</td></tr>
<tr><td><strong>No PII ever</strong></td><td>Repo paths, commit messages, file names, usernames, API keys, and workspace names are never sent</td></tr>
<tr><td><strong>Local-first safe</strong></td><td>All telemetry POSTs are fire-and-forget on a goroutine; failures are silent and never block the CLI</td></tr>
<tr><td><strong>Transparent</strong></td><td><code>devtrack telemetry status</code> shows the exact payload that would be sent on the next event</td></tr>
</tbody>
</table></div>

<h3>What Is Sent</h3>
<div class="table-wrap"><table>
<thead><tr><th>Event</th><th>Trigger</th><th>Payload (no PII)</th></tr></thead>
<tbody>
<tr><td><code>install</code></td><td>First <code>devtrack telemetry on</code></td><td><code>version</code>, <code>os</code>, <code>arch</code></td></tr>
<tr><td><code>command</code></td><td>Each CLI invocation</td><td>Command name only (e.g. <code>work</code>, <code>tui</code>, <code>cloud</code>)</td></tr>
<tr><td><code>heartbeat</code></td><td>Daemon startup</td><td><code>version</code>, <code>active_features</code> bitmask</td></tr>
<tr><td><code>signup</code></td><td><code>devtrack cloud login</code> succeeds</td><td><code>version</code>, <code>os</code> only</td></tr>
</tbody>
</table></div>

<h3>What Is Never Sent</h3>
<ul>
<li>Repo paths or names</li>
<li>Commit messages or hashes</li>
<li>File names or diffs</li>
<li>Usernames or emails</li>
<li>API keys or tokens</li>
<li>Workspace names or ticket IDs</li>
</ul>

<h2>CLI Reference</h2>
<div class="table-wrap"><table>
<thead><tr><th>Command</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>devtrack telemetry on</code></td><td>Enable telemetry; generate <code>install_id</code> UUID if not already present; fire the <code>install</code> event</td></tr>
<tr><td><code>devtrack telemetry off</code></td><td>Disable telemetry; <code>install_id</code> is retained so re-enabling is seamless</td></tr>
<tr><td><code>devtrack telemetry status</code></td><td>Show enabled/disabled state, the first 8 chars of your <code>install_id</code>, and the exact payload that would be sent on the next event</td></tr>
</tbody>
</table></div>

<p>State is stored in <code>~/.devtrack/telemetry.json</code> (chmod 0600):</p>
<pre><code class="language-json">{
  "enabled": true,
  "install_id": "a3f8c2d1-…",
  "opted_in_at": "2026-03-29T10:00:00Z"
}</code></pre>

<h2>Real-Time Admin Dashboard</h2>
<p>When telemetry is enabled on the server, the Admin Console gains a live telemetry panel powered by <strong>Server-Sent Events (SSE) + HTMX</strong> — no JavaScript needed on the frontend.</p>

<h3>How It Works</h3>
<ol>
<li>Each <code>POST /telemetry/event</code> from a client binary inserts a row into <code>telemetry_events</code> and pushes the event into an <code>asyncio.Queue</code>.</li>
<li>The SSE endpoint (<code>GET /admin/telemetry/stream</code>) streams two event types:
  <ul>
    <li><code>counters</code> — aggregate stats (DAU, MAU, signups today, command histogram) pushed every 5 seconds</li>
    <li><code>live_event</code> — individual event row pushed immediately on each INSERT</li>
  </ul>
</li>
<li>HTMX on the admin dashboard subscribes to the SSE stream and swaps rendered HTML fragments directly — the server returns HTML, not raw JSON, so no client-side rendering is needed.</li>
</ol>

<pre><code class="language-html">&lt;!-- One persistent SSE connection; HTMX handles reconnect --&gt;
&lt;div hx-ext="sse" sse-connect="/admin/telemetry/stream"&gt;
  &lt;div id="stats-panel" sse-swap="counters" hx-swap="outerHTML"&gt;&lt;/div&gt;
  &lt;table&gt;
    &lt;tbody id="live-feed" sse-swap="live_event" hx-swap="afterbegin"&gt;&lt;/tbody&gt;
  &lt;/table&gt;
&lt;/div&gt;</code></pre>

<h3>GitHub Download Counts</h3>
<p>A background task on the server polls the GitHub Releases API every 15 minutes and caches the result in memory. Download counts are surfaced in the admin dashboard alongside live event counts — no binary changes needed for this tier.</p>
<pre><code class="language-bash"># Manual query (no auth needed for public repos)
curl -s https://api.github.com/repos/sraj0501/Devtrack_/releases \
  | jq '[.[] | {tag: .tag_name, downloads: [.assets[].download_count] | add}]'</code></pre>

<h2>Data Model</h2>
<h3>telemetry_events table</h3>
<pre><code class="language-sql">CREATE TABLE telemetry_events (
    id           INTEGER PRIMARY KEY AUTOINCREMENT,
    install_id   TEXT    NOT NULL,       -- random UUID; stable per install
    event        TEXT    NOT NULL,       -- "install"|"command"|"heartbeat"|"signup"
    props        TEXT    DEFAULT '{}',   -- JSON: {command, version, os, arch, features}
    received_at  TEXT    NOT NULL DEFAULT (datetime('now'))
);</code></pre>

<h2>New .env Variables</h2>
<div class="table-wrap"><table>
<thead><tr><th>Variable</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>TELEMETRY_ENABLED</code></td><td>Set to <code>true</code> to enable the <code>/telemetry/event</code> endpoint on the server (default: <code>false</code>)</td></tr>
<tr><td><code>GITHUB_REPO_SLUG</code></td><td>GitHub repo slug for download count polling (e.g. <code>sraj0501/Devtrack_</code>)</td></tr>
</tbody>
</table></div>

<h2>New Files (to be created)</h2>
<div class="table-wrap"><table>
<thead><tr><th>File</th><th>Purpose</th></tr></thead>
<tbody>
<tr><td><code>devtrack-bin/telemetry.go</code></td><td><code>TelemetryConfig</code>, <code>LoadTelemetryConfig()</code>, <code>SaveTelemetryConfig()</code>, <code>Track(event, props)</code> (non-blocking goroutine POST), <code>handleTelemetry()</code> CLI dispatcher</td></tr>
<tr><td><code>backend/telemetry/__init__.py</code></td><td>Package init</td></tr>
<tr><td><code>backend/telemetry/store.py</code></td><td><code>TelemetryStore</code>: INSERT event, aggregate queries (DAU, MAU, signups, command histogram)</td></tr>
<tr><td><code>backend/telemetry/router.py</code></td><td>FastAPI router: <code>POST /telemetry/event</code>, <code>GET /admin/telemetry/stream</code> (SSE)</td></tr>
<tr><td><code>backend/telemetry/github_stats.py</code></td><td>Background poller for GitHub Releases download counts (15-min interval)</td></tr>
<tr><td><code>backend/telemetry/stream.py</code></td><td><code>asyncio.Queue</code> shared state, <code>push_live_event()</code>, SSE generator</td></tr>
</tbody>
</table></div>

<blockquote><p><strong>Implementation status (v1.4-dev):</strong> Tier-2 anonymous pings are now implemented in <code>devtrack-bin/ping.go</code>. The <code>install</code> event fires on the first daemon start; the <code>active</code> event fires at most once per 24 hours. Both are fire-and-forget goroutines to a Cloudflare Worker at <code>https://ping.devtrack.dev</code>. The server-side foundation, real-time admin dashboard (Tier 1 GitHub stats, Tier 2 SSE live feed), and Tier-3 registered-user heartbeats described above remain planned. The four-phase implementation plan is documented in <code>docs/TELEMETRY_PLAN.md</code>.</p></blockquote>
</div>`,

  DEVTRACK_SERVER: `<div class="md-body">
<h1>devtrack-server CLI</h1>
<p>The <strong>devtrack-server</strong> tool is a standalone management CLI bundled inside the <code>devtrack-server-{version}.tar.gz</code> release tarball. It handles the complete lifecycle of a server-side DevTrack installation — downloading the right binary, running the setup wizard, and starting/stopping the daemon — without requiring users to clone the repository or manage paths manually.</p>

<div class="home-badge" style="margin-bottom:24px;background:var(--callout-tip);border-color:var(--callout-tip-border);color:#166534;">New in v2.1.0-dev — features/standalone-cli-mode</div>

<h2>Quick Start</h2>
<pre><code class="language-bash"># Download the server tarball from the GitHub releases page
curl -L https://github.com/sraj0501/Devtrack_/releases/latest/download/devtrack-server-linux-amd64.tar.gz | tar xz
cd devtrack-server/

# Install DevTrack (downloads the Go binary, runs uv sync, writes config)
devtrack-server install

# Run the interactive setup wizard
devtrack-server setup

# Start the daemon
devtrack-server start

# Check status
devtrack-server status</code></pre>

<h2>Commands</h2>
<div class="table-wrap"><table>
<thead><tr><th>Command</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>devtrack-server install</code></td><td>Download the DevTrack Go binary for the current OS/arch, run <code>uv sync</code> to install Python dependencies, and write the initial configuration skeleton</td></tr>
<tr><td><code>devtrack-server setup</code></td><td>Run the interactive <code>devtrack setup</code> wizard — prompts for LLM provider, PM platform, workspaces, and writes a complete <code>.env</code></td></tr>
<tr><td><code>devtrack-server start</code></td><td>Start the DevTrack daemon (equivalent to <code>devtrack start</code>)</td></tr>
<tr><td><code>devtrack-server stop</code></td><td>Stop the running daemon</td></tr>
<tr><td><code>devtrack-server status</code></td><td>Show daemon status and server health</td></tr>
<tr><td><code>devtrack-server upgrade</code></td><td>Download and install the latest release (calls <code>devtrack upgrade</code> internally)</td></tr>
<tr><td><code>devtrack-server logs</code></td><td>Tail daemon logs</td></tr>
</tbody>
</table></div>

<h2>Release Tarball Contents</h2>
<p>The <code>devtrack-server-{version}.tar.gz</code> release asset ships everything needed to run the Python backend on a fresh server:</p>
<ul>
<li><code>devtrack-server</code> — the management CLI binary</li>
<li><code>backend/</code> — Python backend source tree</li>
<li><code>pyproject.toml</code> + <code>uv.lock</code> — dependency manifest for <code>uv sync</code></li>
<li><code>.env_sample</code> — configuration template</li>
<li><strong>Excluded</strong>: development-only files (<code>.claude/</code>, <code>tests/</code>, CI configs, <code>workspaces.yaml</code>, <code>setup_local.sh</code>)</li>
</ul>

<h2>Relation to devtrack binary</h2>
<p>The <code>devtrack-server</code> CLI is a companion tool, not a replacement for the <code>devtrack</code> binary. After <code>devtrack-server install</code> downloads the <code>devtrack</code> binary and places it on <code>PATH</code>, all normal <code>devtrack &lt;cmd&gt;</code> commands work as documented elsewhere in this wiki. <code>devtrack-server</code> is only needed for the initial install and for server-level lifecycle tasks (upgrade, status from the OS perspective).</p>

<h2>Server vs Developer Install</h2>
<div class="table-wrap"><table>
<thead><tr><th>Scenario</th><th>Recommended path</th></tr></thead>
<tbody>
<tr><td>Developer laptop</td><td>Download the <code>devtrack_*.tar.gz</code> binary tarball → <code>devtrack setup</code></td></tr>
<tr><td>Headless server / VM</td><td>Download <code>devtrack-server-*.tar.gz</code> → <code>devtrack-server install</code> → <code>devtrack-server setup</code></td></tr>
<tr><td>Docker</td><td>Use the <code>docker compose</code> path in the Quick Start box on the Home page</td></tr>
</tbody>
</table></div>

<h2>setup_local.sh Removed</h2>
<p>The legacy <code>setup_local.sh</code> script has been removed. All functionality it provided is now covered by <code>devtrack setup</code> (interactive wizard) and <code>devtrack-server install</code> (headless server bootstrap). Existing installations using <code>setup_local.sh</code> should migrate to <code>devtrack setup</code>.</p>
</div>`,

  UPGRADE: `<div class="md-body">
<h1>Upgrade</h1>
<p>The <code>devtrack upgrade</code> command performs a self-update: it downloads the latest release binary for your OS and architecture from the GitLab Releases API, replaces the current binary on disk, and automatically restarts the running daemon.</p>

<div class="home-badge" style="margin-bottom:24px;background:var(--callout-tip);border-color:var(--callout-tip-border);color:#166534;">Updated in v2.2.11 — GitLab Releases API, Windows .zip, split upgrade_unix/upgrade_windows</div>

<h2>Quick Start</h2>
<pre><code class="language-bash"># Upgrade to the latest release
devtrack upgrade

# macOS / Linux: if the binary is in a root-owned directory (e.g. /usr/local/bin)
sudo devtrack upgrade</code></pre>

<h2>What It Does</h2>
<ol>
<li>Fetches the latest release tag from the <strong>GitLab Releases API</strong>.</li>
<li>If the current version is already up to date, exits with a message and does nothing.</li>
<li>Downloads the appropriate release asset for the current platform:
  <ul>
    <li>macOS / Linux: <code>devtrack_&lt;os&gt;_&lt;arch&gt;.tar.gz</code></li>
    <li>Windows: <code>devtrack_windows_&lt;arch&gt;.zip</code> — extracted using the standard library <code>archive/zip</code></li>
  </ul>
</li>
<li>Extracts the new binary to a temporary location and verifies it starts cleanly.</li>
<li>Replaces the current binary on disk:
  <ul>
    <li><strong>Unix</strong> (<code>upgrade_unix.go</code>): falls back to <code>sudo cp</code> automatically when the binary is in a root-owned directory.</li>
    <li><strong>Windows</strong> (<code>upgrade_windows.go</code>): if the binary location requires Administrator rights, prints clear guidance to re-run from an elevated prompt rather than silently failing.</li>
  </ul>
</li>
<li>Runs any <strong>versioned migrations</strong> needed to update local data files (<code>Data/</code>, <code>~/.devtrack/</code>) to the new schema.</li>
<li>If the daemon was running, restarts it automatically so the new version takes effect immediately — no manual <code>devtrack restart</code> needed.</li>
</ol>

<h2>Root-Owned / Administrator Installations</h2>
<h3>macOS / Linux</h3>
<p>If the <code>devtrack</code> binary lives in a directory owned by root (e.g. <code>/usr/local/bin/devtrack</code> installed with <code>sudo mv</code>), the upgrade command detects the write permission error and re-invokes itself with <code>sudo cp</code> automatically. You will be prompted for your password at that point. Alternatively, run the whole upgrade as root:</p>
<pre><code class="language-bash">sudo devtrack upgrade</code></pre>

<h3>Windows</h3>
<p>If the binary is installed in a protected directory (e.g. <code>C:\Program Files\</code>), the upgrade prints a message with the path of the new binary in the temp directory and instructs you to copy it manually from an Administrator prompt:</p>
<pre><code class="language-bash"># Run in an Administrator PowerShell or Command Prompt
Copy-Item "$env:TEMP\devtrack_new.exe" "C:\Program Files\devtrack\devtrack.exe" -Force</code></pre>

<h2>Versioned Migration System</h2>
<p>DevTrack keeps a <code>~/.devtrack/schema_version</code> file that records the last applied migration version. Each release can ship numbered migration steps (e.g. <code>migration_v2_2.go</code>) that run exactly once after the binary is replaced. Migrations handle:</p>
<ul>
<li>SQLite schema changes (new tables, new columns with <code>ALTER TABLE … ADD COLUMN</code>)</li>
<li>New required <code>.env</code> variables — migration prints a warning and the name of any missing vars rather than failing hard</li>
<li>Renamed keys in <code>~/.devtrack/devtrack.conf</code> or <code>~/.devtrack/cloud.json</code></li>
</ul>
<p>Migrations are additive and idempotent — running the same migration twice is safe.</p>

<h2>Auto-Restart After Upgrade</h2>
<p>After a successful binary replacement and migration, the upgrade command checks whether the DevTrack daemon is currently running (via the PID file at <code>Data/pids/daemon.pid</code>). If it is, it calls <code>devtrack restart</code> automatically so the new version is live without any extra steps.</p>

<blockquote><p><strong>Note:</strong> The auto-restart uses a short delay to allow the old daemon process to clean up its PID file before the new process writes a fresh one. If you see "daemon already running" after an upgrade, wait 3–5 seconds and run <code>devtrack status</code> to confirm the new version is active.</p></blockquote>

<h2>Rollback</h2>
<p>The upgrade does not keep a backup of the previous binary. If you need to roll back, download the previous release tarball from the GitLab Releases page and replace the binary manually.</p>

<h2>Implementation Files</h2>
<div class="table-wrap"><table>
<thead><tr><th>File</th><th>Purpose</th></tr></thead>
<tbody>
<tr><td><code>devtrack-bin/upgrade.go</code></td><td><code>RunUpgrade()</code> — GitLab API fetch, download, verify, extract (<code>.tar.gz</code> and <code>.zip</code>), auto-restart</td></tr>
<tr><td><code>devtrack-bin/upgrade_unix.go</code></td><td>Unix elevated-replace path — <code>sudo cp</code> fallback for root-owned binary locations</td></tr>
<tr><td><code>devtrack-bin/upgrade_windows.go</code></td><td>Windows elevated-replace path — prints Administrator guidance when write permission is denied</td></tr>
<tr><td><code>devtrack-bin/migrate.go</code></td><td>Migration registry, <code>RunMigrations()</code>, schema version tracking in <code>~/.devtrack/schema_version</code></td></tr>
</tbody>
</table></div>
</div>`,

  UNINSTALL: `<div class="md-body">
<h1>Uninstall</h1>
<p>The <code>devtrack uninstall</code> command performs a clean, interactive removal of DevTrack from your machine — stopping the daemon, removing autostart entries, deleting runtime data, and optionally removing the binary itself.</p>

<div class="home-badge" style="margin-bottom:24px;background:var(--callout-tip);border-color:var(--callout-tip-border);color:#166534;">New in v2.2.11 — feat/uninstall-and-upgrade-fix</div>

<h2>Quick Start</h2>
<pre><code class="language-bash"># Interactive uninstall (confirms each step)
devtrack uninstall

# Skip all confirmation prompts
devtrack uninstall --yes</code></pre>

<h2>What It Does</h2>
<ol>
<li><strong>Stops the running daemon</strong> — sends a stop signal if the daemon is currently running; waits for it to exit cleanly.</li>
<li><strong>Removes autostart</strong> — unregisters the launchd LaunchAgent (macOS), systemd user service (Linux), or shell profile block (WSL) that was installed by <code>devtrack autostart-install</code>.</li>
<li><strong>Deletes the data directory</strong> — removes <code>Data/</code> including the SQLite database, logs, PID files, TLS certs, and reports. Skipped if <code>DATA_DIR</code> is not set.</li>
<li><strong>Removes the <code>~/.devtrack/</code> directory</strong> — deletes the XDG home used by <code>devtrack setup</code> (<code>devtrack.conf</code>, <code>cloud.json</code>, <code>telemetry.json</code>, <code>schema_version</code>, <code>workspaces.yaml</code>).</li>
<li><strong>Removes the binary</strong> — deletes the <code>devtrack</code> binary from its current location. On Windows, asks you to remove it manually if a file lock prevents deletion.</li>
</ol>

<blockquote><p><strong>Note:</strong> Uninstall does <em>not</em> touch your monitored git repositories, the Python virtualenv created by <code>uv sync</code>, or your <code>.env</code> file. Those are left in place so you can reinstall without re-entering credentials.</p></blockquote>

<h2>Platform Behaviour</h2>
<div class="table-wrap"><table>
<thead><tr><th>Platform</th><th>Autostart removal</th><th>Binary removal</th></tr></thead>
<tbody>
<tr><td><strong>macOS</strong></td><td><code>launchctl unload</code> + plist file deleted</td><td><code>os.Remove</code> — no extra permissions needed for user-owned installs</td></tr>
<tr><td><strong>Linux</strong></td><td><code>systemctl --user disable --now</code> + unit file deleted</td><td><code>os.Remove</code></td></tr>
<tr><td><strong>Windows</strong></td><td>Shell profile block removed (WSL) or no-op if no autostart was installed</td><td>Prints the binary path and instructs you to delete it manually if it cannot be removed (common when the process is still in memory)</td></tr>
</tbody>
</table></div>

<h2>Flags</h2>
<div class="table-wrap"><table>
<thead><tr><th>Flag</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>--yes</code></td><td>Skip all confirmation prompts — performs every step automatically. Useful for CI or scripted teardowns.</td></tr>
</tbody>
</table></div>

<h2>What Is Not Removed</h2>
<ul>
<li>Your monitored git repositories and their commit history</li>
<li>The Python virtualenv created by <code>uv sync</code> (located under the project root)</li>
<li>Your <code>.env</code> file — credentials and configuration are preserved so reinstalling is fast</li>
<li>MongoDB data (if <code>MONGODB_URI</code> was configured)</li>
</ul>

<h2>Reinstalling After Uninstall</h2>
<pre><code class="language-bash"># Download the latest binary again
curl -L https://github.com/sraj0501/Devtrack_/releases/latest/download/devtrack_$(uname -s)_$(uname -m).tar.gz | tar xz
sudo mv devtrack /usr/local/bin/

# Re-run setup (or just source your preserved .env and start)
devtrack setup
devtrack start</code></pre>

<h2>Implementation Files</h2>
<div class="table-wrap"><table>
<thead><tr><th>File</th><th>Purpose</th></tr></thead>
<tbody>
<tr><td><code>devtrack-bin/cli.go</code></td><td><code>RunUninstall()</code> — orchestrates all uninstall steps; <code>--yes</code> flag handling; platform-detection for autostart and binary removal</td></tr>
</tbody>
</table></div>
</div>`,

  WHATS_NEW: `<div class="md-body">
<h1>What's New</h1>
<div class="home-badge" style="margin-bottom:24px;background:var(--callout-note);border-color:var(--callout-note-border);color:#1e40af;">v2.2.11 — released</div>

<h2>v2.2.11 — Uninstall Command, Upgrade Fixes &amp; Daemon Hardening</h2>
<p>This batch (merged from <code>feat/uninstall-and-upgrade-fix</code> via PRs #121–122) adds a cross-platform uninstall command, fixes the upgrade pipeline to use the GitLab Releases API and Windows <code>.zip</code> extraction, hardens the health monitor with concurrent checks and Redis/SQLite monitors, and eliminates log spam from empty repositories.</p>

<div class="feature-list" style="margin-bottom:32px;">
  <div class="feature-item"><div class="feature-dot">1</div><div><h4>devtrack uninstall — cross-platform clean removal (feat: 112da8f)</h4><p>New <code>devtrack uninstall</code> command (<code>devtrack-bin/cli.go</code>) performs an interactive, step-by-step teardown: stops the running daemon, removes the launchd LaunchAgent / systemd unit / shell profile block installed by <code>devtrack autostart-install</code>, deletes the <code>Data/</code> directory and the <code>~/.devtrack/</code> XDG home, and removes the binary. Each step asks for confirmation unless <code>--yes</code> is passed. On Windows, binary deletion prints a manual-removal hint if the file is locked. Your <code>.env</code>, Python virtualenv, and git repositories are left intact. See the <a href="#UNINSTALL" onclick="navigate('UNINSTALL');return false;">Uninstall</a> page.</p></div></div>
  <div class="feature-item"><div class="feature-dot">2</div><div><h4>devtrack upgrade — GitLab Releases API + Windows .zip fix (feat: 112da8f)</h4><p><code>devtrack upgrade</code> now fetches the latest release from the <strong>GitLab Releases API</strong> (not GitHub) and handles the Windows <code>.zip</code> asset alongside the Linux/macOS <code>.tar.gz</code> archives. The elevated-replace path has been split into <code>upgrade_unix.go</code> (which uses <code>sudo cp</code>) and <code>upgrade_windows.go</code> (which prints clear Administrator guidance instead of attempting a privileged copy that Windows UAC would block silently). See the <a href="#UPGRADE" onclick="navigate('UPGRADE');return false;">Upgrade</a> page.</p></div></div>
  <div class="feature-item"><div class="feature-dot">3</div><div><h4>Health monitor enhancements (feat: c537169)</h4><p>The <code>devtrack health</code> check has been overhauled: all service probes now run <strong>concurrently</strong> (reducing total wait time from sum-of-timeouts to max-of-timeouts), Redis and SQLite connection checks are included as first-class monitors, port numbers are persisted so health knows which port to probe without reading <code>.env</code> again, and Ollama model lists are normalised for consistent output regardless of the server version. These improvements make <code>devtrack health</code> significantly faster and more reliable in environments where some services are intentionally absent.</p></div></div>
  <div class="feature-item"><div class="feature-dot">4</div><div><h4>Empty-repo fix in git_monitor.go</h4><p>The git activity monitor previously logged a noisy warning on every poll when monitoring a repository that has no commits yet (e.g. a freshly <code>git init</code>-ed workspace). The monitor now silently skips repositories with no HEAD commit and resumes monitoring as soon as the first commit is made — no configuration change needed.</p></div></div>
  <div class="feature-item"><div class="feature-dot">5</div><div><h4>Windows single-instance enforcement (lock_windows.go + process_windows.go)</h4><p>On Windows, the daemon now uses <code>LockFileEx</code> (via <code>devtrack-bin/lock_windows.go</code>) to hold an exclusive lock on the PID file for the lifetime of the process — preventing a second <code>devtrack start</code> from running silently alongside the first. The Unix equivalent uses <code>flock</code> (<code>lock_unix.go</code>). Platform-specific process utilities live in <code>process_windows.go</code> and <code>process_unix.go</code>.</p></div></div>
</div>

<h2>New CLI Commands (v2.2.11)</h2>
<div class="table-wrap"><table>
<thead><tr><th>Command</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>devtrack uninstall [--yes]</code></td><td>Interactively remove DevTrack: stop daemon, remove autostart, delete Data/ and ~/.devtrack/, remove binary</td></tr>
</tbody>
</table></div>

<h2>New Source Files (v2.2.11)</h2>
<div class="table-wrap"><table>
<thead><tr><th>File</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>devtrack-bin/upgrade_unix.go</code></td><td>Unix elevated-replace path — <code>sudo cp</code> fallback for root-owned binary locations</td></tr>
<tr><td><code>devtrack-bin/upgrade_windows.go</code></td><td>Windows elevated-replace path — prints Administrator guidance when write permission is denied</td></tr>
<tr><td><code>devtrack-bin/lock_unix.go</code></td><td>Unix single-instance enforcement using <code>flock</code></td></tr>
<tr><td><code>devtrack-bin/lock_windows.go</code></td><td>Windows single-instance enforcement using <code>LockFileEx</code></td></tr>
<tr><td><code>devtrack-bin/process_unix.go</code></td><td>Unix process utilities (signal, PID resolution)</td></tr>
<tr><td><code>devtrack-bin/process_windows.go</code></td><td>Windows process utilities (OpenProcess, TerminateProcess)</td></tr>
</tbody>
</table></div>

<hr>
<div class="home-badge" style="margin-bottom:24px;background:var(--callout-note);border-color:var(--callout-note-border);color:#1e40af;">v2.1.0-dev — unreleased — features/standalone-cli-mode + main</div>

<h2>v2.1.0-dev — devtrack-server CLI, Self-Update, Lightweight Mode &amp; Setup Enhancements</h2>
<p>This batch (merged from <code>features/standalone-cli-mode</code> via PR #82) introduces a dedicated server management CLI for headless deployments, a self-update command, a new lightweight daemon mode for environments without Python, and a series of setup wizard improvements.</p>

<div class="feature-list" style="margin-bottom:32px;">
  <div class="feature-item"><div class="feature-dot">1</div><div><h4>devtrack-server management CLI (feat: 8196279, 94a3b40)</h4><p>A new <code>devtrack-server</code> binary ships in the <code>devtrack-server-{version}.tar.gz</code> release tarball. It handles the full headless server lifecycle: <code>devtrack-server install</code> downloads the Go binary and runs <code>uv sync</code>; <code>devtrack-server setup</code> launches the interactive wizard; <code>devtrack-server start/stop/status</code> manage the daemon. The tarball excludes development-only paths (<code>.claude/</code>, CI configs, <code>workspaces.yaml</code>). The legacy <code>setup_local.sh</code> script has been removed — all its functionality is now covered by <code>devtrack setup</code> and <code>devtrack-server install</code>. See the <a href="#DEVTRACK_SERVER" onclick="navigate('DEVTRACK_SERVER');return false;">devtrack-server CLI</a> page.</p></div></div>
  <div class="feature-item"><div class="feature-dot">2</div><div><h4>devtrack upgrade — self-update with versioned migration (feat: 214d78a)</h4><p>New <code>devtrack upgrade</code> command (<code>devtrack-bin/upgrade.go</code>) fetches the latest release from GitHub Releases, replaces the binary on disk (with automatic <code>sudo cp</code> fallback for root-owned install paths), runs any pending versioned migrations via <code>devtrack-bin/migrate.go</code>, and auto-restarts the daemon if it was running — all in one step. A <code>~/.devtrack/schema_version</code> file tracks which migrations have been applied. Run <code>sudo devtrack upgrade</code> if the binary is in a root-owned directory. See the <a href="#UPGRADE" onclick="navigate('UPGRADE');return false;">Upgrade</a> page.</p></div></div>
  <div class="feature-item"><div class="feature-dot">3</div><div><h4>Mode selection wizard — Managed / Lightweight / External (TASK-021, PR #82)</h4><p>The <code>devtrack setup</code> wizard now begins with a <strong>mode selection step</strong> that asks which server mode to use: <strong>Managed</strong> (daemon spawns the Python backend subprocess — the default), <strong>Lightweight</strong> (daemon runs with no Python dependency; git monitoring, scheduling, and SQLite logging all work, but AI and PM sync features are disabled), or <strong>External</strong> (user provides a separately-running backend URL). The selected mode is written to <code>.env</code> as <code>DEVTRACK_SERVER_MODE</code>. See the <a href="#SETUP_WIZARD" onclick="navigate('SETUP_WIZARD');return false;">Setup Wizard</a> and <a href="#CLOUD_MODE" onclick="navigate('CLOUD_MODE');return false;">Server Modes</a> pages for details.</p></div></div>
  <div class="feature-item"><div class="feature-dot">4</div><div><h4>Lightweight mode — daemon skips Python spawn (TASK-022)</h4><p>When <code>DEVTRACK_SERVER_MODE=lightweight</code>, the Go daemon starts without spawning the Python backend subprocess. Git monitoring, the cron scheduler, SQLite trigger logging, and the TUI dashboard all work normally. The 28 CLI commands that require the Python backend (AI enhancement, PM sync, report generation, etc.) are guarded: they print a clear "feature not available in lightweight mode" message and exit cleanly instead of hanging or crashing. This is the recommended mode for minimal environments (e.g., pure git activity logging without AI or PM integration). See the <a href="#CLOUD_MODE" onclick="navigate('CLOUD_MODE');return false;">Server Modes</a> page.</p></div></div>
  <div class="feature-item"><div class="feature-dot">5</div><div><h4>Setup wizard enhancements (feat: 491ccd3, 4ddf157, 9904c43)</h4><p>Three improvements to <code>devtrack setup</code>: (1) <strong>Git prereq check</strong> — the wizard now verifies <code>git</code> is installed and on <code>PATH</code> before proceeding; a clear error is shown with install instructions if missing. (2) <strong>Auto-generate ADMIN_SECRET_KEY</strong> — the wizard generates a cryptographically random 32-byte hex secret automatically, so no manual <code>python3 -c "..."</code> step is needed. (3) <strong>XDG home + shell integration written automatically</strong> — the wizard creates <code>~/.devtrack/</code> and writes the <code>eval "$(devtrack shell-init)"</code> line directly to the detected shell profile (<code>~/.zshrc</code> or <code>~/.bashrc</code>) so shell integration is active without any manual copy-paste. (4) <strong>workspaces.yaml bootstrap</strong> — a starter <code>workspaces.yaml</code> is written to the XDG home directory on first run and <code>WORKSPACES_FILE</code> is set in the generated <code>.env</code>. See the <a href="#SETUP_WIZARD" onclick="navigate('SETUP_WIZARD');return false;">Setup Wizard</a> page.</p></div></div>
  <div class="feature-item"><div class="feature-dot">6</div><div><h4>Repo references updated: automation_tools → Devtrack_ (chore: 6b66641)</h4><p>All internal references to the old repository name <code>sraj0501/automation_tools</code> have been updated to <code>sraj0501/Devtrack_</code>. This affects release download URLs, GitHub API slugs in telemetry, and documentation links. No configuration changes are required for existing installations.</p></div></div>
</div>

<h2>New CLI Commands (v2.1.0-dev)</h2>
<div class="table-wrap"><table>

<h2>v2.0.1-dev — Setup Wizard, Auto Env Load &amp; Config Hardening</h2>
<p>Three improvements shipped on the <code>features/loadEnvs</code> branch (PR #79 targeting main): a first-run interactive setup wizard, automatic <code>.env</code> resolution at daemon startup, and complete elimination of all remaining hardcoded values from the Admin Console.</p>

<div class="feature-list" style="margin-bottom:32px;">
  <div class="feature-item"><div class="feature-dot">1</div><div><h4>devtrack setup — interactive first-run wizard</h4><p>New <code>devtrack setup</code> command (<code>devtrack-bin/setup.go</code>) walks through the entire initial configuration in a guided terminal flow: prerequisite check (backend/, uv, Python), git workspace selection, LLM provider and credentials, user email, project management platform (GitHub / Azure DevOps / Jira / None), and shell integration / autostart instructions. On completion it writes a complete <code>.env</code> at the project root and registers its path in <code>~/.devtrack/devtrack.conf</code>. See the <a href="#SETUP_WIZARD" onclick="navigate('SETUP_WIZARD');return false;">Setup Wizard</a> page.</p></div></div>
  <div class="feature-item"><div class="feature-dot">2</div><div><h4>AutoLoadEnv — automatic .env resolution at startup</h4><p>New <code>AutoLoadEnv()</code> function (<code>devtrack-bin/loadenv.go</code>) is called at the very start of <code>main()</code>. It resolves the correct <code>.env</code> file using a three-step priority order: (1) <code>DEVTRACK_ENV_FILE</code> env var for CI/Docker overrides, (2) <code>~/.devtrack/devtrack.conf</code> — the path written by <code>devtrack setup</code>, (3) <code>.env</code> next to the binary for portable installs. Existing env vars are <strong>never overridden</strong> — shell exports, CI variables, and secret managers always win. The result: developers no longer need to manually <code>source .env</code> before running <code>devtrack</code> commands. See the <a href="#SETUP_WIZARD" onclick="navigate('SETUP_WIZARD');return false;">Setup Wizard</a> page.</p></div></div>
  <div class="feature-item"><div class="feature-dot">3</div><div><h4>Admin config hardening — all hardcoded values eliminated (TASK-016/017/018)</h4><p>Three commits systematically eliminated every remaining hardcoded constant from the Admin Console: <strong>TASK-016</strong> extracted the scrypt parameters (<code>SCRYPT_N</code>, <code>SCRYPT_R</code>, <code>SCRYPT_P</code>, <code>SCRYPT_DKLEN</code>) and the session cookie <code>max_age</code> (<code>ADMIN_SESSION_HOURS</code>) from <code>backend/admin/auth.py</code>; <strong>TASK-017</strong> extracted the stats refresh interval (<code>STATS_REFRESH_INTERVAL_SECONDS</code>) and process refresh interval (<code>PROCESS_REFRESH_INTERVAL_SECONDS</code>) from dashboard routes and the webhook server; <strong>TASK-018</strong> extracted the audit log query limit (<code>AUDIT_LOG_LIMIT</code>) and the license contact email (<code>LICENSE_CONTACT_EMAIL</code>) from routes and templates. All 22 variables across the codebase are now required env vars with no silent defaults.</p></div></div>

<h2>v2.0.0 — CS-3 Admin GUI MVP</h2>
<p>CS-3 completes the Admin Console with a full user management workflow, a license status page, an HTMX trigger stats panel with 30-second auto-refresh, password reset, and <code>ADMIN_EMBED</code> single-process mode. 31 new HTTP-level admin route tests bring the total to <strong>492 tests</strong> (455 Python + 37 Go).</p>

<div class="feature-list" style="margin-bottom:32px;">
  <div class="feature-item"><div class="feature-dot">1</div><div><h4>Admin route HTTP tests — 31 new tests (TASK-011)</h4><p>New test file <code>backend/tests/test_admin_routes.py</code> adds 31 HTTP-level tests against the Admin Console FastAPI router. Tests fire real HTTP requests via a <code>TestClient</code>-wrapped app — no route handler mocking. Every new route introduced in TASK-012 through TASK-015 is covered, plus authentication guards (unauthenticated access returns 302) and edge cases (self-disable rejected, duplicate role update no-ops, stats panel zeros gracefully when DB absent). See the <a href="#TEST_SUITE" onclick="navigate('TEST_SUITE');return false;">Test Suite</a> page.</p></div></div>
  <div class="feature-item"><div class="feature-dot">2</div><div><h4>User role update and soft disable/enable (TASK-012)</h4><p>Two new route groups in <code>backend/admin/routes.py</code> and corresponding helpers in <code>backend/admin/user_manager.py</code>: <strong>role update</strong> (<code>POST /admin/users/{username}/role</code>) promotes a <code>viewer</code> to <code>admin</code> or demotes an <code>admin</code> to <code>viewer</code>; <strong>soft disable/enable</strong> (<code>POST /admin/users/{username}/disable</code> / <code>/enable</code>) suspends an account without deleting it. Guards: you cannot change your own role or disable yourself. All actions are written to the audit log with acting username and IP. See the <a href="#ADMIN_CONSOLE" onclick="navigate('ADMIN_CONSOLE');return false;">Admin Console</a> page.</p></div></div>
  <div class="feature-item"><div class="feature-dot">3</div><div><h4>License status page in admin console (TASK-013)</h4><p>New <code>GET /admin/license</code> route renders a <code>license.html</code> template showing the active license tier (Community / Pro / Enterprise), seat count, T&amp;C acceptance status, and expiry date. Tier detection delegates to <code>backend/license_manager.py</code>. The page is accessible to any authenticated admin user and linked from the sidebar navigation. See the <a href="#ADMIN_CONSOLE" onclick="navigate('ADMIN_CONSOLE');return false;">Admin Console</a> page.</p></div></div>
  <div class="feature-item"><div class="feature-dot">4</div><div><h4>Trigger stats HTMX panel on admin dashboard (TASK-014)</h4><p>The admin dashboard gains a live trigger throughput panel that auto-refreshes every 30 seconds via HTMX (<code>hx-trigger="every 30s"</code>) without a full page reload. The <code>GET /admin/stats-panel</code> endpoint returns an HTML fragment with four counters: triggers today, commits today, last trigger timestamp, and errors in last 24 h (highlighted in red when non-zero). Data comes from <code>backend/server_tui/stats_client.py</code> reading <code>Data/devtrack.db</code> directly; all counters degrade gracefully to zero when the database is absent or unreadable. See the <a href="#ADMIN_CONSOLE" onclick="navigate('ADMIN_CONSOLE');return false;">Admin Console</a> page.</p></div></div>
  <div class="feature-item"><div class="feature-dot">5</div><div><h4>Password reset and ADMIN_EMBED single-process mode (TASK-015)</h4><p><strong>Password reset:</strong> <code>POST /admin/users/{username}/reset-password</code> generates a new scrypt-hashed temporary password, invalidates the old one, and surfaces the cleartext value in the UI flash message for the admin to relay to the user. <strong>ADMIN_EMBED:</strong> setting <code>ADMIN_EMBED=true</code> in <code>.env</code> causes <code>backend/webhook_server.py</code> to mount the admin router under <code>/admin</code> at startup, co-hosting both services on the webhook server's port 8089. This avoids running a second process in single-host or container deployments. When <code>ADMIN_EMBED=false</code> (default) the two apps remain independent. See the <a href="#ADMIN_CONSOLE" onclick="navigate('ADMIN_CONSOLE');return false;">Admin Console</a> page.</p></div></div>

<h2>v1.4-dev — Webhook Server, Alert Poller, Jira Alerter, Env-First Config &amp; More</h2>
<p>These changes have been merged from <code>features/release_ready</code> into <code>main</code> and are ready for release tagging. They represent the full production-readiness batch for v1.4.</p>

<div class="feature-list" style="margin-bottom:32px;">
  <div class="feature-item"><div class="feature-dot">1</div><div><h4>Jira Alerter — 26 new tests</h4><p><code>backend/alerters/jira_alerter.py</code> is now implemented and fully tested. The <code>JiraAlerter</code> class polls Jira Cloud for three event types: <strong>assigned to me</strong>, <strong>comment added</strong>, and <strong>status changed</strong>. 26 tests covering all polling paths, deduplication, and edge cases are in <code>backend/tests/test_jira_alerter.py</code>. The alert poller is updated to include Jira alongside GitHub and Azure DevOps. See the <a href="#TICKET_ALERTER" onclick="navigate('TICKET_ALERTER');return false;">Ticket Alerter</a> page.</p></div></div>
  <div class="feature-item"><div class="feature-dot">2</div><div><h4>Environment-first config — dotenv file loading removed</h4><p>The Go daemon no longer reads a <code>.env</code> file at startup. All configuration must be provided as real environment variables (exported in the shell, baked into the launchd/systemd plist, or set by a wrapper script). This eliminates the class of bugs caused by FIFO-flavoured <code>.env</code> files and makes the daemon safe to run as a system service. Run <code>devtrack autostart-install</code> to migrate — the command bakes all current env vars into the plist automatically. See <a href="#CONFIGURATION" onclick="navigate('CONFIGURATION');return false;">Configuration</a>.</p></div></div>
  <div class="feature-item"><div class="feature-dot">3</div><div><h4>Post-commit hook auto-install on <code>devtrack start</code></h4><p><code>devtrack start</code> now automatically installs the DevTrack post-commit hook in every enabled workspace repository on daemon startup. Previously the hook was only installed when running <code>devtrack workspace install-hooks</code> manually. No action required for existing setups — the hook is idempotent and will not overwrite a hook that already exists.</p></div></div>
  <div class="feature-item"><div class="feature-dot">4</div><div><h4>Multi-repo: <code>ignore_branches</code> and branch tracking</h4><p>Workspaces in <code>workspaces.yaml</code> now support an <code>ignore_branches</code> list. Commits on listed branches (e.g. <code>main</code>, <code>release/**</code>) are silently skipped — no prompt, no trigger, no log entry. The daemon also tracks the active branch per workspace and surfaces it in the TUI Workspaces tab. See <a href="#MULTI_REPO" onclick="navigate('MULTI_REPO');return false;">Multi-Repo Setup</a>.</p></div></div>
  <div class="feature-item"><div class="feature-dot">5</div><div><h4>Phase 4B — SQLite persistence for PM projects, backlog &amp; sprints</h4><p>The Go daemon's SQLite schema gains three new tables: <code>pm_projects</code> (synced project/repo metadata per workspace), <code>backlog_items</code> (cached issue/ticket records), and <code>sprints</code> (iteration metadata). These tables are written by the Go daemon from PM API responses and read by the TUI Workspaces tab to show project status without an API round-trip. No migration needed for clean installs.</p></div></div>
  <div class="feature-item"><div class="feature-dot">6</div><div><h4>Autostart env-baking — launchd/systemd/profile</h4><p><code>devtrack autostart-install</code> has been upgraded to <strong>bake all current environment variables</strong> into the generated plist (macOS) or systemd unit (Linux). This means the daemon, when started by the OS at login, inherits the exact same configuration that was active when you ran <code>autostart-install</code> — no wrapper scripts, no <code>EnvironmentFile=</code> hacks. Re-run <code>devtrack autostart-install</code> after changing <code>.env</code> values to refresh the baked env. See <a href="#AUTOSTART" onclick="navigate('AUTOSTART');return false;">Auto-Start</a>.</p></div></div>
  <div class="feature-item"><div class="feature-dot">7</div><div><h4>Anonymous install &amp; active telemetry ping (Tier 2 implemented)</h4><p><code>devtrack-bin/ping.go</code> implements the Tier-2 anonymous usage pings described in the Telemetry plan. On install, a random UUID is created at <code>~/.devtrack/id</code>. A SHA-256 of the hardware platform UUID is computed as a stable fingerprint (raw value never leaves the machine). Two events are fired: <code>install</code> on first run, and <code>active</code> at most once per 24 hours when the daemon is running. Both POSTs are fire-and-forget goroutines — failures are silent. The telemetry endpoint is <code>https://ping.devtrack.dev</code> (Cloudflare Worker). Disabled by a sentinel file written by <code>devtrack telemetry off</code>. See <a href="#TELEMETRY" onclick="navigate('TELEMETRY');return false;">Telemetry</a>.</p></div></div>
  <div class="feature-item"><div class="feature-dot">8</div><div><h4>SQLite alert_state fallback for ticket alerter</h4><p>The ticket alerter now persists <code>last_checked</code> timestamps to SQLite when MongoDB is unavailable. The <code>alert_state</code> table in <code>Data/devtrack.db</code> tracks the last poll time per source (github/azure/jira), enabling full delta-sync functionality in offline-first mode. Go accessors <code>GetAlertLastChecked</code>/<code>SetAlertLastChecked</code> added to <code>database.go</code>. See <a href="#TICKET_ALERTER" onclick="navigate('TICKET_ALERTER');return false;">Ticket Alerter</a>.</p></div></div>
  <div class="feature-item"><div class="feature-dot">9</div><div><h4>Per-workspace PM overrides (WorkspaceRouter)</h4><p>Workspaces now support per-platform PM overrides: <code>pm_assignee</code>, <code>pm_iteration_path</code> (Azure), <code>pm_area_path</code> (Azure), and <code>pm_milestone</code> (GitHub/GitLab). These are extracted from commit trigger POST data and forwarded to the appropriate platform API when creating work items or issues. Azure gets assigned_to/area_path/iteration_path; GitHub gets assignees/milestone; GitLab gets assignee_ids/milestone_id. See <a href="#MULTI_REPO" onclick="navigate('MULTI_REPO');return false;">Multi-Repo Setup</a>.</p></div></div>
  <div class="feature-item"><div class="feature-dot">10</div><div><h4>Webhook + Trigger Server added (<code>backend/webhook_server.py</code>)</h4><p>The CS-1 FastAPI webhook and trigger server is now present in the repository as <code>backend/webhook_server.py</code>. It serves as the single HTTP entry-point for both inbound platform webhooks (Azure DevOps, GitHub, GitLab, Jira) and outbound trigger calls from the Go daemon (<code>commit_trigger</code>, <code>timer_trigger</code>, and the full IPC message vocabulary). All <code>/trigger/*</code> endpoints require the <code>X-DevTrack-API-Key</code> header. Run with <code>python -m backend.webhook_server</code> or via the Server TUI. The <code>alert_poller</code> background service is also now present as <code>backend/alert_poller.py</code> — start it as a subprocess or via <code>devtrack server-tui</code>. See the <a href="#SERVER_TUI" onclick="navigate('SERVER_TUI');return false;">Server TUI</a> page.</p></div></div>
  <div class="feature-item"><div class="feature-dot">11</div><div><h4>Bug fix: stale <code>config._load_env()</code> call removed</h4><p>After the env-first config refactor (item 2 above), a residual <code>config._load_env()</code> call remained in one Python module. This caused an <code>AttributeError</code> at import time for any code path that hit that module while running in env-first mode. The call has been removed. No configuration changes are required; all existing env var exports continue to work as before.</p></div></div>
</div>

<h2>v1.3 — HTTP Trigger Validation, Bug Fixes &amp; 133 New Tests</h2>
<p>DevTrack v1.3 focuses on correctness and reliability: comprehensive test coverage for the HTTP trigger layer and admin subsystems, two daemon startup bugs fixed, and a hardened test harness that catches FIFO-related hangs before they reach CI.</p>

<div class="feature-list" style="margin-bottom:32px;">
  <div class="feature-item"><div class="feature-dot">1</div><div><h4>CS-1 HTTP trigger validation — 133 new tests</h4><p>Full test coverage for the Go daemon's HTTP trigger dispatch and the FastAPI webhook server's trigger ingestion. Tests verify correct payloads are accepted, malformed or unauthenticated requests are rejected with the right status codes, and all edge cases (missing fields, invalid JSON, wrong content-type) are handled consistently. See the <a href="#TEST_SUITE" onclick="navigate('TEST_SUITE');return false;">Test Suite</a> page for details.</p></div></div>
  <div class="feature-item"><div class="feature-dot">2</div><div><h4>Admin subsystem tests — auth, user manager, license manager</h4><p>Three new Python test files cover the Admin Console authentication flow (JWT issuance, expiry, bad-credential rejection), user lifecycle (create/delete/list/key rotation), and the license manager (tier detection, T&amp;C acceptance recording, <code>DEVTRACK_AUTO_ACCEPT_TERMS</code> flag). These tests run fully offline — no cloud endpoint required.</p></div></div>
  <div class="feature-item"><div class="feature-dot">3</div><div><h4>Bug fix: .env FIFO causes daemon startup hang</h4><p>When <code>.env</code> was a named pipe (created by a broken shell redirect or <code>mkfifo</code>), the daemon would block indefinitely trying to read it. The fix detects this condition at startup and aborts with a clear error message. The <code>conftest.py</code> session fixture also guards against this in the test suite so the bug can never silently hang CI collection.</p></div></div>
  <div class="feature-item"><div class="feature-dot">4</div><div><h4>Bug fix: RuntimeNarrativeMiddleware unknown kwarg crash</h4><p>The FastAPI webhook server crashed on startup with <code>TypeError: __init__() got an unexpected keyword argument 'failure_diagnostics'</code>. The <code>failure_diagnostics</code> parameter was removed from <code>RuntimeNarrativeMiddleware</code> to match the current API signature. The new HTTP trigger tests catch this class of startup error automatically.</p></div></div>
  <div class="feature-item"><div class="feature-dot">5</div><div><h4>Test harness: conftest.py session fixture</h4><p>The shared <code>backend/tests/conftest.py</code> gains a session-scoped autouse fixture that inspects the <code>.env</code> file's stat type before any test runs. If <code>.env</code> is a FIFO, collection is aborted immediately with a clear error rather than hanging the entire pytest process. LLM provider isolation (<code>reset_provider_cache()</code>) is also documented as the required pattern for any test that modifies <code>LLM_PROVIDER</code>.</p></div></div>
</div>

<h2>v1.2 — Community License, Login &amp; Auth, Telemetry opt-in</h2>
<p>DevTrack v1.2 introduces the Community License model, an optional identity layer with magic-link login, and tightens the AI-commit guard so it only activates when the daemon is running.</p>

<div class="feature-list" style="margin-bottom:32px;">
  <div class="feature-item"><div class="feature-dot">1</div><div><h4>Community License — free personal &amp; team, paid enterprise</h4><p>DevTrack is now released under a <strong>Community License</strong>: free for personal use and self-hosted teams up to 10 users; a commercial enterprise licence is required for 11+ users or hosted/SaaS deployments. See the <a href="#LICENSE" onclick="navigate('LICENSE');return false;">License</a> page for full tier details.</p></div></div>
  <div class="feature-item"><div class="feature-dot">2</div><div><h4>TERMS.md — first-run T&amp;C acceptance flow</h4><p>On first start, DevTrack prints a Terms of Service summary and prompts the user to accept before the daemon starts. Acceptance is stored in <code>Data/license/acceptance.json</code>. Use <code>devtrack terms</code> to review or re-accept; <code>devtrack terms --accept</code> for non-interactive/CI environments. The <code>DEVTRACK_AUTO_ACCEPT_TERMS=1</code> env var also suppresses the prompt.</p></div></div>
  <div class="feature-item"><div class="feature-dot">3</div><div><h4>backend/license_manager.py — tier detection</h4><p>New <code>LicenseManager</code> class handles all acceptance checks and tier detection locally — no network required. Tier enforcement is advisory in local mode; strict when <code>DEVTRACK_API_URL</code> is set (SaaS mode). Acceptance records include <code>terms_version</code> so a future T&amp;C update automatically re-prompts.</p></div></div>
  <div class="feature-item"><div class="feature-dot">4</div><div><h4>backend/auth/ — optional magic-link login</h4><p>New <code>backend/auth/</code> package provides an optional identity layer. Run <code>devtrack login</code> to start a magic-link email flow — enter your email, receive a one-time code, confirm it, get a JWT session. Sessions persist in <code>Data/license/session.json</code> (chmod 0600) for 30 days. Fully offline when <code>DEVTRACK_API_URL</code> is not set — falls back to a local-only session. See <a href="#AUTH" onclick="navigate('AUTH');return false;">Login &amp; Auth</a>.</p></div></div>
  <div class="feature-item"><div class="feature-dot">5</div><div><h4>backend/telemetry.py — opt-in usage analytics</h4><p>The previously-planned telemetry module is now implemented in Python. Works alongside the Go-side <code>devtrack telemetry on/off</code> commands already documented. Receives events from the CLI and stores them in the <code>telemetry_events</code> SQLite table. The Admin Console telemetry panel is updated to show live data once this module is wired up.</p></div></div>
  <div class="feature-item"><div class="feature-dot">6</div><div><h4>New CLI commands: login, logout, whoami, license, terms [--accept], telemetry [on|off]</h4>

<h2>v1.0 Highlights</h2>
<p>DevTrack v1.0 ships the complete automation stack — local-first, production-ready, with optional cloud upgrade paths.</p>

<div class="feature-list" style="margin-bottom:32px;">
  <div class="feature-item"><div class="feature-dot">1</div><div><h4>IPC → HTTPS (CS-1)</h4><p>Go daemon now POSTs all triggers to the Python backend over HTTPS with a self-signed ECDSA cert (auto-generated at startup, cert-pinned in the Go TLS client). The old TCP IPC socket is gone — cleaner, more secure, and works across processes and containers.</p></div></div>
  <div class="feature-item"><div class="feature-dot">2</div><div><h4>Slack Bot (Socket Mode)</h4><p>Full <code>/devtrack &lt;cmd&gt;</code> slash command support via Slack Socket Mode. No public URL, no ngrok. Supports all work-session commands, PM queries, and proactive work-reminder nudges. Set <code>SLACK_ENABLED=true</code> and configure two tokens.</p></div></div>
  <div class="feature-item"><div class="feature-dot">3</div><div><h4>Server TUI (CS-2)</h4><p>A Textual-based terminal dashboard for the Python backend — live CPU/MEM per process, a service health bar, and keyboard controls to restart/start/stop individual processes and stream logs. Run with <code>devtrack server-tui</code>.</p></div></div>
  <div class="feature-item"><div class="feature-dot">4</div><div><h4>Admin Console (CS-3)</h4><p>A lightweight HTMX web UI at <code>http://localhost:8090/admin/</code> for managing users, API keys, reviewing LLM config, integration credential status, and a full audit log. JWT sessions, scrypt-hashed passwords — safe to expose on a LAN.</p></div></div>
  <div class="feature-item"><div class="feature-dot">5</div><div><h4>Work Session Tracking</h4><p><code>devtrack work start AUTH-42</code> begins a session timer. Every git commit is auto-attached — no manual time entry. <code>devtrack work stop</code> records the auto-measured duration. <code>devtrack work report</code> generates an AI narrative EOD summary with achievements, in-progress, and pending items, plus optional HTML email via MS Graph.</p></div></div>
