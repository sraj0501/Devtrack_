  TICKET_ALERTER: `<div class="md-body">
<h1>Ticket Alerter</h1>
<p>The alerter watches supported project platforms for events that need the developer's attention, then delivers a local or explicitly configured notification. It exists so DevTrack can surface assignments, comments and review requests without requiring the developer to keep every PM tab open.</p>
<h2>Why It Is Client-Owned</h2>
<p>Alerts belong to the developer's local context, not the shared Python server. The Go daemon polls with the active workspace credentials, stores cursors and notifications in local SQLite, and can continue tracking state when optional AI services are unavailable.</p>
<h2>Supported Polling Sources</h2>
<div class="table-wrap"><table><thead><tr><th>Source</th><th>Events</th><th>First-run behavior</th></tr></thead><tbody>
<tr><td>GitHub</td><td>Issue/PR assignment, review request and comments on involved work.</td><td>Checkpoints current state so old events do not flood the user.</td></tr>
<tr><td>Azure DevOps</td><td>Work-item assignment, comments and state changes.</td><td>First poll establishes a cursor before reporting new changes.</td></tr>
</tbody></table></div>
<blockquote><p>The current Go poller does not claim Jira alert polling. Jira may still be configured for other server/integration paths, but it is not a native alert source on this page.</p></blockquote>
<h2>Configure It</h2>
<pre><code class="language-bash">ALERT_ENABLED=true
ALERT_POLL_INTERVAL_SECS=300
ALERT_GITHUB_ENABLED=true
ALERT_AZURE_ENABLED=true

ALERT_NOTIFY_ASSIGNED=true
ALERT_NOTIFY_COMMENTS=true
ALERT_NOTIFY_STATUS_CHANGES=true
ALERT_NOTIFY_REVIEW_REQUESTED=true</code></pre>
<p>Credentials remain in the registered environment file; repository and project routing remain in <code>workspaces.yaml</code>. Restart the daemon after changing environment settings.</p>
<h2>Delivery Channels</h2>
<ul>
<li><strong>Terminal/OS:</strong> local visibility without a third-party chat service.</li>
<li><strong>Telegram:</strong> uses the Go-native bot and configured notification chat IDs.</li>
<li><strong>Slack:</strong> uses the Go-native incoming-webhook notifier configured by <code>SLACK_WEBHOOK_URL</code>.</li>
</ul>
<p>Notification delivery is visibility only. It does not gate the daemon's capabilities and a notifier failure does not stop polling.</p>
<h2>Storage and Deduplication</h2>
<pre><code class="language-text">GitHub / Azure API
        |
        v
Go alert poller
        |
        +--> alert_state       last successful cursor per source
        +--> notifications     local visible history
        |
        +--> terminal / OS / Telegram / Slack</code></pre>
<p>Both tables live in the Go client's SQLite database. The cursor prevents duplicates across daemon restarts. No MongoDB or PostgreSQL server is required for alert state.</p>
<h2>Use It</h2>
<pre><code class="language-bash">devtrack start
devtrack alerts
devtrack alerts --all
devtrack alerts --clear
devtrack logs -f</code></pre>
<h2>Troubleshooting</h2>
<ul>
<li><strong>No first-run alerts:</strong> expected; the initial checkpoint avoids replaying old history.</li>
<li><strong>No later alerts:</strong> check the global/source toggles, workspace routing, token scope and daemon logs.</li>
<li><strong>Your own Azure comments appear:</strong> set the configured Azure identity/email used for author filtering.</li>
<li><strong>One notifier fails:</strong> inspect its credentials; other delivery channels and the SQLite notification row remain independent.</li>
</ul>
</div>`,

  TELEMETRY: `<div class="md-body">
<h1>Optional Telemetry</h1>
<p>Telemetry measures whether installed DevTrack clients remain active after download. It is not required by any capability and is <strong>off by default</strong>.</p>
<h2>Why It Is Opt-In</h2>
<p>DevTrack observes private developer activity locally, so silent analytics would violate its trust model. Unless the local <code>telemetry_enabled</code> marker exists, the client sends nothing.</p>
<h2>Control It</h2>
<pre><code class="language-bash">devtrack telemetry status
devtrack telemetry on
devtrack telemetry off</code></pre>
<p>These commands operate locally and do not require the Python server.</p>
<h2>What the Current Client Sends</h2>
<p>When enabled, the daemon may send an anonymous <code>install</code> event once and an <code>active</code> event at most once per 24 hours. The payload is limited to a random installation ID, hashed hardware fingerprint, event type, DevTrack version, OS and architecture.</p>
<h2>What It Never Sends</h2>
<ul>
<li>Repository paths, source, diffs, file names, branches, commits or ticket IDs.</li>
<li>Usernames, email addresses, workspace names or PM content.</li>
<li>Credentials, environment values or voice-training samples.</li>
</ul>
<h2>Failure Behavior</h2>
<p>Telemetry is fire-and-forget. Network failures cannot block the daemon or Git. Any error resolving consent or the data directory keeps telemetry off.</p>
</div>`,

  DEVTRACK_SERVER: `<div class="md-body">
<h1>Headless Server Helper</h1>
<p>The repository includes <code>devtrack_server/devtrack-server.sh</code> for source-based headless installations. It coordinates the normal DevTrack binary and Python environment; it is not a second product or a separately published release bundle.</p>
<h2>When to Use It</h2>
<ul>
<li>Use <code>devtrack setup</code> on a developer workstation.</li>
<li>Use this helper for a Linux server or VM running a source checkout.</li>
<li>Use Docker Compose when the Python server and PostgreSQL should be containerized.</li>
</ul>
<h2>Source-Checkout Flow</h2>
<pre><code class="language-bash">git clone --branch dev --single-branch https://github.com/sraj0501/Devtrack_.git
cd Devtrack_/devtrack_server
chmod +x devtrack-server.sh
./devtrack-server.sh install
./devtrack-server.sh setup
./devtrack-server.sh start
./devtrack-server.sh status
./devtrack-server.sh logs</code></pre>
<h2>Responsibilities</h2>
<div class="table-wrap"><table><thead><tr><th>Command</th><th>Purpose</th></tr></thead><tbody>
<tr><td><code>install</code></td><td>Prepare the source-based Go/Python installation and synchronize Python dependencies with <code>uv</code>.</td></tr>
<tr><td><code>setup</code></td><td>Run the canonical DevTrack setup flow.</td></tr>
<tr><td><code>start</code>/<code>stop</code>/<code>status</code></td><td>Coordinate normal daemon lifecycle operations.</td></tr>
<tr><td><code>logs</code></td><td>Show the relevant log stream.</td></tr>
</tbody></table></div>
<blockquote><p>GitHub Releases publishes Go assets such as <code>devtrack_linux_amd64.tar.gz</code> and <code>devtrack_windows_amd64.exe</code>. It does not publish a <code>devtrack-server-*.tar.gz</code> bundle.</p></blockquote>
</div>`,

  UPGRADE: `<div class="md-body">
<h1>Upgrade DevTrack</h1>
<p><code>devtrack upgrade</code> queries GitHub Releases, selects the exact platform asset, replaces an installed release binary, applies local configuration migrations, and restarts the daemon if it was running.</p>
<h2>Check and Upgrade</h2>
<pre><code class="language-bash">devtrack version
devtrack upgrade --check
devtrack upgrade</code></pre>
<p>Linux and macOS use <code>devtrack_&lt;os&gt;_&lt;arch&gt;.tar.gz</code>. Windows downloads the published <code>.exe</code> directly. A development build reports the latest release without overwriting itself as a tagged installation.</p>
<h2>Managed Server Update</h2>
<p>After the binary succeeds, managed mode updates the optional Python server through the durable background worker:</p>
<pre><code class="language-bash">devtrack doctor
devtrack status
devtrack doctor --repair</code></pre>
<p>A Python bootstrap failure does not undo the binary upgrade or block Go-native capabilities.</p>
<h2>Rollback</h2>
<p>No backup binary is retained. Stop DevTrack, download the required older asset from GitHub Releases, replace the binary, and restart. Preserve configuration and data unless the release notes explicitly say otherwise.</p>
</div>`,

  UNINSTALL: `<div class="md-body">
<h1>Uninstall</h1>
<p>The <code>devtrack uninstall</code> command performs a clean, interactive removal of DevTrack from your machine — stopping the daemon, removing autostart entries, deleting runtime data, and optionally removing the binary itself.</p>

<div class="home-badge" style="margin-bottom:24px;background:var(--callout-tip);border-color:var(--callout-tip-border);color:#166534;">New in v2.2.11 — feat/uninstall-and-upgrade-fix</div>

<h2>Quick Start</h2>
<pre><code class="language-bash"># Interactive uninstall (confirms each step)
devtrack uninstall

# Skip all confirmation prompts
devtrack uninstall --yes</code></pre>

<h2>What It Does</h2>
<ol>
<li><strong>Stops the running daemon</strong> — sends a stop signal if the daemon is currently running; waits for it to exit cleanly.</li>
<li><strong>Removes autostart</strong> — unregisters the launchd LaunchAgent (macOS), systemd user service (Linux), or shell profile block (WSL) that was installed by <code>devtrack autostart-install</code>.</li>
<li><strong>Deletes the data directory</strong> — removes <code>Data/</code> including the SQLite database, logs, PID files, TLS certs, and reports. Skipped if <code>DATA_DIR</code> is not set.</li>
<li><strong>Removes the <code>~/.devtrack/</code> directory</strong> — deletes the XDG home used by <code>devtrack setup</code> (<code>devtrack.conf</code>, <code>cloud.json</code>, <code>telemetry.json</code>, <code>schema_version</code>, <code>workspaces.yaml</code>).</li>
<li><strong>Removes the binary</strong> — deletes the <code>devtrack</code> binary from its current location. On Windows, asks you to remove it manually if a file lock prevents deletion.</li>
</ol>

<blockquote><p><strong>Note:</strong> Uninstall does <em>not</em> touch your monitored git repositories, the Python virtualenv created by <code>uv sync</code>, or your <code>.env</code> file. Those are left in place so you can reinstall without re-entering credentials.</p></blockquote>

<h2>Platform Behaviour</h2>
<div class="table-wrap"><table>
<thead><tr><th>Platform</th><th>Autostart removal</th><th>Binary removal</th></tr></thead>
<tbody>
<tr><td><strong>macOS</strong></td><td><code>launchctl unload</code> + plist file deleted</td><td><code>os.Remove</code> — no extra permissions needed for user-owned installs</td></tr>
<tr><td><strong>Linux</strong></td><td><code>systemctl --user disable --now</code> + unit file deleted</td><td><code>os.Remove</code></td></tr>
<tr><td><strong>Windows</strong></td><td><code>schtasks /Delete /TN DevTrack /F</code> (Task Scheduler task removed; no-op if not installed)</td><td>Binary renamed to <code>.old</code> (cannot delete a running .exe); safe to remove manually after stopping DevTrack</td></tr>
</tbody>
</table></div>

<h2>Flags</h2>
<div class="table-wrap"><table>
<thead><tr><th>Flag</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>--yes</code></td><td>Skip all confirmation prompts — performs every step automatically. Useful for CI or scripted teardowns.</td></tr>
</tbody>
</table></div>

<h2>What Is Not Removed</h2>
<ul>
<li>Your monitored git repositories and their commit history</li>
<li>The Python virtualenv created by <code>uv sync</code> (located under the project root)</li>
<li>Your <code>.env</code> file — credentials and configuration are preserved so reinstalling is fast</li>
<li>MongoDB data (if <code>MONGODB_URI</code> was configured)</li>
</ul>

<h2>Reinstalling After Uninstall</h2>
<pre><code class="language-bash"># Download the latest binary again
OS=$(uname -s | tr '[:upper:]' '[:lower:]')
ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && ARCH=amd64; [ "$ARCH" = "aarch64" ] && ARCH=arm64
curl -fsSL "https://github.com/sraj0501/Devtrack_/releases/latest/download/devtrack_\${OS}_\${ARCH}.tar.gz" | tar xz
sudo mv devtrack /usr/local/bin/

# Re-run setup (or just source your preserved .env and start)
devtrack setup
devtrack start</code></pre>

<h2>Implementation Files</h2>
<div class="table-wrap"><table>
<thead><tr><th>File</th><th>Purpose</th></tr></thead>
<tbody>
<tr><td><code>devtrack_client/cli.go</code></td><td><code>RunUninstall()</code> — orchestrates all uninstall steps; <code>--yes</code> flag handling; platform-detection for autostart and binary removal</td></tr>
</tbody>
</table></div>
</div>`,

  WHATS_NEW: `<div class="md-body">
<h1>What's New</h1>
<p>This page distinguishes the latest public release from newer source work. TASK-147 and TASK-148 are synchronized on <code>main</code> and <code>dev</code>; TASK-149 is the follow-up documentation synchronization branch. GitHub Releases remains the version-history archive.</p>
<h2>v3.1.1 — TASK-147–150 readiness, distribution, and documentation</h2>
<ul>
<li><strong>Stable HTTP boundary:</strong> executable Go and Python contract tests now protect health, timer, boardroom, work-session, queue, and client-event request/response shapes.</li>
<li><strong>Windows compatibility:</strong> native SQLite paths are normalized into valid file URIs, and Windows participates in the Go CI test matrix.</li>
<li><strong>MCP protocol metadata:</strong> the server negotiates finalized handshake versions through <code>2025-11-25</code>; all six tools have deterministic ordering, human titles, and read-only/non-destructive/idempotent/local annotations.</li>
<li><strong>MCPB distribution:</strong> manifest 0.3 bundles ship for five OS/architecture targets, with official CLI validation and native execution in CI.</li>
<li><strong>Documentation synchronization:</strong> TASK-149 reconciled the README, durable project memory, HTTP/MCP references, release gates, and this wiki; TASK-150 records v3.1.0 and the privacy-compliance v3.1.1 patch.</li>
</ul>
<h2>Latest Public Release — v3.1.1</h2>
<ul>
<li>Standalone Go client with managed, lightweight and external modes.</li>
<li>Cross-platform daemon, autostart, workspace routing and Go-native PM connectors.</li>
<li>Git-sage improvements, Windows fixes, local SQLite observation and alerts.</li>
</ul>
<h2>First-Run Path</h2>
<ul>
<li><strong>Background bootstrap:</strong> setup returns while Python and model preparation continue; <code>doctor</code> reports and repairs readiness.</li>
<li><strong>Voice seed:</strong> local Git history begins the writing profile without blocking setup.</li>
<li><strong>LLM fast lane:</strong> setup reuses a generation-capable Ollama model and can explicitly offer an existing cloud key as a temporary fallback.</li>
<li><strong>MCP agent memory:</strong> six read-only SQLite-backed context tools over stdio.</li>
</ul>
<h2>Silent Worker Core — Phases 0–8</h2>
<div class="table-wrap"><table><thead><tr><th>Capability</th><th>Reason</th></tr></thead><tbody>
<tr><td>Silent daemon</td><td>Observes normal work without adding prompts or blocking Git.</td></tr>
<tr><td>Pending-actions queue</td><td>Makes every external side effect reviewable with explicit confidence.</td></tr>
<tr><td>Ticket extraction</td><td>Connects branch and commit signals to project work.</td></tr>
<tr><td>EOD and voice</td><td>Turns observed work into reports that sound like the developer.</td></tr>
<tr><td>Learning loop</td><td>Uses approvals, edits and rejections to improve future decisions.</td></tr>
<tr><td>PR review loop</td><td>Coordinates fixes while preserving escalation and approval boundaries.</td></tr>
<tr><td>MCP</td><td>Shares local work memory with compatible assistants through read-only tools.</td></tr>
</tbody></table></div>
<h2>PostgreSQL Boundary</h2>
<p>The Python server requires PostgreSQL and applies Alembic migrations at startup. The Go client remains SQLite-only and never receives PostgreSQL credentials.</p>
</div>`,

  HTTP_API: `<div class="md-body">
<h1>HTTP API Contract</h1>
<p>This is the stable boundary between the Go client and the optional Python server. New cross-boundary behavior must update the Go contract tests, Python contract tests, and <code>docs/HTTP_API.md</code> together.</p>

<h2>Authentication and JSON</h2>
<p>When <code>DEVTRACK_API_KEY</code> is configured, clients send it as <code>X-DevTrack-API-Key</code>. Health and version probes remain available for local capability detection. JSON requests use <code>Content-Type: application/json</code>.</p>

<h2>Health and Lifecycle</h2>
<div class="table-wrap"><table><thead><tr><th>Method and path</th><th>Purpose</th><th>Successful response</th></tr></thead><tbody>
<tr><td><code>GET /health</code></td><td>Capability probe</td><td><code>{"status":"ok","service":"devtrack-webhooks"}</code></td></tr>
<tr><td><code>GET /version</code></td><td>Version probe</td><td>Version and service metadata</td></tr>
<tr><td><code>GET /status</code></td><td>Server readiness</td><td>Capability/status object</td></tr>
<tr><td><code>POST /trigger/ping</code></td><td>Authenticated liveness</td><td><code>{"status":"ok","pong":true}</code></td></tr>
<tr><td><code>POST /trigger/workspace_reload</code></td><td>Reload workspace routing</td><td>Status and message</td></tr>
</tbody></table></div>

<h2>Core Triggers</h2>
<div class="table-wrap"><table><thead><tr><th>Method and path</th><th>Contract summary</th></tr></thead><tbody>
<tr><td><code>POST /trigger/commit</code></td><td>Requires commit hash, message, author, and branch; returns status, actions, and commit hash.</td></tr>
<tr><td><code>POST /trigger/timer</code></td><td>Accepts timestamp, interval, and trigger count; an empty object remains valid for compatibility.</td></tr>
<tr><td><code>POST /trigger/work_session_start</code></td><td>Starts a session from its numeric ID and optional ticket reference.</td></tr>
<tr><td><code>POST /trigger/work_session_stop</code></td><td>Stops the identified work session.</td></tr>
<tr><td><code>POST /trigger/boardroom</code></td><td>Accepts <code>plan_text</code> or <code>markdown</code> and returns the report, verdict, votes, pros, and cons.</td></tr>
<tr><td><code>POST /trigger/boardroom/chat</code></td><td>Accepts plan text, history, and optional user direction; returns persona responses and updated session state.</td></tr>
</tbody></table></div>

<h2>Synchronization and Failure Behavior</h2>
<p><code>POST /trigger/client_events</code> replays client events with stable replay keys. <code>POST /queue/execute_staged</code> carries the complete pending-action identity and returns either <code>posted</code> or an error state. Authentication applies to both when enabled.</p>
<p>The Go client keeps observing Git and recording local SQLite state when the Python server is unavailable. Timeouts and retry queues bound network failures; normal Git commands are never held open by this boundary.</p>

<h2>Cross-Platform Contract</h2>
<p>The HTTP shapes are platform-neutral. Local SQLite paths are not URLs: DevTrack normalizes Windows drive letters and backslashes before constructing a SQLite file URI. CI tests the Go client on Linux, macOS, and Windows so path handling cannot silently diverge.</p>

<h2>Maintainer References</h2>
<ul>
<li><code>docs/HTTP_API.md</code> — canonical route and payload summary.</li>
<li><code>devtrack_client/internal/trigger/api_contract_test.go</code> — Go-client contract assertions.</li>
<li><code>devtrack_server/backend/tests/test_api_contract.py</code> — Python-server contract assertions.</li>
</ul>
</div>`,

  CLI_REFERENCE: `<div class="md-body">
<h1>CLI Reference</h1>
<p>The Go CLI is the user-facing gateway to DevTrack. This page groups commands by the job a user is trying to do; run <code>devtrack help</code> for the command surface in the installed build.</p>
<h2>First Setup and Diagnosis</h2>
<div class="table-wrap"><table><thead><tr><th>Command</th><th>Use it for</th></tr></thead><tbody>
<tr><td><code>devtrack setup</code></td><td>Configure mode, workspace, PostgreSQL, LLM and PM integration; register the generated environment.</td></tr>
<tr><td><code>devtrack doctor</code></td><td>Explain which local and managed capabilities are ready, degraded or still installing.</td></tr>
<tr><td><code>devtrack doctor --repair</code></td><td>Retry a failed or interrupted managed-server bootstrap.</td></tr>
<tr><td><code>devtrack settings</code></td><td>Show resolved paths and masked runtime settings.</td></tr>
<tr><td><code>devtrack version</code></td><td>Show version, build commit and build time.</td></tr>
</tbody></table></div>

<h2>Daemon and Scheduler</h2>
<div class="table-wrap"><table><thead><tr><th>Command</th><th>Behavior</th></tr></thead><tbody>
<tr><td><code>devtrack start</code></td><td>Start the silent Go daemon and, in managed mode, its Python server.</td></tr>
<tr><td><code>devtrack stop</code>/<code>restart</code></td><td>Stop cleanly or restart to apply environment changes.</td></tr>
<tr><td><code>devtrack status</code></td><td>Show daemon and capability readiness. This replaces the retired <code>health</code> command.</td></tr>
<tr><td><code>devtrack logs</code>/<code>logs -f</code></td><td>Read recent logs or follow new entries across platforms.</td></tr>
<tr><td><code>devtrack pause</code>/<code>resume</code></td><td>Pause or resume scheduled triggers while Git observation remains available.</td></tr>
<tr><td><code>devtrack force-trigger</code></td><td>Fire a timer trigger immediately; it does not create an interactive main-flow prompt.</td></tr>
<tr><td><code>devtrack skip-next</code></td><td>Skip the next scheduled timer event.</td></tr>
</tbody></table></div>

<h2>Daily Work and Trust Queue</h2>
<div class="table-wrap"><table><thead><tr><th>Command</th><th>Behavior</th></tr></thead><tbody>
<tr><td><code>devtrack commits pending</code></td><td>Show recent commits waiting for review/enrichment.</td></tr>
<tr><td><code>devtrack queue [list]</code></td><td>Show pending actions; add <code>--all</code> for recent history.</td></tr>
<tr><td><code>devtrack queue approve &lt;id&gt;</code></td><td>Approve and execute one reviewed action.</td></tr>
<tr><td><code>devtrack queue edit &lt;id&gt; '&lt;json&gt;'</code></td><td>Replace a pending action payload with valid JSON.</td></tr>
<tr><td><code>devtrack queue reject &lt;id&gt;</code></td><td>Reject an action so it cannot post.</td></tr>
<tr><td><code>devtrack eod generate</code></td><td>Generate today's narrative and stage delivery.</td></tr>
<tr><td><code>devtrack eod show</code>/<code>status</code></td><td>Show the latest narrative or its action state.</td></tr>
<tr><td><code>devtrack work start &lt;ticket&gt;</code></td><td>Set an explicit active ticket when branch inference is insufficient.</td></tr>
<tr><td><code>devtrack work stop</code>/<code>status</code>/<code>report</code></td><td>Manage and summarize explicit work sessions.</td></tr>
</tbody></table></div>

<h2>Voice and Agent Memory</h2>
<div class="table-wrap"><table><thead><tr><th>Command</th><th>Behavior</th></tr></thead><tbody>
<tr><td><code>devtrack voice seed</code></td><td>Seed the local writing corpus from enabled Git repositories.</td></tr>
<tr><td><code>devtrack voice profile</code></td><td>Generate a developer voice profile from the local corpus.</td></tr>
<tr><td><code>devtrack voice add --context &lt;type&gt; "text"</code></td><td>Add an explicit high-quality writing example.</td></tr>
<tr><td><code>devtrack voice status</code></td><td>Show current voice-corpus/profile status.</td></tr>
<tr><td><code>devtrack mcp setup</code></td><td>Add the read-only DevTrack MCP server to a project.</td></tr>
<tr><td><code>devtrack mcp status</code>/<code>test</code></td><td>Inspect registration or run the protocol self-test.</td></tr>
</tbody></table></div>

<h2>Workspaces and Project Platforms</h2>
<pre><code class="language-bash">devtrack workspace list
devtrack workspace add &lt;name&gt; &lt;path&gt;
devtrack workspace enable &lt;name&gt;
devtrack workspace disable &lt;name&gt;
devtrack workspace reload

devtrack github-check | github-list | github-sync | github-view &lt;number&gt;
devtrack gitlab-check | gitlab-list | gitlab-sync | gitlab-view &lt;project&gt; &lt;iid&gt;
devtrack azure-check  | azure-list  | azure-sync  | azure-view &lt;id&gt;
devtrack issues</code></pre>
<p>Platform operations use the active workspace's non-secret routing metadata and environment-held credentials. See the integration and Workspaces pages before enabling outbound sync.</p>

<h2>Git Assistance</h2>
<pre><code class="language-bash">devtrack git add
devtrack git commit -m "message"
devtrack sage ask "question about this repository"
devtrack sage do "git task"
devtrack sage pr
devtrack sage interactive</code></pre>
<p>Normal <code>git commit</code> remains normal Git and is observed after completion. Assisted commands are explicit and failures must not block the developer's ordinary Git workflow.</p>

<h2>Interfaces, Alerts and Lifecycle</h2>
<pre><code class="language-bash">devtrack tui
devtrack alerts
devtrack alerts --all
devtrack alerts --clear
devtrack review
devtrack review status
devtrack telegram-status

devtrack autostart-install
devtrack autostart-status
devtrack autostart-uninstall
devtrack upgrade --check
devtrack upgrade
devtrack uninstall</code></pre>

<h2>Optional Advanced Commands</h2>
<p><code>devtrack boardroom</code> reviews a plan with multiple personas, <code>devtrack plan</code> decomposes work, and <code>devtrack cloud</code> manages an external-server credential file. These are not required for the silent commit-to-EOD workflow.</p>

<blockquote><p>If a command in an old blog post is absent from <code>devtrack help</code>, do not guess. Removed examples include <code>devtrack health</code>, <code>devtrack server-tui</code> and <code>devtrack admin-start</code>.</p></blockquote>
</div>`,

  CONFIGURATION: `<div class="md-body">
<h1>Configuration Reference</h1>
<p><code>devtrack setup</code> is the canonical configuration path. It writes a private environment file under the DevTrack data home, creates a workspace file, and registers the environment location. Later commands load it automatically; a first-time user should not need to copy or manually source a repository <code>.env</code>.</p>

<h2>Configuration Precedence</h2>
<ol>
<li>Variables already present in the running process take precedence.</li>
<li><code>DEVTRACK_ENV_FILE</code> can explicitly select an environment file.</li>
<li>The path registered in <code>~/.devtrack/devtrack.conf</code> is used for normal installed operation.</li>
<li>Repository/local fallbacks exist for development and migration scenarios.</li>
</ol>
<p>Use <code>devtrack settings</code> to see resolved paths and masked values. Restart the daemon after changing its environment; it does not hot-reload an environment file.</p>

<h2>Deployment Mode</h2>
<div class="table-wrap"><table><thead><tr><th>Variable</th><th>Meaning</th></tr></thead><tbody>
<tr><td><code>DEVTRACK_SERVER_MODE</code></td><td><code>managed</code>, <code>lightweight</code> or <code>external</code>.</td></tr>
<tr><td><code>DEVTRACK_SERVER_URL</code></td><td>Base URL of a separately operated Python server in external mode.</td></tr>
<tr><td><code>POSTGRES_URL</code></td><td>Required by every Python server. Never read by the Go client's database layer.</td></tr>
<tr><td><code>SERVER_EVENT_SYNC_ENABLED</code></td><td>Opt-in upload of selected client events to the server; default is false.</td></tr>
</tbody></table></div>

<h2>Local Paths</h2>
<div class="table-wrap"><table><thead><tr><th>Variable</th><th>Purpose</th></tr></thead><tbody>
<tr><td><code>DEVTRACK_WORKSPACE</code></td><td>Single repository to observe when a workspace list is not used.</td></tr>
<tr><td><code>WORKSPACES_FILE</code></td><td>Path to multi-repository <code>workspaces.yaml</code>.</td></tr>
<tr><td><code>DATA_DIR</code></td><td>Runtime root.</td></tr>
<tr><td><code>DATABASE_DIR</code></td><td>Go-owned SQLite directory.</td></tr>
<tr><td><code>LOG_DIR</code>, <code>PID_DIR</code>, <code>REPORT_DIR</code></td><td>Generated logs, lifecycle state and reports.</td></tr>
</tbody></table></div>
<p>Setup creates these paths. Do not point tests or multiple users at a shared production data directory.</p>

<h2>LLM Providers</h2>
<div class="table-wrap"><table><thead><tr><th>Provider</th><th>Important settings</th><th>Role</th></tr></thead><tbody>
<tr><td>Ollama</td><td><code>LLM_PROVIDER=ollama</code>, <code>OLLAMA_HOST</code>, <code>OLLAMA_MODEL</code></td><td>Local default.</td></tr>
<tr><td>LM Studio</td><td><code>LLM_PROVIDER=lmstudio</code>, <code>LMSTUDIO_HOST</code></td><td>Local OpenAI-compatible endpoint.</td></tr>
<tr><td>OpenAI</td><td><code>OPENAI_API_KEY</code>, <code>OPENAI_MODEL</code></td><td>Optional cloud provider/fallback.</td></tr>
<tr><td>Anthropic</td><td><code>ANTHROPIC_API_KEY</code>, <code>ANTHROPIC_MODEL</code></td><td>Optional cloud provider/fallback.</td></tr>
<tr><td>Groq</td><td><code>GROQ_API_KEY</code>, <code>GROQ_MODEL</code></td><td>Optional OpenAI-compatible fallback.</td></tr>
</tbody></table></div>
<p><code>OLLAMA_URL</code> and <code>LMSTUDIO_URL</code> are retired. The current settings are <code>OLLAMA_HOST</code> and <code>LMSTUDIO_HOST</code>. Git-sage can select its own provider/model with <code>GIT_SAGE_PROVIDER</code> and <code>GIT_SAGE_DEFAULT_MODEL</code>.</p>

<h2>Timeout and Readiness Settings</h2>
<p>Setup writes visible defaults for IPC connection/retry, short/normal/long HTTP operations, LLM requests, prompt-bound legacy/optional interfaces and sentiment analysis. Common settings include:</p>
<pre><code class="language-bash">IPC_CONNECT_TIMEOUT_SECS=5
IPC_RETRY_DELAY_MS=2000
HTTP_TIMEOUT_SHORT=10
HTTP_TIMEOUT=30
HTTP_TIMEOUT_LONG=60
LLM_REQUEST_TIMEOUT_SECS=120
SQLITE_BUSY_TIMEOUT_MS=5000</code></pre>
<p>Increase the long/LLM timeouts for a healthy but slow local model. Invalid explicit overrides fail with the setting name instead of silently inventing a value.</p>

<h2>Workspaces and Secrets</h2>
<p>DevTrack deliberately separates credentials from routing metadata:</p>
<div class="table-wrap"><table><thead><tr><th>Location</th><th>Contains</th></tr></thead><tbody>
<tr><td>Registered environment file</td><td>Tokens and secrets: <code>GITHUB_TOKEN</code>, <code>GITLAB_PAT</code>, <code>AZURE_DEVOPS_PAT</code>, optional cloud keys, bot tokens and server secrets.</td></tr>
<tr><td><code>workspaces.yaml</code></td><td>Repository path, platform, organization, project, API URL, username, ticket pattern, ignored branches and <code>skip_issues</code>.</td></tr>
</tbody></table></div>
<p>Never commit real credentials. A workspace entry is always required for connector routing even when its token is present.</p>

<h2>Scheduler and Working Hours</h2>
<div class="table-wrap"><table><thead><tr><th>Setting</th><th>Meaning</th></tr></thead><tbody>
<tr><td><code>PROMPT_INTERVAL</code></td><td>Legacy name for the scheduler timer interval; it does not mean the daemon prompts in the main flow.</td></tr>
<tr><td><code>WORK_HOURS_ONLY</code></td><td>Limit scheduled timer events to configured working hours.</td></tr>
<tr><td><code>WORK_START_HOUR</code>/<code>WORK_END_HOUR</code></td><td>Local 24-hour boundaries.</td></tr>
<tr><td><code>TIMEZONE</code></td><td>Timezone used by scheduled behavior and reports.</td></tr>
</tbody></table></div>

<h2>Feature Settings</h2>
<ul>
<li><strong>Telegram:</strong> <code>TELEGRAM_ENABLED</code>, <code>TELEGRAM_BOT_TOKEN</code>, <code>TELEGRAM_ALLOWED_CHAT_IDS</code>.</li>
<li><strong>Slack alert delivery:</strong> <code>SLACK_WEBHOOK_URL</code>. The Python Socket Mode command bot separately uses <code>SLACK_ENABLED</code>, bot/app tokens and allowed channels.</li>
<li><strong>Alerts:</strong> <code>ALERT_ENABLED</code> plus supported GitHub/Azure source toggles and notifier settings.</li>
<li><strong>Admin console:</strong> host/port, username/password and <code>ADMIN_SECRET_KEY</code>; restrict the bind address before network exposure.</li>
<li><strong>Voice:</strong> RAG/embedding settings and optional opt-in external sources.</li>
</ul>

<h2>Authoritative Samples</h2>
<p>The maintained exhaustive samples are <code>devtrack_client/.env_sample</code>, <code>devtrack_server/.env_sample</code> and <code>devtrack_client/workspaces.yaml.example</code>. When a copied configuration block conflicts with those files or <code>devtrack settings</code>, use the executable/current sample and report the documentation drift.</p>
</div>`,

  LICENSE: `<div class="md-body">
<h1>License</h1>
<p>DevTrack uses a <strong>Community License</strong> — free for individuals and small teams, with a commercial licence required for larger organisations and hosted deployments.</p>

<h2>Tiers at a Glance</h2>
<div class="table-wrap"><table>
<thead><tr><th>Tier</th><th>Cost</th><th>Who it is for</th></tr></thead>
<tbody>
<tr><td><strong>Personal</strong></td><td>Free</td><td>Single developer, personal use</td></tr>
<tr><td><strong>Team</strong></td><td>Free</td><td>Self-hosted, up to 10 users</td></tr>
<tr><td><strong>Enterprise</strong></td><td>Commercial licence required</td><td>11+ users, or any hosted/SaaS deployment</td></tr>
</tbody>
</table></div>

<blockquote><p>All tiers work fully offline. Login is optional for Personal and Team. No licence server call is ever made in local mode.</p></blockquote>

<h2>First-Run T&amp;C Acceptance</h2>
<p>The first time DevTrack starts (or when you run <code>devtrack terms</code>), a summary of the Terms of Service is printed to the terminal and you are asked to accept before the daemon starts. Acceptance is stored in <code>Data/license/acceptance.json</code> — no network call is required.</p>

<h3>CLI Commands</h3>
<div class="table-wrap"><table>
<thead><tr><th>Command</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>devtrack terms</code></td><td>Print the T&amp;C summary and prompt for acceptance</td></tr>
<tr><td><code>devtrack terms --accept</code></td><td>Accept non-interactively (useful for CI/scripts — same as <code>DEVTRACK_AUTO_ACCEPT_TERMS=1</code>)</td></tr>
<tr><td><code>devtrack license</code></td><td>Show the active tier and acceptance status</td></tr>
</tbody>
</table></div>

<h3>Non-Interactive / CI Mode</h3>
<p>Set <code>DEVTRACK_AUTO_ACCEPT_TERMS=1</code> in your environment or pass <code>--accept</code> to <code>devtrack terms</code> to suppress the interactive prompt. A warning is printed to stderr so the auto-acceptance is visible in CI logs.</p>

<h3>Acceptance Record</h3>
<p>The acceptance file is stored at <code>Data/license/acceptance.json</code> (path resolves from <code>DATA_DIR</code> if set):</p>
<pre><code class="language-json">{
  "terms_version": "1.0",
  "accepted_at": "2026-03-31T10:00:00+00:00",
  "user_identifier": "sraj",
  "mode": "local"
}</code></pre>
<p>The daemon checks <code>terms_version</code> on startup. If a new version of the terms is released, you will be prompted again on the next start.</p>

<h2>Enterprise Licensing</h2>
<p>If you are deploying DevTrack for 11 or more users, or running it as a hosted/SaaS service, a commercial enterprise licence is required. Contact <a href="mailto:enterprise@devtrack.dev" target="_blank" rel="noopener">enterprise@devtrack.dev</a> or visit <a href="https://github.com/sraj0501/Devtrack_/blob/main/LICENSE" target="_blank" rel="noopener">the DevTrack Community License</a>.</p>
<p>In a self-hosted deployment, <code>backend/license_manager.py</code> detects the tier from the user count in the Admin Console. Tier enforcement is advisory in local mode — the daemon will warn but not block. In SaaS mode, the tier is enforced server-side.</p>

<h2>Privacy Summary</h2>
<ul>
<li><strong>Offline/local mode</strong>: zero data collection (default).</li>
<li><strong>Telemetry</strong>: strictly opt-in — only when you run <code>devtrack telemetry on</code> explicitly.</li>
<li><strong>Your code, commits, and work updates</strong> never leave your machine unless you enable cloud features.</li>
<li><strong>Login</strong>: optional for Personal and Team tiers. Magic-link login is used only if <code>DEVTRACK_API_URL</code> is set.</li>
</ul>

<p>Full terms: <code>TERMS.md</code> in the DevTrack installation directory, or <a href="https://github.com/sraj0501/Devtrack_/blob/main/TERMS.md" target="_blank" rel="noopener">TERMS.md on GitHub</a>.</p>
</div>`,

  AUTH: `<div class="md-body">
<h1>Login &amp; Auth</h1>
<p>DevTrack's authentication system is <strong>optional and offline-first</strong>. The daemon works fully without any login. Login is only needed for cloud features — syncing settings across machines, SaaS team management, or enterprise licence validation.</p>

<h2>Overview</h2>
<div class="table-wrap"><table>
<thead><tr><th>Scenario</th><th>Login needed?</th></tr></thead>
<tbody>
<tr><td>Local single-user (Personal/Team)</td><td>No — works offline without any auth</td></tr>
<tr><td>Cloud-backed settings sync</td><td>Yes — <code>devtrack login</code></td></tr>
<tr><td>Enterprise team management</td><td>Yes — admin login via Admin Console</td></tr>
</tbody>
</table></div>

<h2>CLI Commands</h2>
<div class="table-wrap"><table>
<thead><tr><th>Command</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>devtrack login</code></td><td>Start the magic-link login flow — enter your email, receive a one-time code, confirm it</td></tr>
<tr><td><code>devtrack logout</code></td><td>Clear the local session and token</td></tr>
<tr><td><code>devtrack whoami</code></td><td>Show the currently logged-in email (or "not logged in")</td></tr>
</tbody>
</table></div>

<h2>Magic-Link Flow</h2>
<ol>
<li>Run <code>devtrack login</code> and enter your email address.</li>
<li>The backend (<code>DEVTRACK_API_URL</code>) sends a one-time code to that address.</li>
<li>Enter the code in the terminal — you receive a JWT session token.</li>
<li>The token and session are saved locally in <code>Data/license/session.json</code> (chmod 0600).</li>
</ol>

<p>If <code>DEVTRACK_API_URL</code> is not set, the login command falls back to creating a <strong>local-only session</strong> — no network call is made and no token is issued, but your email is stored as a local identifier (useful for personalisation features).</p>

<h3>Session File</h3>
<p>Sessions are stored at <code>Data/license/session.json</code>:</p>
<pre><code class="language-json">{
  "email": "you@example.com",
  "token": "eyJ...",
  "logged_in_at": "2026-03-31T10:00:00+00:00",
  "expires_at": "2026-04-30T10:00:00+00:00"
}</code></pre>
<p>Sessions expire after 30 days. Run <code>devtrack login</code> again to refresh.</p>

<h2>Local-Only Sessions</h2>
<p>If you want personalisation features (e.g. "Talk Like You") to identify you without cloud connectivity, run <code>devtrack login</code> with no <code>DEVTRACK_API_URL</code> set. The system creates an offline session with your email stored locally — used as the identifier for MongoDB sample storage and the personalization profile.</p>

<h2>Configuration</h2>
<div class="table-wrap"><table>
<thead><tr><th>Variable</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>DEVTRACK_API_URL</code></td><td>Cloud API endpoint for magic-link auth. Omit for local-only sessions.</td></tr>
</tbody>
</table></div>

<h2>Implementation Files</h2>
<div class="table-wrap"><table>
<thead><tr><th>File</th><th>Purpose</th></tr></thead>
<tbody>
<tr><td><code>backend/auth/__init__.py</code></td><td>Package init; exports <code>get_session()</code>, <code>require_login()</code></td></tr>
<tr><td><code>backend/auth/local_auth.py</code></td><td>Read/write <code>Data/license/session.json</code>; no network calls</td></tr>
<tr><td><code>backend/auth/cloud_auth.py</code></td><td>Magic-link flow: <code>request_magic_link()</code>, <code>verify_code()</code>; degrades gracefully offline</td></tr>
<tr><td><code>backend/auth/session.py</code></td><td><code>AuthSession</code> dataclass; <code>make_offline_session()</code>; 30-day TTL</td></tr>
</tbody>
</table></div>

<blockquote><p><strong>Security note:</strong> The session file is written with <code>chmod 0600</code> — readable only by the current user. Tokens are JWTs issued by the DevTrack cloud server; they are verified server-side on each cloud API call. Local-only sessions have no token and no server-side state.</p></blockquote>
</div>`,

  TEST_SUITE: `<div class="md-body">
<h1>Test Suite</h1>
<p>The test suite protects DevTrack's trust and architecture boundaries, not just individual functions. It is especially important because the product spans a Go daemon, local SQLite, a Python server, PostgreSQL, external connectors and static documentation.</p>
<h2>Run Go Verification</h2>
<pre><code class="language-bash">cd devtrack_client
GOCACHE=/tmp/devtrack-go-cache GOMODCACHE=/tmp/devtrack-go-mod go test ./...
GOCACHE=/tmp/devtrack-go-cache GOMODCACHE=/tmp/devtrack-go-mod go vet ./...</code></pre>
<h2>Run Python Verification</h2>
<pre><code class="language-bash">cd devtrack_server
UV_CACHE_DIR=/tmp/devtrack-uv-cache uv sync
UV_CACHE_DIR=/tmp/devtrack-uv-cache uv run pytest backend/tests/ -q</code></pre>
<p>Python dependencies are managed with <code>uv</code>, never <code>pip</code>.</p>
<h2>Run Wiki Verification</h2>
<pre><code class="language-bash">cd devtrack_wiki
python3 check_inline_js.py
node --check wiki/assets/home.js
node --check wiki/assets/script.js
sh -n wiki/install.sh</code></pre>
<h2>High-Value Invariants</h2>
<ul>
<li>Tests touching <code>DATABASE_DIR</code> isolate it to a temporary directory.</li>
<li>Tests changing <code>LLM_PROVIDER</code> reset the provider cache before and after.</li>
<li>External PM, chat and LLM calls are mocked unless the test is explicitly an integration test.</li>
<li>The Go client remains SQLite-only and the Python server's PostgreSQL boundary is explicit.</li>
<li>Outbound behavior must remain staged through pending actions.</li>
<li>Documentation JavaScript checks include inline scripts, which previously caused a production loading-screen failure.</li>
</ul>
<h2>Interpreting Failures</h2>
<p>Separate product failures from environment failures. Missing dependency downloads, restricted network access, unavailable Docker, or unwritable caches are setup failures and must not be reported as passing tests. Start with the first real assertion/error rather than the cascade that follows it.</p>
</div>`,

  WORKSPACES: `<div class="md-body">
<h1>Workspaces</h1>
<p>A <strong>workspace</strong> is a git repository that DevTrack monitors. Each workspace in <code>workspaces.yaml</code> can route to a different project management platform with its own credentials, project, and assignment rules. This page covers every field for each supported platform.</p>

<h2>File Location</h2>
<p><code>devtrack setup</code> writes the file automatically. You can also manage it with CLI commands:</p>
<pre><code class="language-bash">devtrack workspace list                           # show all workspaces
devtrack workspace add myrepo ~/code/myrepo       # add a new workspace
devtrack workspace remove myrepo                  # remove a workspace
devtrack workspace enable myrepo                  # resume monitoring
devtrack workspace disable myrepo                 # pause without removing
devtrack workspace reload                         # hot-reload after manual edits</code></pre>
<p>The file path is set by <code>WORKSPACES_FILE</code> in <code>.env</code> (default: <code>~/.devtrack/workspaces.yaml</code> or <code>$PROJECT_ROOT/workspaces.yaml</code>).</p>

<h2>Universal Fields</h2>
<p>Every workspace entry, regardless of platform, supports these fields:</p>
<div class="table-wrap"><table>
<thead><tr><th>Field</th><th>Required</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>name</code></td><td>Yes</td><td>Display name used in logs, TUI, and CLI output</td></tr>
<tr><td><code>path</code></td><td>Yes</td><td>Absolute path (or <code>~/</code>) to the git repository root</td></tr>
<tr><td><code>pm_platform</code></td><td>Yes</td><td><code>github</code> | <code>gitlab</code> | <code>azure</code> | <code>jira</code> | <code>none</code></td></tr>
<tr><td><code>enabled</code></td><td>No</td><td><code>true</code> (default) / <code>false</code> — pause monitoring without removing</td></tr>
<tr><td><code>ignore_branches</code></td><td>No</td><td>List of branch patterns to skip (e.g. <code>main</code>, <code>release/*</code>)</td></tr>
<tr><td><code>tags</code></td><td>No</td><td>Arbitrary labels for your own filtering</td></tr>
<tr><td><code>pm_assignee</code></td><td>No</td><td>Default assignee for new issues/tasks (format varies by platform)</td></tr>
<tr><td><code>skip_issues</code></td><td>No</td><td><code>false</code> (default). Set <code>true</code> to mark this workspace as code-only: excluded from <code>devtrack issues</code>, ticket sync, and the commit-time ticket picker. Use when a repo is tracked in two platforms (e.g. GitHub for code, Azure DevOps for PM) to prevent duplicate ticket lists.</td></tr>
</tbody>
</table></div>

<hr>

<h2>GitHub</h2>
<h3>Required .env secrets</h3>
<div class="table-wrap"><table>
<thead><tr><th>Variable</th><th>Value</th><th>Where to get it</th></tr></thead>
<tbody>
<tr><td><code>GITHUB_TOKEN</code></td><td>Personal access token</td><td>GitHub → Settings → Developer Settings → Personal access tokens → Generate new token. Scopes needed: <code>repo</code> (full) or <code>issues:write</code> + <code>pull_requests:write</code> for fine-grained tokens.</td></tr>
</tbody>
</table></div>

<h3>workspaces.yaml fields</h3>
<div class="table-wrap"><table>
<thead><tr><th>Field</th><th>Required</th><th>Format</th><th>Where to find it</th></tr></thead>
<tbody>
<tr><td><code>pm_platform</code></td><td>Yes</td><td><code>"github"</code></td><td>—</td></tr>
<tr><td><code>pm_org</code></td><td>Yes</td><td>Owner login or org name</td><td>The <code>owner</code> part of <code>github.com/owner/repo</code></td></tr>
<tr><td><code>pm_username</code></td><td>Yes</td><td>Your GitHub login</td><td>github.com → top-right avatar → Your profile → the username in the URL</td></tr>
<tr><td><code>pm_project</code></td><td>No</td><td><code>"owner/repo"</code></td><td>Overrides the default repo for issue creation. Leave blank to use the repo the commit came from.</td></tr>
<tr><td><code>pm_api_url</code></td><td>No</td><td>Base URL</td><td>Only for GitHub Enterprise: <code>https://github.mycompany.com/api/v3</code>. Leave blank for github.com.</td></tr>
<tr><td><code>pm_milestone</code></td><td>No</td><td>Integer</td><td>Milestone number from the URL: <code>github.com/owner/repo/milestone/<strong>3</strong></code>. Use <code>0</code> or omit for no milestone.</td></tr>
<tr><td><code>pm_assignee</code></td><td>No</td><td>GitHub username</td><td>The login to auto-assign on new issues (e.g. <code>sraj0501</code>)</td></tr>
</tbody>
</table></div>

<h3>Complete GitHub example</h3>
<pre><code class="language-yaml">- name: "my-api"
  path: ~/code/my-api
  pm_platform: github
  pm_org: acme-corp          # github.com/acme-corp/...
  pm_username: sraj0501       # your GitHub login
  pm_project: "acme-corp/my-api"
  pm_milestone: 4            # github.com/acme-corp/my-api/milestone/4
  pm_assignee: sraj0501
  enabled: true
  ignore_branches:
    - main
    - "dependabot/*"</code></pre>

<hr>

<h2>GitLab</h2>
<h3>Required .env secrets</h3>
<div class="table-wrap"><table>
<thead><tr><th>Variable</th><th>Value</th><th>Where to get it</th></tr></thead>
<tbody>
<tr><td><code>GITLAB_PAT</code></td><td>Personal access token</td><td>GitLab → User Settings → Access Tokens → Add new token. Scopes needed: <code>api</code> (or at minimum <code>read_api</code> + <code>write_repository</code>).</td></tr>
</tbody>
</table></div>

<h3>workspaces.yaml fields</h3>
<div class="table-wrap"><table>
<thead><tr><th>Field</th><th>Required</th><th>Format</th><th>Where to find it</th></tr></thead>
<tbody>
<tr><td><code>pm_platform</code></td><td>Yes</td><td><code>"gitlab"</code></td><td>—</td></tr>
<tr><td><code>pm_org</code></td><td>Yes</td><td>Namespace (user or group)</td><td>The <code>namespace</code> part of <code>gitlab.com/namespace/project</code></td></tr>
<tr><td><code>pm_username</code></td><td>Yes</td><td>Your GitLab username</td><td>GitLab → User Settings → Profile → Username field</td></tr>
<tr><td><code>pm_project</code></td><td>No</td><td>Numeric project ID</td><td>GitLab project → Settings → General → Project ID (shown at the top). Must be a numeric string, e.g. <code>"12345"</code>. Overrides <code>GITLAB_PROJECT_ID</code> from <code>.env</code>.</td></tr>
<tr><td><code>pm_api_url</code></td><td>No</td><td>Base URL</td><td>Only for self-hosted GitLab: <code>https://gitlab.mycompany.com</code>. Leave blank for gitlab.com.</td></tr>
<tr><td><code>pm_milestone</code></td><td>No</td><td>Integer</td><td>Milestone ID from the GitLab API: <code>GET /projects/:id/milestones</code> → <code>id</code> field. Use <code>0</code> or omit for no milestone.</td></tr>
<tr><td><code>pm_assignee</code></td><td>No</td><td>Numeric user ID</td><td>GitLab API: <code>GET /users?username=yourname</code> → <code>id</code> field. GitLab requires a numeric ID, not a username string.</td></tr>
</tbody>
</table></div>

<h3>Complete GitLab example</h3>
<pre><code class="language-yaml">- name: "backend-service"
  path: ~/code/backend-service
  pm_platform: gitlab
  pm_org: acme-corp            # gitlab.com/acme-corp/...
  pm_username: shashank.raj    # your GitLab username
  pm_project: "54321"          # numeric project ID from Settings → General
  pm_api_url: ""               # leave blank for gitlab.com; set for self-hosted
  pm_milestone: 7              # milestone ID from GET /projects/54321/milestones
  pm_assignee: "1042"          # numeric user ID from GET /users?username=shashank.raj
  enabled: true
  ignore_branches:
    - main
    - "release/*"</code></pre>

<hr>

<h2>Azure DevOps</h2>
<h3>Required .env secrets</h3>
<div class="table-wrap"><table>
<thead><tr><th>Variable</th><th>Value</th><th>Where to get it</th></tr></thead>
<tbody>
<tr><td><code>AZURE_DEVOPS_PAT</code></td><td>Personal access token</td><td>Azure DevOps → User Settings (top-right) → Personal access tokens → New Token. Scopes needed: <code>Work Items (Read &amp; Write)</code>. Set expiry to at least 1 year.</td></tr>
</tbody>
</table></div>

<h3>workspaces.yaml fields</h3>
<div class="table-wrap"><table>
<thead><tr><th>Field</th><th>Required</th><th>Format</th><th>Where to find it</th></tr></thead>
<tbody>
<tr><td><code>pm_platform</code></td><td>Yes</td><td><code>"azure"</code></td><td>—</td></tr>
<tr><td><code>pm_org</code></td><td>Yes</td><td>Organization name</td><td>The <code>org</code> part of <code>dev.azure.com/org/project</code></td></tr>
<tr><td><code>pm_username</code></td><td>Yes</td><td>Your Azure DevOps email</td><td>The email shown in the top-right corner of Azure DevOps. Used to filter your own comments out of alert notifications.</td></tr>
<tr><td><code>pm_project</code></td><td>No</td><td>Project name</td><td>Overrides <code>AZURE_PROJECT</code> from <code>.env</code>. The <code>project</code> part of <code>dev.azure.com/org/<strong>project</strong></code>.</td></tr>
<tr><td><code>pm_api_url</code></td><td>No</td><td>Base URL</td><td>Only for Azure DevOps Server (on-prem): <code>https://ado.mycompany.com/tfs</code>. Leave blank for dev.azure.com.</td></tr>
<tr><td><code>pm_assignee</code></td><td>No</td><td>Email or display name</td><td>The full email or display name of the assignee for new work items (e.g. <code>jane.doe@acme.com</code>)</td></tr>
<tr><td><code>pm_iteration_path</code></td><td>No</td><td><code>"Project\\Sprint N"</code></td><td>Azure DevOps → Boards → Sprints → the path shown in the breadcrumb. Use <code>\\</code> as separator. Project prefix is added automatically.</td></tr>
<tr><td><code>pm_area_path</code></td><td>No</td><td><code>"Project\\Team\\Area"</code></td><td>Azure DevOps → Project Settings → Project configuration → Area paths. Use <code>\\</code> as separator.</td></tr>
</tbody>
</table></div>

<h3>Complete Azure DevOps example</h3>
<pre><code class="language-yaml">- name: "platform-api"
  path: ~/code/platform-api
  pm_platform: azure
  pm_org: acme-corp                         # dev.azure.com/acme-corp/...
  pm_username: shashank.raj@acme.com        # your ADO login email
  pm_project: CoreServices                  # dev.azure.com/acme-corp/CoreServices
  pm_api_url: ""                            # leave blank for dev.azure.com
  pm_assignee: shashank.raj@acme.com
  pm_iteration_path: "CoreServices\\Sprint 42"
  pm_area_path: "CoreServices\\Platform\\API"
  enabled: true
  ignore_branches:
    - main
    - "hotfix/*"</code></pre>

<hr>

<h2>No PM sync</h2>
<p>Use <code>pm_platform: none</code> to monitor a repository locally without syncing anything to a PM platform. Commits still appear in activity views and feed local context.</p>
<pre><code class="language-yaml">- name: "scratch"
  path: ~/code/scratch
  pm_platform: none
  enabled: true</code></pre>

<hr>

<h2>Full annotated workspaces.yaml</h2>
<pre><code class="language-yaml">version: "1"
workspaces:

  # ── GitHub ──────────────────────────────────────────────────────────────────
  - name: "oss-lib"
    path: ~/code/oss-lib
    pm_platform: github
    pm_org: acme-corp           # github.com org or user
    pm_username: sraj0501        # your GitHub login
    pm_project: ""              # "owner/repo" override — leave blank to use origin
    pm_api_url: ""              # blank = github.com; set for GitHub Enterprise
    pm_milestone: 3             # milestone number from URL, 0 = none
    pm_assignee: sraj0501
    enabled: true
    ignore_branches: [main, "dependabot/*"]
    tags: [oss]

  # ── GitLab ──────────────────────────────────────────────────────────────────
  - name: "backend"
    path: ~/code/backend
    pm_platform: gitlab
    pm_org: acme-corp           # gitlab.com namespace
    pm_username: shashank.raj   # your GitLab username
    pm_project: "54321"         # numeric project ID (required if GITLAB_PROJECT_ID not set)
    pm_api_url: ""              # blank = gitlab.com; set for self-hosted
    pm_milestone: 7             # milestone ID from API, 0 = none
    pm_assignee: "1042"         # numeric user ID (NOT username string)
    enabled: true
    ignore_branches: [main, "release/*"]
    tags: [work, backend]

  # ── Azure DevOps ─────────────────────────────────────────────────────────────
  - name: "platform-api"
    path: ~/code/platform-api
    pm_platform: azure
    pm_org: acme-corp           # dev.azure.com org name
    pm_username: shashank.raj@acme.com   # your ADO email
    pm_project: CoreServices    # ADO project name
    pm_api_url: ""              # blank = dev.azure.com; set for ADO Server
    pm_assignee: shashank.raj@acme.com
    pm_iteration_path: "CoreServices\\Sprint 42"
    pm_area_path: "CoreServices\\Platform\\API"
    enabled: true
    ignore_branches: [main, "hotfix/*"]
    tags: [work, platform]

  # ── No sync ──────────────────────────────────────────────────────────────────
  - name: "scratch"
    path: ~/code/scratch
    pm_platform: none
    enabled: true</code></pre>

<h2>Dual-platform setup (GitHub + Azure DevOps)</h2>
<p>When a repo uses GitHub for code review and Azure DevOps for project management, add two workspace entries for the same path. Mark the GitHub workspace <code>skip_issues: true</code> so only ADO drives <code>devtrack issues</code> and ticket sync:</p>
<pre><code class="language-yaml">workspaces:

  # GitHub — code review only; issues suppressed
  - name: "my-api-github"
    path: ~/code/my-api
    pm_platform: github
    pm_org: acme-corp
    pm_username: sraj0501
    enabled: true
    skip_issues: true          # exclude from devtrack issues + ticket sync

  # Azure DevOps — authoritative PM platform
  - name: "my-api-ado"
    path: ~/code/my-api
    pm_platform: azure
    pm_org: acme-corp
    pm_username: shashank.raj@acme.com
    pm_project: CoreServices
    enabled: true</code></pre>
<p>With this config <code>devtrack issues</code> shows only ADO work items, and commits route to ADO for PM updates.</p>

<hr>

<h2>Hot-reload</h2>
<p>Save <code>workspaces.yaml</code> and DevTrack detects the change instantly (fsnotify). Only the monitors that changed are restarted — others keep running without interruption. Or reload manually:</p>
<pre><code class="language-bash">devtrack workspace reload</code></pre>

<h2>Common mistakes</h2>
<div class="table-wrap"><table>
<thead><tr><th>Symptom</th><th>Cause</th><th>Fix</th></tr></thead>
<tbody>
<tr><td>Issues created but unassigned</td><td><code>pm_assignee</code> wrong format</td><td>GitHub: username string. GitLab: numeric user ID. Azure: full email.</td></tr>
<tr><td>GitLab: pm_project ignored</td><td>Value is not a numeric string</td><td>Use <code>"12345"</code> not <code>my-project</code></td></tr>
<tr><td>ADO work items in wrong sprint</td><td>Backslash not escaped in YAML</td><td>Use <code>"Project\\Sprint 42"</code> (double backslash)</td></tr>
<tr><td>Workspace not monitoring</td><td><code>enabled: false</code> or invalid path</td><td>Run <code>devtrack workspace list</code> to check status</td></tr>
<tr><td>All commits routing to wrong platform</td><td>Empty <code>pm_platform</code></td><td>Falls back to priority chain (Azure → GitLab → GitHub). Set explicitly.</td></tr>
<tr><td>GitHub Enterprise not reached</td><td><code>pm_api_url</code> not set</td><td>Set to <code>https://github.mycompany.com/api/v3</code></td></tr>
<tr><td>Duplicate issues from GitHub + Azure DevOps</td><td>Both workspaces included in issue listing</td><td>Add <code>skip_issues: true</code> to the code-hosting workspace (usually GitHub). See the dual-platform setup example above.</td></tr>
</tbody>
</table></div>
</div>`,

  MULTI_REPO: `<div class="md-body">
<h1>Multi-Repo Monitoring</h1>
<p>By default DevTrack monitors a single repository (<code>DEVTRACK_WORKSPACE</code>). <strong>Multi-repo mode</strong> lets you monitor any number of repositories simultaneously, each routing to its own project management platform.</p>

<h2>Setup</h2>
<pre><code class="language-bash"># Create workspaces.yaml at PROJECT_ROOT (or copy the sample)
cp workspaces.yaml.sample workspaces.yaml
nano workspaces.yaml

# Restart the daemon to pick up changes
devtrack restart

# Verify multi-repo mode is active
devtrack status   # shows workspace_count: N</code></pre>

<p>The daemon also hot-reloads on save — edit <code>workspaces.yaml</code> and DevTrack surgically restarts only the monitors that changed, without interrupting others.</p>

<h2>workspaces.yaml Schema</h2>
<pre><code class="language-yaml">version: "1"
workspaces:
  - name: "work-api"            # display name (required)
    path: ~/work/api            # absolute or ~/ path to git repo (required)
    pm_platform: azure          # routing target (required — see table below)
    pm_project: ""              # optional: platform-specific project override
    pm_milestone: 0             # optional: milestone number/ID for new issues
    enabled: true               # false = pause without removing
    ignore_branches:            # branches to skip (e.g. dependabot/*)
      - "dependabot/*"
    tags: [work]                # arbitrary labels for your own use</code></pre>

<h2>pm_platform Values</h2>
<div class="table-wrap"><table>
<thead><tr><th>Value</th><th>Routes to</th><th>Notes</th></tr></thead>
<tbody>
<tr><td><code>azure</code></td><td>Azure DevOps</td><td>Uses <code>AZURE_ORGANIZATION</code> / <code>AZURE_PROJECT</code> from <code>.env</code></td></tr>
<tr><td><code>gitlab</code></td><td>GitLab</td><td>Uses <code>GITLAB_PROJECT_ID</code> from <code>.env</code> unless <code>pm_project</code> is set</td></tr>
<tr><td><code>github</code></td><td>GitHub</td><td>Uses <code>GITHUB_OWNER</code> / <code>GITHUB_REPO</code> from <code>.env</code></td></tr>
<tr><td><code>jira</code></td><td>Jira</td><td>Uses <code>JIRA_URL</code>, <code>JIRA_EMAIL</code>, <code>JIRA_API_TOKEN</code></td></tr>
<tr><td><code>none</code></td><td>—</td><td>Monitoring active; PM sync disabled for this repo</td></tr>
<tr><td>(empty)</td><td>Priority chain</td><td>Falls back to Azure → GitLab → GitHub (single-repo behavior)</td></tr>
</tbody>
</table></div>

<h2>pm_project Field</h2>
<div class="table-wrap"><table>
<thead><tr><th>Platform</th><th>Meaning</th></tr></thead>
<tbody>
<tr><td><code>azure</code></td><td>Project name (overrides <code>AZURE_PROJECT</code>)</td></tr>
<tr><td><code>gitlab</code></td><td>Numeric project ID (overrides <code>GITLAB_PROJECT_ID</code>)</td></tr>
<tr><td><code>github</code></td><td>Ignored — owner/repo comes from <code>.env</code></td></tr>
</tbody>
</table></div>

<h2>pm_milestone Field</h2>
<p>Assigns newly created issues to a milestone. Leave at <code>0</code> or omit to create issues without a milestone.</p>
<div class="table-wrap"><table>
<thead><tr><th>Platform</th><th>Meaning</th></tr></thead>
<tbody>
<tr><td><code>github</code></td><td>GitHub milestone number (integer from milestone URL: <code>.../milestones/N</code>)</td></tr>
<tr><td><code>gitlab</code></td><td>GitLab milestone ID (integer from <code>GET /projects/:id/milestones</code>)</td></tr>
<tr><td><code>azure</code></td><td>Ignored</td></tr>
</tbody>
</table></div>

<h2>PM Override Fields <span style="font-size:.75rem;font-weight:400;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 8px;margin-left:6px;">v1.4-dev</span></h2>
<p>Per-workspace overrides for PM assignee, area path, iteration path, and milestone. These values are extracted from commit triggers and forwarded to the platform API when creating work items or issues.</p>

<h3>pm_assignee</h3>
<div class="table-wrap"><table>
<thead><tr><th>Platform</th><th>Format</th><th>API Field</th></tr></thead>
<tbody>
<tr><td><code>azure</code></td><td>Email or display name</td><td><code>assigned_to</code></td></tr>
<tr><td><code>github</code></td><td>Username (e.g., <code>sraj</code>)</td><td><code>assignees[]</code></td></tr>
<tr><td><code>gitlab</code></td><td>Numeric user ID</td><td><code>assignee_ids[]</code></td></tr>
</tbody>
</table></div>

<h3>pm_iteration_path (Azure only)</h3>
<p>Azure DevOps iteration path for new work items. Format: <code>Project\\Iteration Path</code> or just <code>Iteration Path</code> (project is prepended automatically).</p>
<pre><code class="language-yaml">pm_iteration_path: "CoreServices\\Sprint 42"
pm_iteration_path: "Sprint 42"  # project inferred from pm_project or env</code></pre>

<h3>pm_area_path (Azure only)</h3>
<p>Azure DevOps area path for new work items. Format: <code>Project\\Area Path</code> or just <code>Area Path</code>.</p>
<pre><code class="language-yaml">pm_area_path: "CoreServices\\Mobile\\iOS"</code></pre>

<p>These overrides are extracted by the webhook server from commit trigger POST data and applied per-platform when creating work items. The <code>workspace_router.py</code> module handles the mapping from workspace fields to platform-specific API parameters.</p>

<h2>Full Example</h2>
<pre><code class="language-yaml">version: "1"

workspaces:
  # Work project — Azure DevOps, override project name
  - name: "core-api"
    path: /Users/dev/work/core-api
    pm_platform: azure
    pm_project: CoreServices
    enabled: true
    ignore_branches: ["dependabot/*", "renovate/*"]
    tags: [work, backend]

  # Personal project — GitHub, assign new issues to sprint milestone
  - name: "my-oss-lib"
    path: /Users/dev/oss/my-lib
    pm_platform: github
    pm_milestone: 3
    enabled: true
    tags: [oss]

  # Monitored but no PM sync
  - name: "scratch"
    path: /Users/dev/scratch
    pm_platform: none
    enabled: true

  # Paused workspace (kept for history)
  - name: "old-project"
    path: /Users/dev/old/project
    pm_platform: azure
    enabled: false</code></pre>

<h2>ignore_branches Field <span style="font-size:.75rem;font-weight:400;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 8px;margin-left:6px;">v1.4-dev</span></h2>
<p>List branch name patterns to exclude from commit monitoring. When the active branch matches, no commit trigger or external action is prepared for that event.</p>
<div class="table-wrap"><table>
<thead><tr><th>Pattern</th><th>Matches</th></tr></thead>
<tbody>
<tr><td><code>main</code></td><td>The branch named exactly <code>main</code></td></tr>
<tr><td><code>release/*</code></td><td>Any branch starting with <code>release/</code></td></tr>
<tr><td><code>dependabot/*</code></td><td>All Dependabot auto-update branches</td></tr>
<tr><td><code>renovate/*</code></td><td>All Renovate auto-update branches</td></tr>
</tbody>
</table></div>
<p>The daemon also tracks and displays the <strong>current branch</strong> for each workspace — visible in the TUI Workspaces tab alongside PM platform and enabled status.</p>

<h2>How Routing Works</h2>
<ol>
<li>Go daemon detects a commit in a workspace path</li>
<li>If the current branch matches an <code>ignore_branches</code> pattern, the event is dropped immediately</li>
<li>The trigger message includes <code>pm_platform</code>, <code>pm_project</code>, <code>pm_milestone</code>, and <code>workspace_name</code></li>
<li>Python bridge reads <code>pm_platform</code> and calls only that platform's sync handler</li>
<li>Azure, GitHub, GitLab, and Jira are all skipped for platform values that don't match</li>
</ol>
<p>When <code>pm_platform</code> is empty or <code>workspaces.yaml</code> is absent, the legacy priority chain runs: Azure → GitLab → GitHub, stopping at the first match.</p>

<h2>TUI Dashboard</h2>
<p>The <strong>Workspaces</strong> tab in <code>devtrack tui</code> shows a live table of all configured workspaces with their PM platform, enabled status, and last-seen commit time.</p>

<h2>Troubleshooting</h2>
<ul>
<li><strong>Single-repo mode despite workspaces.yaml</strong> — confirm the file is at <code>\$PROJECT_ROOT/workspaces.yaml</code> (or <code>WORKSPACES_FILE</code> is set); check for YAML parse errors: <code>python3 -c "import yaml; yaml.safe_load(open('workspaces.yaml'))"</code></li>
<li><strong>Workspace not monitored</strong> — confirm <code>enabled: true</code> and that the path is a valid git repo</li>
<li><strong>Commits routing to wrong platform</strong> — confirm <code>pm_platform</code> matches one of <code>azure | gitlab | github | jira | none</code>; an unknown value falls back to the priority chain</li>
<li><strong>pm_project not applied for GitLab</strong> — must be a numeric string (e.g., <code>"12345"</code>); strings that fail int conversion are silently ignored</li>
</ul>
</div>`,

  OFFLINE_RESILIENCE: `<div class="md-body">
<h1>Offline Resilience</h1>
<p>DevTrack is designed <strong>offline-first</strong>: the daemon runs entirely on your machine and never requires internet connectivity to capture commits, log work, or store history. External integrations (Azure DevOps, GitHub, Jira, Ollama remote, Teams) are optional and degrade gracefully when unreachable.</p>

<h2>What Works Fully Offline</h2>
<div class="table-wrap"><table>
<thead><tr><th>Feature</th><th>Offline behaviour</th></tr></thead>
<tbody>
<tr><td>Git commit monitoring</td><td>Fully offline — uses <code>fsnotify</code> to watch the local repo</td></tr>
<tr><td>Cron / timer triggers</td><td>Fully offline — pure Go scheduler</td></tr>
<tr><td>Queue and correction views (TUI)</td><td>Fully offline — terminal visibility, no network calls</td></tr>
<tr><td>SQLite history &amp; task log</td><td>Fully offline — the configured local <code>devtrack.db</code></td></tr>
<tr><td>Local Ollama LLM</td><td>Fully offline — runs on localhost</td></tr>
<tr><td>Structured task parsing</td><td>Uses local Ollama by default; provider failure degrades without blocking Git activity</td></tr>
<tr><td>Daily report (terminal/HTML)</td><td>Offline-capable with the local Python service, PostgreSQL, and Ollama; outbound delivery remains staged</td></tr>
<tr><td><code>devtrack status</code> / <code>logs</code></td><td>Fully offline</td></tr>
</tbody>
</table></div>

<h2>Graceful Degradation for Online Features</h2>
<div class="table-wrap"><table>
<thead><tr><th>Feature</th><th>When unreachable</th></tr></thead>
<tbody>
<tr><td>OpenAI / Anthropic / Groq LLM</td><td>Provider factory falls back through the chain; falls back to Ollama or skips AI enhancement</td></tr>
<tr><td>Azure DevOps sync</td><td>The pending action remains visible and retryable; Git activity continues normally</td></tr>
<tr><td>GitHub / GitLab sync</td><td>The pending action remains visible and retryable; connector failure does not block Git</td></tr>
<tr><td>Jira integration</td><td>Read and alert paths degrade gracefully; unsupported write routing never gains a direct-send fallback</td></tr>
<tr><td>Teams / Graph API</td><td>Skipped; personalization falls back to profile-only (no RAG examples)</td></tr>
<tr><td>Ticket alerter poller</td><td>Poll cycle fails silently; retries on next interval</td></tr>
<tr><td>Telemetry ping</td><td>Silently discarded after HTTP timeout</td></tr>
</tbody>
</table></div>

<h2>Queue &amp; Retry Behaviour</h2>
<p>Every outbound PM, email, or Git action passes through <code>pending_actions</code> before execution. Connectivity loss never creates a direct-send fallback:</p>
<ul>
<li>Client-owned actions and the offline outbox remain in local SQLite with status, confidence, retry count, and error detail.</li>
<li>Server-owned generated actions remain in PostgreSQL and are executed only after their review or auto-approval window.</li>
<li>Idempotent client-event sync replays opted-in local history after the server becomes reachable.</li>
<li>Failed execution is logged and retried within the configured queue limits; the developer's Git command is never held open.</li>
</ul>

<h2>HTTP Timeouts</h2>
<p>All outbound HTTP calls use the timeouts set in your <code>.env</code>. Short operations (health checks, quick API calls) use <code>HTTP_TIMEOUT_SHORT</code>; standard calls use <code>HTTP_TIMEOUT</code>; LLM and large uploads use <code>HTTP_TIMEOUT_LONG</code>. Tune these for slow or unreliable networks:</p>
<pre><code class="language-bash">HTTP_TIMEOUT_SHORT=5      # seconds — ping / quick status checks
HTTP_TIMEOUT=30           # seconds — standard API calls
HTTP_TIMEOUT_LONG=120     # seconds — LLM requests, report uploads
LLM_REQUEST_TIMEOUT_SECS=60</code></pre>

<h2>Client–Server Resilience</h2>
<p>New client/server messages use authenticated HTTP/JSON. If the managed Python service is unavailable, the Go daemon records local activity and remains usable; <code>devtrack status</code> and <code>devtrack doctor</code> expose the degraded capability and recovery path. Opted-in client-event sync replays its local backlog idempotently after recovery. The legacy TCP IPC listener is retained only for older internal message paths and must not be used for new capabilities.</p>
<pre><code class="language-bash">HTTP_TIMEOUT_SHORT=5      # health and quick status calls
HTTP_TIMEOUT=30           # normal client/server requests
QUEUE_MAX_RETRIES=10      # bounded outbound execution retries
QUEUE_DRAIN_INTERVAL_SECS=10</code></pre>

<h2>Air-Gapped Deployments</h2>
<p>DevTrack can run in a fully air-gapped environment with zero inbound or outbound network access:</p>
<ol>
<li>Set <code>LLM_PROVIDER=ollama</code> and run Ollama locally (<code>OLLAMA_HOST=http://localhost:11434</code>)</li>
<li>Leave all PM credentials empty (<code>AZURE_DEVOPS_TOKEN</code>, <code>GITHUB_TOKEN</code>, etc.) — integrations are skipped when credentials are absent</li>
<li>Leave telemetry disabled (the default). It sends nothing unless you explicitly run <code>devtrack telemetry on</code>.</li>
<li>Leave optional Teams/MongoDB voice sources unconfigured; local Git history, SQLite, and the local learning directory remain the default.</li>
</ol>

<p>For configuration details, see the <a href="#CONFIGURATION" onclick="navigate('CONFIGURATION');return false;">Configuration Reference</a>. For troubleshooting connectivity, see the <a href="#TROUBLESHOOTING" onclick="navigate('TROUBLESHOOTING');return false;">Troubleshooting Guide</a>.</p>
</div>`,

  AUTOSTART: `<div class="md-body">
<h1>Auto-Start</h1>
<p>Automatically start the DevTrack daemon when you log in, using the right mechanism for your operating system.</p>

<div class="home-badge" style="margin-bottom:24px;background:var(--callout-note);border-color:var(--callout-note-border);color:#1d4ed8;">v1.4-dev — Env-baking: all current env vars are now baked into the generated plist/service unit automatically</div>

<h2>Quick Start</h2>
<pre><code class="language-bash">devtrack autostart-install    # Install and enable auto-start (bakes env vars)
devtrack autostart-status     # Verify it is registered
devtrack autostart-uninstall  # Remove auto-start at any time</code></pre>

<p>DevTrack detects your OS and picks the appropriate mechanism automatically:</p>
<div class="table-wrap"><table>
<thead><tr><th>OS</th><th>Mechanism</th><th>Location</th></tr></thead>
<tbody>
<tr><td>macOS</td><td>launchd LaunchAgent</td><td><code>~/Library/LaunchAgents/dev.devtrack.plist</code></td></tr>
<tr><td>Linux with systemd</td><td>systemd user service</td><td><code>~/.config/systemd/user/devtrack.service</code></td></tr>
<tr><td>WSL with systemd</td><td>systemd user service</td><td><code>~/.config/systemd/user/devtrack.service</code></td></tr>
<tr><td>WSL without systemd</td><td>Shell profile block</td><td><code>~/.zshrc</code> or <code>~/.bashrc</code></td></tr>
<tr><td>Windows</td><td>Windows Task Scheduler task</td><td>Task name: <code>DevTrack</code> (runs at logon, highest privileges)</td></tr>
</tbody>
</table></div>

<h2>Env-Baking (v1.4-dev)</h2>
<p>As of v1.4-dev, <code>devtrack autostart-install</code> <strong>bakes all current environment variables</strong> into the generated plist (macOS), systemd unit (Linux), or Task Scheduler task (Windows) at install time. This means the daemon inherits the exact same configuration that was active when you ran <code>autostart-install</code> — no wrapper scripts, no <code>EnvironmentFile=</code> hacks, and no separate <code>.env</code> file needed at runtime.</p>

<blockquote><p><strong>Important:</strong> Re-run <code>devtrack autostart-install</code> after changing any environment variable to refresh the baked configuration in the plist or service unit.</p></blockquote>

<pre><code class="language-bash"># First time (or after changing the registered environment):
devtrack settings             # confirm the resolved configuration
devtrack autostart-install    # refresh the plist/service/task

# Verify
devtrack autostart-status</code></pre>

<h2>macOS — launchd</h2>
<p>DevTrack registers as a <strong>user-level LaunchAgent</strong>, which starts when you log in and runs with your permissions.</p>

<h3>Install</h3>
<pre><code class="language-bash">devtrack autostart-install</code></pre>
<p>This command:</p>
<ol>
<li>Captures all currently exported environment variables</li>
<li>Generates a plist at <code>~/Library/LaunchAgents/dev.devtrack.plist</code> with all env vars inline under <code>EnvironmentVariables</code></li>
<li>Runs <code>launchctl load</code> to register and start the service immediately</li>
</ol>

<h3>Status &amp; Manual Control</h3>
<pre><code class="language-bash">devtrack autostart-status
launchctl list | grep devtrack          # PID column: number = running
launchctl start dev.devtrack            # Start without waiting for next login
launchctl stop  dev.devtrack            # Stop (will restart on next login)
cat ~/Library/LaunchAgents/dev.devtrack.plist  # Inspect baked env vars</code></pre>

<h3>Uninstall</h3>
<pre><code class="language-bash">devtrack autostart-uninstall</code></pre>

<h2>Linux — systemd user service</h2>
<p>DevTrack installs a <strong>systemd user service</strong> (<code>--user</code> scope), which starts at login and runs as your user account.</p>

<h3>Install</h3>
<pre><code class="language-bash">devtrack autostart-install</code></pre>
<p>Generates <code>~/.config/systemd/user/devtrack.service</code> with all env vars inlined as <code>Environment=</code> lines, then runs <code>systemctl --user daemon-reload &amp;&amp; enable &amp;&amp; start</code>.</p>

<h3>Status &amp; Manual Control</h3>
<pre><code class="language-bash">devtrack autostart-status
systemctl --user status devtrack
systemctl --user restart devtrack
journalctl --user -u devtrack -f        # Follow logs</code></pre>

<h3>Uninstall</h3>
<pre><code class="language-bash">devtrack autostart-uninstall</code></pre>

<h2>WSL — Shell Profile Fallback</h2>
<p>When systemd is not available in WSL, DevTrack appends a startup block to <code>~/.zshrc</code> (or <code>~/.bashrc</code>). The block is idempotent — running <code>autostart-install</code> again when the block is already present is a no-op.</p>
<pre><code class="language-bash"># DevTrack auto-start
devtrack start 2&gt;/dev/null || true
# End DevTrack auto-start</code></pre>
<p>After installation, re-source your profile or open a new terminal to start DevTrack in the current session.</p>

<h2>Windows — Task Scheduler</h2>
<p>DevTrack creates a <strong>Task Scheduler task</strong> named <code>DevTrack</code> that runs <code>devtrack start</code> at logon with highest privileges.</p>

<h3>Install</h3>
<pre><code class="language-bash">devtrack autostart-install</code></pre>
<p>Runs <code>schtasks /Create /SC ONLOGON /RL HIGHEST /TN DevTrack</code> — the task starts automatically each time you log in.</p>

<h3>Status &amp; Manual Control</h3>
<pre><code class="language-bash">devtrack autostart-status
schtasks /Query /TN DevTrack /FO LIST    # Detailed task info
schtasks /Run /TN DevTrack               # Start immediately without waiting for logon</code></pre>

<h3>Uninstall</h3>
<pre><code class="language-bash">devtrack autostart-uninstall</code></pre>
<p>Runs <code>schtasks /Delete /TN DevTrack /F</code>. If the task was never registered, the command exits silently.</p>

<h2>Troubleshooting</h2>
<ul>
<li><strong>Daemon did not start after login (macOS)</strong> — run <code>tail -50 Data/logs/launchd.log</code> and <code>plutil ~/Library/LaunchAgents/dev.devtrack.plist</code>. If env vars are missing, re-run <code>autostart-install</code> after sourcing <code>.env</code>.</li>
<li><strong>Daemon did not start after login (Linux)</strong> — run <code>systemctl --user status devtrack</code> and <code>journalctl --user -u devtrack --no-pager | tail -50</code>. Check the <code>Environment=</code> lines in the unit file match your expected values.</li>
<li><strong>Daemon did not start after login (Windows)</strong> — open Task Scheduler, find the <code>DevTrack</code> task, and check the Last Run Result. Run <code>devtrack autostart-status</code> to query from the CLI. If the task is missing, re-run <code>devtrack autostart-install</code>.</li>
<li><strong>Config changes not taking effect</strong> — remember to re-run <code>devtrack autostart-install</code> after changing env vars; the new values are only baked in on reinstall.</li>
<li><strong>"autostart-install already present" warning (WSL no-systemd)</strong> — run <code>devtrack autostart-uninstall</code> first, then reinstall.</li>
</ul>
</div>`,

  GIT_SAGE: `<div class="md-body">
