  LICENSE: `<div class="md-body">
<h1>License</h1>
<p>DevTrack uses a <strong>Community License</strong> — free for individuals and small teams, with a commercial licence required for larger organisations and hosted deployments.</p>

<h2>Tiers at a Glance</h2>
<div class="table-wrap"><table>
<thead><tr><th>Tier</th><th>Cost</th><th>Who it is for</th></tr></thead>
<tbody>
<tr><td><strong>Personal</strong></td><td>Free</td><td>Single developer, personal use</td></tr>
<tr><td><strong>Team</strong></td><td>Free</td><td>Self-hosted, up to 10 users</td></tr>
<tr><td><strong>Enterprise</strong></td><td>Commercial licence required</td><td>11+ users, or any hosted/SaaS deployment</td></tr>
</tbody>
</table></div>

<blockquote><p>All tiers work fully offline. Login is optional for Personal and Team. No licence server call is ever made in local mode.</p></blockquote>

<h2>First-Run T&amp;C Acceptance</h2>
<p>The first time DevTrack starts (or when you run <code>devtrack terms</code>), a summary of the Terms of Service is printed to the terminal and you are asked to accept before the daemon starts. Acceptance is stored in <code>Data/license/acceptance.json</code> — no network call is required.</p>

<h3>CLI Commands</h3>
<div class="table-wrap"><table>
<thead><tr><th>Command</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>devtrack terms</code></td><td>Print the T&amp;C summary and prompt for acceptance</td></tr>
<tr><td><code>devtrack terms --accept</code></td><td>Accept non-interactively (useful for CI/scripts — same as <code>DEVTRACK_AUTO_ACCEPT_TERMS=1</code>)</td></tr>
<tr><td><code>devtrack license</code></td><td>Show the active tier and acceptance status</td></tr>
</tbody>
</table></div>

<h3>Non-Interactive / CI Mode</h3>
<p>Set <code>DEVTRACK_AUTO_ACCEPT_TERMS=1</code> in your environment or pass <code>--accept</code> to <code>devtrack terms</code> to suppress the interactive prompt. A warning is printed to stderr so the auto-acceptance is visible in CI logs.</p>

<h3>Acceptance Record</h3>
<p>The acceptance file is stored at <code>Data/license/acceptance.json</code> (path resolves from <code>DATA_DIR</code> if set):</p>
<pre><code class="language-json">{
  "terms_version": "1.0",
  "accepted_at": "2026-03-31T10:00:00+00:00",
  "user_identifier": "sraj",
  "mode": "local"
}</code></pre>
<p>The daemon checks <code>terms_version</code> on startup. If a new version of the terms is released, you will be prompted again on the next start.</p>

<h2>Enterprise Licensing</h2>
<p>If you are deploying DevTrack for 11 or more users, or running it as a hosted/SaaS service, a commercial enterprise licence is required. Contact <a href="mailto:enterprise@devtrack.dev" target="_blank" rel="noopener">enterprise@devtrack.dev</a> or visit <a href="https://devtrack.dev/enterprise" target="_blank" rel="noopener">devtrack.dev/enterprise</a>.</p>
<p>In a self-hosted deployment, <code>backend/license_manager.py</code> detects the tier from the user count in the Admin Console. Tier enforcement is advisory in local mode — the daemon will warn but not block. In SaaS mode, the tier is enforced server-side.</p>

<h2>Privacy Summary</h2>
<ul>
<li><strong>Offline/local mode</strong>: zero data collection (default).</li>
<li><strong>Telemetry</strong>: strictly opt-in — only when you run <code>devtrack telemetry on</code> explicitly.</li>
<li><strong>Your code, commits, and work updates</strong> never leave your machine unless you enable cloud features.</li>
<li><strong>Login</strong>: optional for Personal and Team tiers. Magic-link login is used only if <code>DEVTRACK_API_URL</code> is set.</li>
</ul>

<p>Full terms: <code>TERMS.md</code> in the DevTrack installation directory, or <a href="https://devtrack.dev/terms" target="_blank" rel="noopener">devtrack.dev/terms</a>.</p>
</div>`,

  AUTH: `<div class="md-body">
<h1>Login &amp; Auth</h1>
<p>DevTrack's authentication system is <strong>optional and offline-first</strong>. The daemon works fully without any login. Login is only needed for cloud features — syncing settings across machines, SaaS team management, or enterprise licence validation.</p>

<h2>Overview</h2>
<div class="table-wrap"><table>
<thead><tr><th>Scenario</th><th>Login needed?</th></tr></thead>
<tbody>
<tr><td>Local single-user (Personal/Team)</td><td>No — works offline without any auth</td></tr>
<tr><td>Cloud-backed settings sync</td><td>Yes — <code>devtrack login</code></td></tr>
<tr><td>Enterprise team management</td><td>Yes — admin login via Admin Console</td></tr>
</tbody>
</table></div>

<h2>CLI Commands</h2>
<div class="table-wrap"><table>
<thead><tr><th>Command</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>devtrack login</code></td><td>Start the magic-link login flow — enter your email, receive a one-time code, confirm it</td></tr>
<tr><td><code>devtrack logout</code></td><td>Clear the local session and token</td></tr>
<tr><td><code>devtrack whoami</code></td><td>Show the currently logged-in email (or "not logged in")</td></tr>
</tbody>
</table></div>

<h2>Magic-Link Flow</h2>
<ol>
<li>Run <code>devtrack login</code> and enter your email address.</li>
<li>The backend (<code>DEVTRACK_API_URL</code>) sends a one-time code to that address.</li>
<li>Enter the code in the terminal — you receive a JWT session token.</li>
<li>The token and session are saved locally in <code>Data/license/session.json</code> (chmod 0600).</li>
</ol>

<p>If <code>DEVTRACK_API_URL</code> is not set, the login command falls back to creating a <strong>local-only session</strong> — no network call is made and no token is issued, but your email is stored as a local identifier (useful for personalisation features).</p>

<h3>Session File</h3>
<p>Sessions are stored at <code>Data/license/session.json</code>:</p>
<pre><code class="language-json">{
  "email": "you@example.com",
  "token": "eyJ...",
  "logged_in_at": "2026-03-31T10:00:00+00:00",
  "expires_at": "2026-04-30T10:00:00+00:00"
}</code></pre>
<p>Sessions expire after 30 days. Run <code>devtrack login</code> again to refresh.</p>

<h2>Local-Only Sessions</h2>
<p>If you want personalisation features (e.g. "Talk Like You") to identify you without cloud connectivity, run <code>devtrack login</code> with no <code>DEVTRACK_API_URL</code> set. The system creates an offline session with your email stored locally — used as the identifier for MongoDB sample storage and the personalization profile.</p>

<h2>Configuration</h2>
<div class="table-wrap"><table>
<thead><tr><th>Variable</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>DEVTRACK_API_URL</code></td><td>Cloud API endpoint for magic-link auth. Omit for local-only sessions.</td></tr>
</tbody>
</table></div>

<h2>Implementation Files</h2>
<div class="table-wrap"><table>
<thead><tr><th>File</th><th>Purpose</th></tr></thead>
<tbody>
<tr><td><code>backend/auth/__init__.py</code></td><td>Package init; exports <code>get_session()</code>, <code>require_login()</code></td></tr>
<tr><td><code>backend/auth/local_auth.py</code></td><td>Read/write <code>Data/license/session.json</code>; no network calls</td></tr>
<tr><td><code>backend/auth/cloud_auth.py</code></td><td>Magic-link flow: <code>request_magic_link()</code>, <code>verify_code()</code>; degrades gracefully offline</td></tr>
<tr><td><code>backend/auth/session.py</code></td><td><code>AuthSession</code> dataclass; <code>make_offline_session()</code>; 30-day TTL</td></tr>
</tbody>
</table></div>

<blockquote><p><strong>Security note:</strong> The session file is written with <code>chmod 0600</code> — readable only by the current user. Tokens are JWTs issued by the DevTrack cloud server; they are verified server-side on each cloud API call. Local-only sessions have no token and no server-side state.</p></blockquote>
</div>`,

  TEST_SUITE: `<div class="md-body">
<h1>Test Suite</h1>
<p>DevTrack ships a comprehensive test suite covering the Go daemon, the Python backend, and the HTTP trigger layer. As of <strong>v2.0.0</strong>, the suite contains <strong>492 tests</strong> (455 Python + 37 Go) spread across Go and Python, with full coverage of HTTP trigger validation, admin authentication, user management, admin routes, license enforcement, Jira alerter polling, and server_tui helper modules.</p>

<h2>Running the Tests</h2>
<h3>Go tests</h3>
<pre><code class="language-bash">cd devtrack-bin
go test ./...        # run all Go tests
go test -run TestHTTPTrigger ./...   # run only HTTP trigger tests</code></pre>

<h3>Python tests</h3>
<pre><code class="language-bash"># Install / sync dependencies first
uv sync

# Run the full Python test suite
uv run pytest backend/tests/

# Run a single test file
uv run pytest backend/tests/test_http_triggers.py
uv run pytest backend/tests/test_admin_auth.py
uv run pytest backend/tests/test_admin_user_manager.py
uv run pytest backend/tests/test_admin_routes.py
uv run pytest backend/tests/test_license_manager.py
uv run pytest backend/tests/test_jira_alerter.py
uv run pytest backend/tests/test_server_tui.py

# Run by name filter
uv run pytest backend/tests/ -k test_name</code></pre>

<h2>Test Files</h2>
<div class="table-wrap"><table>
<thead><tr><th>File</th><th>Layer</th><th>What it covers</th></tr></thead>
<tbody>
<tr><td><code>devtrack-bin/http_trigger_test.go</code></td><td>Go</td><td>HTTP trigger validation — correct payloads accepted, malformed or unauthenticated requests rejected, edge cases for missing fields and invalid JSON</td></tr>
<tr><td><code>backend/tests/test_http_triggers.py</code></td><td>Python</td><td>End-to-end HTTP trigger handling in the FastAPI webhook server — commit and timer trigger routes, auth header validation, payload schema enforcement</td></tr>
<tr><td><code>backend/tests/test_admin_auth.py</code></td><td>Python</td><td>Admin console authentication — login flow, JWT session cookie issuance, expiry, and rejection of bad credentials</td></tr>
<tr><td><code>backend/tests/test_admin_user_manager.py</code></td><td>Python</td><td>User lifecycle via the Admin Console — create, delete, list, and API key rotation; enforces that duplicate usernames are rejected</td></tr>
<tr><td><code>backend/tests/test_license_manager.py</code></td><td>Python</td><td>License tier detection, T&amp;C acceptance recording and re-prompt logic, offline vs SaaS mode enforcement, <code>DEVTRACK_AUTO_ACCEPT_TERMS</code> flag behaviour</td></tr>
<tr><td><code>backend/tests/test_jira_alerter.py</code></td><td>Python</td><td>26 tests for <code>JiraAlerter</code> — assigned polling, comment detection, status-change events, deduplication, and all edge cases. No real network calls — all <code>JiraClient</code> methods are mocked.</td></tr>
<tr><td><code>backend/tests/test_server_tui.py</code></td><td>Python</td><td>37 headless tests for server_tui helpers — <code>ProcessMonitor</code> (process discovery, CPU/MEM sampling, start/stop), <code>log_viewer</code> (tail, rotation, missing file), <code>stats_client</code> (SQLite reads, graceful degradation when DB absent), <code>health_client</code> (HTTP health probes, timeout handling). All fixtures use POSIX <code>tmp_path</code>; no macOS-specific dependencies — runs on Linux CI.</td></tr>
<tr><td><code>backend/tests/test_admin_routes.py</code></td><td>Python</td><td>31 HTTP-level tests for admin console routes — user role update, soft disable/enable, password reset, license status page, trigger stats HTMX panel (<code>GET /admin/stats-panel</code>), and auth guards on all new endpoints. Uses <code>TestClient</code>-wrapped FastAPI app; no route handler mocking.</td></tr>
</tbody>
</table></div>

<h2>Test Infrastructure</h2>

<h3>conftest.py — session fixture</h3>
<p>The shared <code>backend/tests/conftest.py</code> adds the repo root to <code>sys.path</code> and provides a <strong>session-scoped fixture</strong> that blocks any attempt to load a <code>.env</code> that is a named pipe (FIFO). This prevents the Go daemon's FIFO <code>.env</code> bug from silently hanging the test process during collection.</p>
<pre><code class="language-python"># conftest.py (excerpt)
@pytest.fixture(scope="session", autouse=True)
def block_fifo_env(tmp_path_factory):
    """Ensure .env is never a FIFO during the test run — prevents daemon-startup hangs."""
    env_path = Path(".env")
    if env_path.exists() and stat.S_ISFIFO(env_path.stat().st_mode):
        raise RuntimeError(
            ".env is a named pipe (FIFO). Replace it with a regular file before running tests."
        )
    yield</code></pre>

<h3>LLM provider isolation</h3>
<p>Tests that change <code>LLM_PROVIDER</code> must call <code>reset_provider_cache()</code> in their setup and teardown to prevent provider state leaking between test cases:</p>
<pre><code class="language-python">from backend.llm.provider_factory import reset_provider_cache

def setup_function():
    reset_provider_cache()

def teardown_function():
    reset_provider_cache()</code></pre>

<h2>Known Bugs Fixed by These Tests</h2>
<div class="table-wrap"><table>
<thead><tr><th>Bug</th><th>Symptom</th><th>Fix verified by</th></tr></thead>
<tbody>
<tr><td><strong>.env FIFO bug</strong></td><td>Daemon startup hangs indefinitely when <code>.env</code> is a named pipe (e.g. created by <code>mkfifo</code> or a broken shell redirect)</td><td><code>conftest.py</code> session fixture; <code>test_http_triggers.py</code> startup assertions</td></tr>
<tr><td><strong>RuntimeNarrativeMiddleware unknown kwarg</strong></td><td><code>TypeError: __init__() got an unexpected keyword argument 'failure_diagnostics'</code> on FastAPI startup</td><td><code>test_http_triggers.py</code> — server startup smoke test runs as part of the fixture setup and would surface this error</td></tr>
</tbody>
</table></div>

<h2>Platform Notes</h2>
<p>The test suite is <strong>Linux-first</strong>. All new tests added from v1.5-dev onward follow these conventions:</p>
<ul>
<li>Fixtures use POSIX <code>tmp_path</code> — no platform-specific temp directories</li>
<li>Process cmdlines use generic names (e.g. <code>python server.py</code>) — no macOS <code>launchd</code> or Windows service references</li>
<li>Tests pass on Ubuntu/Debian CI without modification; macOS is secondary; Windows/WSL is not a CI target</li>
</ul>
<p>If you add new server_tui or system-level tests, follow the same conventions so they run on the primary CI platform.</p>

<h2>Troubleshooting</h2>
<ul>
<li><strong>Tests hang at collection</strong> — likely caused by the <code>.env</code> FIFO bug. Run <code>file .env</code>; if it shows <em>fifo (named pipe)</em>, delete and recreate: <code>rm .env &amp;&amp; cp .env_sample .env</code>.</li>
<li><strong>"provider not found" errors</strong> — call <code>reset_provider_cache()</code> in test setup/teardown when changing <code>LLM_PROVIDER</code>.</li>
<li><strong>Admin auth tests fail with 500</strong> — confirm <code>ADMIN_SECRET_KEY</code> is set in the test environment (can be any non-empty string for tests).</li>
<li><strong>License manager tests fail offline</strong> — expected: tests that require <code>DEVTRACK_API_URL</code> are skipped automatically when the variable is absent. Set <code>DEVTRACK_AUTO_ACCEPT_TERMS=1</code> to prevent interactive prompts during CI runs.</li>
<li><strong>server_tui tests fail on macOS with "process not found"</strong> — the server_tui test fixtures use generic POSIX process names. If you see platform-specific failures, check that your test environment is not injecting macOS service names into the process mock.</li>
</ul>
</div>`,

  MULTI_REPO: `<div class="md-body">
<h1>Multi-Repo Monitoring</h1>
<p>By default DevTrack monitors a single repository (<code>DEVTRACK_WORKSPACE</code>). <strong>Multi-repo mode</strong> lets you monitor any number of repositories simultaneously, each routing to its own project management platform.</p>

<h2>Setup</h2>
<pre><code class="language-bash"># Create workspaces.yaml at PROJECT_ROOT (or copy the sample)
cp workspaces.yaml.sample workspaces.yaml
nano workspaces.yaml

# Restart the daemon to pick up changes
devtrack restart

# Verify multi-repo mode is active
devtrack status   # shows workspace_count: N</code></pre>

<p>The daemon also hot-reloads on save — edit <code>workspaces.yaml</code> and DevTrack surgically restarts only the monitors that changed, without interrupting others.</p>

<h2>workspaces.yaml Schema</h2>
<pre><code class="language-yaml">version: "1"
workspaces:
  - name: "work-api"            # display name (required)
    path: ~/work/api            # absolute or ~/ path to git repo (required)
    pm_platform: azure          # routing target (required — see table below)
    pm_project: ""              # optional: platform-specific project override
    pm_milestone: 0             # optional: milestone number/ID for new issues
    enabled: true               # false = pause without removing
    ignore_branches:            # branches to skip (e.g. dependabot/*)
      - "dependabot/*"
    tags: [work]                # arbitrary labels for your own use</code></pre>

<h2>pm_platform Values</h2>
<div class="table-wrap"><table>
<thead><tr><th>Value</th><th>Routes to</th><th>Notes</th></tr></thead>
<tbody>
<tr><td><code>azure</code></td><td>Azure DevOps</td><td>Uses <code>AZURE_ORGANIZATION</code> / <code>AZURE_PROJECT</code> from <code>.env</code></td></tr>
<tr><td><code>gitlab</code></td><td>GitLab</td><td>Uses <code>GITLAB_PROJECT_ID</code> from <code>.env</code> unless <code>pm_project</code> is set</td></tr>
<tr><td><code>github</code></td><td>GitHub</td><td>Uses <code>GITHUB_OWNER</code> / <code>GITHUB_REPO</code> from <code>.env</code></td></tr>
<tr><td><code>jira</code></td><td>Jira</td><td>Uses <code>JIRA_URL</code>, <code>JIRA_EMAIL</code>, <code>JIRA_API_TOKEN</code></td></tr>
<tr><td><code>none</code></td><td>—</td><td>Monitoring active; PM sync disabled for this repo</td></tr>
<tr><td>(empty)</td><td>Priority chain</td><td>Falls back to Azure → GitLab → GitHub (single-repo behavior)</td></tr>
</tbody>
</table></div>

<h2>pm_project Field</h2>
<div class="table-wrap"><table>
<thead><tr><th>Platform</th><th>Meaning</th></tr></thead>
<tbody>
<tr><td><code>azure</code></td><td>Project name (overrides <code>AZURE_PROJECT</code>)</td></tr>
<tr><td><code>gitlab</code></td><td>Numeric project ID (overrides <code>GITLAB_PROJECT_ID</code>)</td></tr>
<tr><td><code>github</code></td><td>Ignored — owner/repo comes from <code>.env</code></td></tr>
</tbody>
</table></div>

<h2>pm_milestone Field</h2>
<p>Assigns newly created issues to a milestone. Leave at <code>0</code> or omit to create issues without a milestone.</p>
<div class="table-wrap"><table>
<thead><tr><th>Platform</th><th>Meaning</th></tr></thead>
<tbody>
<tr><td><code>github</code></td><td>GitHub milestone number (integer from milestone URL: <code>.../milestones/N</code>)</td></tr>
<tr><td><code>gitlab</code></td><td>GitLab milestone ID (integer from <code>GET /projects/:id/milestones</code>)</td></tr>
<tr><td><code>azure</code></td><td>Ignored</td></tr>
</tbody>
</table></div>

<h2>PM Override Fields <span style="font-size:.75rem;font-weight:400;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 8px;margin-left:6px;">v1.4-dev</span></h2>
<p>Per-workspace overrides for PM assignee, area path, iteration path, and milestone. These values are extracted from commit triggers and forwarded to the platform API when creating work items or issues.</p>

<h3>pm_assignee</h3>
<div class="table-wrap"><table>
<thead><tr><th>Platform</th><th>Format</th><th>API Field</th></tr></thead>
<tbody>
<tr><td><code>azure</code></td><td>Email or display name</td><td><code>assigned_to</code></td></tr>
<tr><td><code>github</code></td><td>Username (e.g., <code>sraj</code>)</td><td><code>assignees[]</code></td></tr>
<tr><td><code>gitlab</code></td><td>Numeric user ID</td><td><code>assignee_ids[]</code></td></tr>
</tbody>
</table></div>

<h3>pm_iteration_path (Azure only)</h3>
<p>Azure DevOps iteration path for new work items. Format: <code>Project\\Iteration Path</code> or just <code>Iteration Path</code> (project is prepended automatically).</p>
<pre><code class="language-yaml">pm_iteration_path: "CoreServices\\Sprint 42"
pm_iteration_path: "Sprint 42"  # project inferred from pm_project or env</code></pre>

<h3>pm_area_path (Azure only)</h3>
<p>Azure DevOps area path for new work items. Format: <code>Project\\Area Path</code> or just <code>Area Path</code>.</p>
<pre><code class="language-yaml">pm_area_path: "CoreServices\\Mobile\\iOS"</code></pre>

<p>These overrides are extracted by the webhook server from commit trigger POST data and applied per-platform when creating work items. The <code>workspace_router.py</code> module handles the mapping from workspace fields to platform-specific API parameters.</p>

<h2>Full Example</h2>
<pre><code class="language-yaml">version: "1"

workspaces:
  # Work project — Azure DevOps, override project name
  - name: "core-api"
    path: /Users/dev/work/core-api
    pm_platform: azure
    pm_project: CoreServices
    enabled: true
    ignore_branches: ["dependabot/*", "renovate/*"]
    tags: [work, backend]

  # Personal project — GitHub, assign new issues to sprint milestone
  - name: "my-oss-lib"
    path: /Users/dev/oss/my-lib
    pm_platform: github
    pm_milestone: 3
    enabled: true
    tags: [oss]

  # Monitored but no PM sync
  - name: "scratch"
    path: /Users/dev/scratch
    pm_platform: none
    enabled: true

  # Paused workspace (kept for history)
  - name: "old-project"
    path: /Users/dev/old/project
    pm_platform: azure
    enabled: false</code></pre>

<h2>ignore_branches Field <span style="font-size:.75rem;font-weight:400;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 8px;margin-left:6px;">v1.4-dev</span></h2>
<p>List branch name patterns to exclude from commit monitoring. When the active branch of a workspace matches any entry, the commit event is silently discarded — no work-update prompt, no trigger, no log entry.</p>
<div class="table-wrap"><table>
<thead><tr><th>Pattern</th><th>Matches</th></tr></thead>
<tbody>
<tr><td><code>main</code></td><td>The branch named exactly <code>main</code></td></tr>
<tr><td><code>release/*</code></td><td>Any branch starting with <code>release/</code></td></tr>
<tr><td><code>dependabot/*</code></td><td>All Dependabot auto-update branches</td></tr>
<tr><td><code>renovate/*</code></td><td>All Renovate auto-update branches</td></tr>
</tbody>
</table></div>
<p>The daemon also tracks and displays the <strong>current branch</strong> for each workspace — visible in the TUI Workspaces tab alongside PM platform and enabled status.</p>

<h2>How Routing Works</h2>
<ol>
<li>Go daemon detects a commit in a workspace path</li>
<li>If the current branch matches an <code>ignore_branches</code> pattern, the event is dropped immediately</li>
<li>The trigger message includes <code>pm_platform</code>, <code>pm_project</code>, <code>pm_milestone</code>, and <code>workspace_name</code></li>
<li>Python bridge reads <code>pm_platform</code> and calls only that platform's sync handler</li>
<li>Azure, GitHub, GitLab, and Jira are all skipped for platform values that don't match</li>
</ol>
<p>When <code>pm_platform</code> is empty or <code>workspaces.yaml</code> is absent, the legacy priority chain runs: Azure → GitLab → GitHub, stopping at the first match.</p>

<h2>TUI Dashboard</h2>
<p>The <strong>Workspaces</strong> tab in <code>devtrack tui</code> shows a live table of all configured workspaces with their PM platform, enabled status, and last-seen commit time.</p>

<h2>Troubleshooting</h2>
<ul>
<li><strong>Single-repo mode despite workspaces.yaml</strong> — confirm the file is at <code>\$PROJECT_ROOT/workspaces.yaml</code> (or <code>WORKSPACES_FILE</code> is set); check for YAML parse errors: <code>python3 -c "import yaml; yaml.safe_load(open('workspaces.yaml'))"</code></li>
<li><strong>Workspace not monitored</strong> — confirm <code>enabled: true</code> and that the path is a valid git repo</li>
<li><strong>Commits routing to wrong platform</strong> — confirm <code>pm_platform</code> matches one of <code>azure | gitlab | github | jira | none</code>; an unknown value falls back to the priority chain</li>
<li><strong>pm_project not applied for GitLab</strong> — must be a numeric string (e.g., <code>"12345"</code>); strings that fail int conversion are silently ignored</li>
</ul>
</div>`,

  OFFLINE_RESILIENCE: `<div class="md-body">
<h1>Offline Resilience</h1>
<p>DevTrack is designed <strong>offline-first</strong>: the daemon runs entirely on your machine and never requires internet connectivity to capture commits, log work, or store history. External integrations (Azure DevOps, GitHub, Jira, Ollama remote, Teams) are optional and degrade gracefully when unreachable.</p>

<h2>What Works Fully Offline</h2>
<div class="table-wrap"><table>
<thead><tr><th>Feature</th><th>Offline behaviour</th></tr></thead>
<tbody>
<tr><td>Git commit monitoring</td><td>Fully offline — uses <code>fsnotify</code> to watch the local repo</td></tr>
<tr><td>Cron / timer triggers</td><td>Fully offline — pure Go scheduler</td></tr>
<tr><td>Work-update prompt (TUI)</td><td>Fully offline — terminal UI, no network calls</td></tr>
<tr><td>SQLite history &amp; task log</td><td>Fully offline — local <code>Data/db/devtrack.db</code></td></tr>
<tr><td>Local Ollama LLM</td><td>Fully offline — runs on localhost</td></tr>
<tr><td>NLP parsing (spaCy)</td><td>Fully offline — local model</td></tr>
<tr><td>Daily report (terminal/HTML)</td><td>Fully offline — reads from SQLite</td></tr>
<tr><td><code>devtrack status</code> / <code>logs</code></td><td>Fully offline</td></tr>
</tbody>
</table></div>

<h2>Graceful Degradation for Online Features</h2>
<div class="table-wrap"><table>
<thead><tr><th>Feature</th><th>When unreachable</th></tr></thead>
<tbody>
<tr><td>OpenAI / Anthropic / Groq LLM</td><td>Provider factory falls back through the chain; falls back to Ollama or skips AI enhancement</td></tr>
<tr><td>Azure DevOps sync</td><td>Task update skipped; logged as a warning — no crash, no data loss</td></tr>
<tr><td>GitHub sync</td><td>Same — skipped with warning</td></tr>
<tr><td>Jira sync</td><td>Same — skipped with warning</td></tr>
<tr><td>Teams / Graph API</td><td>Skipped; personalization falls back to profile-only (no RAG examples)</td></tr>
<tr><td>Ticket alerter poller</td><td>Poll cycle fails silently; retries on next interval</td></tr>
<tr><td>Telemetry ping</td><td>Silently discarded after HTTP timeout</td></tr>
</tbody>
</table></div>

<h2>Queue &amp; Retry Behaviour</h2>
<p>DevTrack does <strong>not</strong> queue failed PM updates for later retry — the design principle is that a missed update is less harmful than a complex retry queue that could cause duplicate or out-of-order writes. Instead:</p>
<ul>
<li>Each trigger attempt is logged in SQLite with its outcome (<code>success</code> / <code>failed</code> / <code>skipped</code>)</li>
<li>You can re-trigger manually at any time with <code>devtrack force-trigger</code></li>
<li>The next scheduled timer trigger will resume normal operation automatically once connectivity is restored</li>
</ul>

<h2>HTTP Timeouts</h2>
<p>All outbound HTTP calls use the timeouts set in your <code>.env</code>. Short operations (health checks, quick API calls) use <code>HTTP_TIMEOUT_SHORT</code>; standard calls use <code>HTTP_TIMEOUT</code>; LLM and large uploads use <code>HTTP_TIMEOUT_LONG</code>. Tune these for slow or unreliable networks:</p>
<pre><code class="language-bash">HTTP_TIMEOUT_SHORT=5      # seconds — ping / quick status checks
HTTP_TIMEOUT=30           # seconds — standard API calls
HTTP_TIMEOUT_LONG=120     # seconds — LLM requests, report uploads
LLM_REQUEST_TIMEOUT_SECS=60</code></pre>

<h2>IPC Resilience</h2>
<p>The TCP IPC channel (<code>127.0.0.1:35893</code>) between Go and Python is local and does not use the network stack for packet routing. If the Python webhook server crashes, the Go daemon detects it via the subprocess exit code and logs a warning. Triggers that arrive while the Python server is restarting are discarded (not queued). The daemon itself stays running.</p>
<pre><code class="language-bash">IPC_CONNECT_TIMEOUT_SECS=5   # how long Go waits to connect to Python IPC
IPC_RETRY_DELAY_MS=2000      # delay between IPC reconnect attempts</code></pre>

<h2>Air-Gapped Deployments</h2>
<p>DevTrack can run in a fully air-gapped environment with zero inbound or outbound network access:</p>
<ol>
<li>Set <code>LLM_PROVIDER=ollama</code> and run Ollama locally (<code>OLLAMA_HOST=http://localhost:11434</code>)</li>
<li>Leave all PM credentials empty (<code>AZURE_DEVOPS_TOKEN</code>, <code>GITHUB_TOKEN</code>, etc.) — integrations are skipped when credentials are absent</li>
<li>Set <code>TELEMETRY_ENABLED=false</code> to suppress the anonymous telemetry ping</li>
<li>Leave <code>MONGODB_URI</code> unset — personalization falls back to file-based profiles in <code>Data/learning/</code></li>
</ol>

<p>For configuration details, see the <a href="#CONFIGURATION" onclick="navigate('CONFIGURATION');return false;">Configuration Reference</a>. For troubleshooting connectivity, see the <a href="#TROUBLESHOOTING" onclick="navigate('TROUBLESHOOTING');return false;">Troubleshooting Guide</a>.</p>
</div>`,

  AUTOSTART: `<div class="md-body">
<h1>Auto-Start</h1>
<p>Automatically start the DevTrack daemon when you log in, using the right mechanism for your operating system.</p>

<div class="home-badge" style="margin-bottom:24px;background:var(--callout-note);border-color:var(--callout-note-border);color:#1d4ed8;">v1.4-dev — Env-baking: all current env vars are now baked into the generated plist/service unit automatically</div>

<h2>Quick Start</h2>
<pre><code class="language-bash">devtrack autostart-install    # Install and enable auto-start (bakes env vars)
devtrack autostart-status     # Verify it is registered
devtrack autostart-uninstall  # Remove auto-start at any time</code></pre>

<p>DevTrack detects your OS and picks the appropriate mechanism automatically:</p>
<div class="table-wrap"><table>
<thead><tr><th>OS</th><th>Mechanism</th><th>Location</th></tr></thead>
<tbody>
<tr><td>macOS</td><td>launchd LaunchAgent</td><td><code>~/Library/LaunchAgents/dev.devtrack.plist</code></td></tr>
<tr><td>Linux with systemd</td><td>systemd user service</td><td><code>~/.config/systemd/user/devtrack.service</code></td></tr>
<tr><td>WSL with systemd</td><td>systemd user service</td><td><code>~/.config/systemd/user/devtrack.service</code></td></tr>
<tr><td>WSL without systemd</td><td>Shell profile block</td><td><code>~/.zshrc</code> or <code>~/.bashrc</code></td></tr>
</tbody>
</table></div>

<h2>Env-Baking (v1.4-dev)</h2>
<p>As of v1.4-dev, <code>devtrack autostart-install</code> <strong>bakes all current environment variables</strong> into the generated plist (macOS) or systemd unit (Linux) at install time. This means the daemon inherits the exact same configuration that was active when you ran <code>autostart-install</code> — no wrapper scripts, no <code>EnvironmentFile=</code> hacks, and no separate <code>.env</code> file needed at runtime.</p>

<blockquote><p><strong>Important:</strong> Re-run <code>devtrack autostart-install</code> after changing any environment variable to refresh the baked configuration in the plist or service unit.</p></blockquote>

<pre><code class="language-bash"># First time (or after changing env vars):
set -a; source .env; set +a   # export all vars into the shell
devtrack autostart-install    # bakes them into the plist/service unit

# Verify
devtrack autostart-status</code></pre>

<h2>macOS — launchd</h2>
<p>DevTrack registers as a <strong>user-level LaunchAgent</strong>, which starts when you log in and runs with your permissions.</p>

<h3>Install</h3>
<pre><code class="language-bash">devtrack autostart-install</code></pre>
<p>This command:</p>
<ol>
<li>Captures all currently exported environment variables</li>
<li>Generates a plist at <code>~/Library/LaunchAgents/dev.devtrack.plist</code> with all env vars inline under <code>EnvironmentVariables</code></li>
<li>Runs <code>launchctl load</code> to register and start the service immediately</li>
</ol>

<h3>Status &amp; Manual Control</h3>
<pre><code class="language-bash">devtrack autostart-status
launchctl list | grep devtrack          # PID column: number = running
launchctl start dev.devtrack            # Start without waiting for next login
launchctl stop  dev.devtrack            # Stop (will restart on next login)
cat ~/Library/LaunchAgents/dev.devtrack.plist  # Inspect baked env vars</code></pre>

<h3>Uninstall</h3>
<pre><code class="language-bash">devtrack autostart-uninstall</code></pre>

<h2>Linux — systemd user service</h2>
<p>DevTrack installs a <strong>systemd user service</strong> (<code>--user</code> scope), which starts at login and runs as your user account.</p>

<h3>Install</h3>
<pre><code class="language-bash">devtrack autostart-install</code></pre>
<p>Generates <code>~/.config/systemd/user/devtrack.service</code> with all env vars inlined as <code>Environment=</code> lines, then runs <code>systemctl --user daemon-reload &amp;&amp; enable &amp;&amp; start</code>.</p>

<h3>Status &amp; Manual Control</h3>
<pre><code class="language-bash">devtrack autostart-status
systemctl --user status devtrack
systemctl --user restart devtrack
journalctl --user -u devtrack -f        # Follow logs</code></pre>

<h3>Uninstall</h3>
<pre><code class="language-bash">devtrack autostart-uninstall</code></pre>

<h2>WSL — Shell Profile Fallback</h2>
<p>When systemd is not available in WSL, DevTrack appends a startup block to <code>~/.zshrc</code> (or <code>~/.bashrc</code>). The block is idempotent — running <code>autostart-install</code> again when the block is already present is a no-op.</p>
<pre><code class="language-bash"># DevTrack auto-start
devtrack start 2&gt;/dev/null || true
# End DevTrack auto-start</code></pre>
<p>After installation, re-source your profile or open a new terminal to start DevTrack in the current session.</p>

<h2>Troubleshooting</h2>
<ul>
<li><strong>Daemon did not start after login (macOS)</strong> — run <code>tail -50 Data/logs/launchd.log</code> and <code>plutil ~/Library/LaunchAgents/dev.devtrack.plist</code>. If env vars are missing, re-run <code>autostart-install</code> after sourcing <code>.env</code>.</li>
<li><strong>Daemon did not start after login (Linux)</strong> — run <code>systemctl --user status devtrack</code> and <code>journalctl --user -u devtrack --no-pager | tail -50</code>. Check the <code>Environment=</code> lines in the unit file match your expected values.</li>
<li><strong>Config changes not taking effect</strong> — remember to re-run <code>devtrack autostart-install</code> after changing env vars; the new values are only baked in on reinstall.</li>
<li><strong>"autostart-install already present" warning (WSL no-systemd)</strong> — run <code>devtrack autostart-uninstall</code> first, then reinstall.</li>
</ul>
</div>`,

  GIT_SAGE: `<div class="md-body">
<h1>git-sage Agent</h1>
<p><strong>git-sage</strong> is an autonomous, locally-running LLM agent for complex git operations. It understands your repository state, plans a sequence of git commands, executes them, reads the output, handles failures with rollback, and only asks for input when there is genuine ambiguity.</p>

<h2>Modes</h2>
<ul>
<li><strong>ask</strong> — natural-language question about the repo (<code>git-sage ask "what changed in the last 3 commits?"</code>)</li>
<li><strong>do</strong> — agentic: plan → execute → verify (<code>git-sage do "squash the last 4 commits"</code>)</li>
<li><strong>interactive</strong> — REPL session with full context retained between turns</li>
</ul>

<h2>Quick Start</h2>
<pre><code class="language-bash"># Ask a question
devtrack git-sage ask "which files changed most in the last week?"

# Perform an operation (shows approval dialog first)
devtrack git-sage do "rebase feature/auth onto main"

# Interactive session
devtrack git-sage
</code></pre>

<h2>Configuration</h2>
<table><thead><tr><th>Variable</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>GIT_SAGE_PROVIDER</code></td><td>LLM provider: <code>ollama</code>, <code>openai</code>, <code>groq</code> (defaults to <code>LLM_PROVIDER</code>)</td></tr>
<tr><td><code>GIT_SAGE_DEFAULT_MODEL</code></td><td>Model name (e.g. <code>llama3</code>, <code>compound-beta</code>)</td></tr>
<tr><td><code>GROQ_API_KEY</code></td><td>API key when using Groq provider</td></tr>
</tbody></table>

<h2>Session UX</h2>
<ul>
<li><strong>do</strong> mode shows an approval dialog (auto / review / suggest-only) before the first command</li>
<li>After the task completes, up to 5 follow-up questions can be asked in the same context</li>
<li>Command history and <code>undo [N]</code> are available at any point</li>
<li>Agent always uses <code>git reset --soft HEAD~N</code> for squash — never interactive rebase</li>
</ul>

<h2>Troubleshooting</h2>
<ul>
<li><strong>Agent does nothing then says Done</strong> — LLM returning prose instead of JSON. Switch to <code>llama-3.3-70b-versatile</code> on Groq for reliable JSON compliance.</li>
<li><strong>Groq 403</strong> — ensure <code>openai</code> SDK is installed: <code>uv add openai</code></li>
<li><strong>Infinite loop</strong> — lower <code>max_steps</code>; use <code>--verbose</code> to trace agent decisions</li>
</ul>
</div>`,

  AZURE_DEVOPS: `<div class="md-body">
<h1>Azure DevOps Integration</h1>
<p>DevTrack syncs work items, auto-comments on commits, and transitions item states in Azure DevOps. All updates are bidirectional — commits push to Azure, and the ticket alerter pulls assignments and comments back.</p>

<h2>Setup</h2>
<pre><code class="language-bash"># In .env
AZURE_DEVOPS_PAT=your-personal-access-token
AZURE_ORGANIZATION=your-org
AZURE_PROJECT=your-project
AZURE_SYNC_ENABLED=true
PM_PLATFORM=azure
</code></pre>

<h2>Getting a PAT</h2>
<ol>
<li>Go to <code>https://dev.azure.com/{org}/_usersSettings/tokens</code></li>
<li>Create a new token with <strong>Work Items (Read &amp; Write)</strong> and <strong>Code (Read)</strong> scopes</li>
<li>Paste the token into <code>AZURE_DEVOPS_PAT</code> in your <code>.env</code></li>
</ol>

<h2>What Gets Synced</h2>
<ul>
<li>Commit messages referencing ticket IDs (e.g. <code>AB#1234</code>) automatically update the linked work item</li>
<li>Work item state transitions on commit (e.g. Active → Resolved)</li>
<li>Comments posted to work items from AI-enhanced commit descriptions</li>
<li>Ticket alerter notifies on assignment, comment, and state-change events</li>
</ul>

<h2>Alerter Events</h2>
<ul>
<li>Work item assigned to you</li>
<li>New comment on a work item you are involved in</li>
<li>State changed on your work items</li>
</ul>
<p>Configure with <code>ALERT_AZURE_ENABLED=true</code> and <code>ALERT_NOTIFY_ASSIGNED</code> / <code>ALERT_NOTIFY_COMMENTS</code> / <code>ALERT_NOTIFY_STATUS_CHANGES</code>.</p>
</div>`,

  GITLAB: `<div class="md-body">
<h1>GitLab Integration</h1>
<p>DevTrack provides full GitLab support: inbound webhooks for push/MR/comment events, issue enrichment on create, CLI parity with Azure and GitHub, and Telegram <code>/gitlab</code> commands.</p>

<h2>Setup</h2>
<pre><code class="language-bash"># In .env
GITLAB_PAT=your-personal-access-token
GITLAB_URL=https://gitlab.com          # or your self-hosted URL
GITLAB_PROJECT_ID=12345
GITLAB_SYNC_ENABLED=true
PM_PLATFORM=gitlab
</code></pre>

<h2>Inbound Webhooks</h2>
<p>DevTrack can register itself as a GitLab webhook receiver. Set your public URL and the project IDs to watch:</p>
<pre><code class="language-bash">DEVTRACK_WEBHOOK_PUBLIC_URL=https://your-server.example.com
GITLAB_PROJECT_IDS=12345,67890          # comma-separated
WEBHOOK_GITLAB_SECRET=a-random-secret
</code></pre>
<p>Then run <code>devtrack setup</code> — it will register the webhook with GitLab automatically.</p>

<h2>Per-Repo Override</h2>
<p>In <code>workspaces.yaml</code>, set <code>pm_project: "12345"</code> (numeric string) to override <code>GITLAB_PROJECT_ID</code> for a specific workspace.</p>

<h2>Troubleshooting</h2>
<ul>
<li><strong>pm_project not applied</strong> — value must be a numeric string; non-numeric values are silently ignored</li>
<li><strong>Webhook not firing</strong> — verify <code>DEVTRACK_WEBHOOK_PUBLIC_URL</code> is reachable from GitLab's servers</li>
</ul>
</div>`,

  GITHUB: `<div class="md-body">
<h1>GitHub Integration</h1>
<p>DevTrack provides full GitHub parity: bidirectional sync, inbound webhooks, Telegram commands, and per-workspace milestone assignment via <code>pm_milestone</code> in <code>workspaces.yaml</code>.</p>

<h2>Setup</h2>
<pre><code class="language-bash"># In .env
GITHUB_TOKEN=your-github-personal-access-token
GITHUB_OWNER=your-username-or-org
GITHUB_REPO=your-repo
GITHUB_SYNC_ENABLED=true
PM_PLATFORM=github
</code></pre>

<h2>Getting a Token</h2>
<ol>
<li>Go to <code>https://github.com/settings/tokens</code></li>
<li>Generate a classic token with <strong>repo</strong> scope (or a fine-grained token scoped to the specific repo)</li>
<li>Paste into <code>GITHUB_TOKEN</code> in your <code>.env</code></li>
</ol>

<h2>What Gets Synced</h2>
<ul>
<li>Commit references to issues (<code>#42</code>) auto-comment on the linked issue</li>
<li>PR analysis via git-sage <code>pr_finder</code> — extracts metadata, diff stats, branch info</li>
<li>Ticket alerter notifies on: issue/PR assigned, review requested, comment on involved issue</li>

    icon.innerHTML = '<path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>';

  }
}

// ── Build Navigation ──────────────────────────────────────────────────────────
function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV.map(group => `
    <div class="nav-group">
      <div class="nav-group-label">${group.group}</div>
      ${group.items.map(item => `
        <a class="nav-item" data-id="${item.id}" href="#${item.id}" onclick="navigate('${item.id}');return false;">
          ${item.icon}
          ${item.label}
        </a>
      `).join('')}
    </div>
  `).join('');
}

// ── Setup Listeners ───────────────────────────────────────────────────────────
function setupListeners() {
  document.getElementById('themeToggle').onclick = () => setTheme(theme === 'light' ? 'dark' : 'light');
  document.getElementById('sidebarToggle').onclick = toggleSidebar;
  document.getElementById('searchInput').addEventListener('input', handleSearch);
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Escape') { clearSearch(); }
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.sidebar-search')) clearSearch();
  });
  window.addEventListener('hashchange', () => {
    const hash = location.hash.slice(1);
    if (!hash) return;
    // Only navigate to a new doc if this hash is a known doc/content ID.
    // In-page heading anchors (e.g. #local-installation-recommended) are not
    // doc IDs — ignore them so they don't trigger a failed loadMarkdown call.
    const isDocId = hash === 'home' || CONTENT[hash] ||
      NAV.some(g => g.items.some(item => item.id === hash));
    if (isDocId && hash !== currentPage) navigate(hash, false);
  });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      document.getElementById('searchInput').focus();
    }
  });
}

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  const sb = document.getElementById('sidebar');
  if (window.innerWidth <= 768) {
    sb.classList.toggle('open', sidebarOpen);
    sb.classList.remove('collapsed');
  } else {
    sb.classList.toggle('collapsed', !sidebarOpen);
  }
}

// ── Navigate ──────────────────────────────────────────────────────────────────
function navigate(id, pushHistory = true) {
  currentPage = id;
  if (pushHistory) history.replaceState(null, '', '#' + id);

  // Update active nav
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  // Update breadcrumb
  const label = getLabel(id);
  document.getElementById('breadcrumbCurrent').textContent = label;

  // Close mobile sidebar
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
  }

  if (id === 'home') {
    renderHome();
  } else if (CONTENT[id]) {
    renderInlineContent(id);
  } else {
    loadMarkdown(id);
  }

  document.getElementById('contentWrap').scrollTop = 0;
}

function getLabel(id) {
  for (const group of NAV) {
    for (const item of group.items) {
      if (item.id === id) return item.label;
    }
  }
  return id;
}

}

// ── Inline Content Renderer ───────────────────────────────────────────────────
function renderInlineContent(id) {
  const content = document.getElementById('content');
  content.innerHTML = CONTENT[id];
  addCodeToolbars(content);
  hljs.highlightAll();
  buildTOC(content);
}

// ── Load & Render Markdown ────────────────────────────────────────────────────
async function loadMarkdown(id) {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="state-msg"><div class="spinner"></div><span>Loading…</span></div>';

  const url = DOCS_BASE + id + '.md';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md = await res.text();
    renderMarkdown(md, content);
  } catch (err) {
    content.innerHTML = `
      <div class="state-msg">
        <svg width="40" height="40" viewBox="0 0 20 20" fill="currentColor" style="opacity:.3"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
        <strong>Could not load ${id}.md</strong>
        <span style="font-size:.8rem;max-width:320px;">
          Failed to load the document. Please try refreshing the page.
        </span>
      </div>`;
  }
}

function scrollToHeading(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function slugify(text) {
  return text
    .replace(/<[^>]+>/g, '')   // strip HTML tags from text
    .toLowerCase()
    .trim()
    .replace(/[^\w\s-]/g, '')  // remove non-word chars (keeps hyphens)
    .replace(/[\s_]+/g, '-')   // spaces/underscores → hyphens
    .replace(/^-+|-+$/g, '');  // trim leading/trailing hyphens
}

function mermaidTheme() {
  return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'neutral';
}

function renderMermaid(container) {
  const nodes = Array.from(container.querySelectorAll('.mermaid'));
  if (!nodes.length) return;
  mermaid.initialize({ startOnLoad: false, theme: mermaidTheme(), securityLevel: 'loose' });
  mermaid.run({ nodes });
}

function renderMarkdown(md, container) {
  // Configure marked
  marked.setOptions({ breaks: true, gfm: true });

  const renderer = new marked.Renderer();

  // Mermaid code fences → div.mermaid (source stored in data-src for theme re-renders)
  const _defaultCode = renderer.code.bind(renderer);
  renderer.code = (code, lang, escaped) => {
    if (lang === 'mermaid') {
      return `<div class="mermaid" data-src="${encodeURIComponent(code)}">${code}</div>\n`;
    }
    return _defaultCode(code, lang, escaped);
  };

  // Headings with slug IDs so in-page anchor links (#section) scroll correctly
  renderer.heading = (text, level) => {
    const id = slugify(text);
    return `<h${level} id="${id}">${text}</h${level}>\n`;
  };

  // Wrap tables
  renderer.table = (header, body) =>
    `<div class="table-wrap"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;

  // Open external links in new tab, rewrite internal .md links, handle in-page anchors
  renderer.link = (href, title, text) => {
    if (href && href.endsWith('.md')) {
      const id = href.replace(/.*\//, '').replace('.md', '');
      return `<a href="#${id}" onclick="navigate('${id}');return false;"${title ? ` title="${title}"` : ''}>${text}</a>`;
    }
    // In-page anchor: content lives inside overflow-y:auto container so native
    // browser anchor scroll targets the wrong scroll context — route through scrollToHeading()
    if (href && href.startsWith('#')) {
      const targetId = href.slice(1);
      return `<a href="${href}" onclick="scrollToHeading('${targetId}');return false;"${title ? ` title="${title}"` : ''}>${text}</a>`;
    }
    const ext = href && !href.startsWith('./') && !href.startsWith('../');
    return `<a href="${href}"${title ? ` title="${title}"` : ''}${ext ? ' target="_blank" rel="noopener"' : ''}>${text}</a>`;
  };

  marked.use({ renderer });

  const html = marked.parse(md);
  container.innerHTML = `<div class="md-body">${html}</div>`;

  addCodeToolbars(container);
  hljs.highlightAll();
  buildTOC(container);
  renderMermaid(container);
}

// ── Code Toolbars & Copy Buttons ──────────────────────────────────────────────
function addCodeToolbars(container) {
  container.querySelectorAll('pre').forEach(pre => {
    const code = pre.querySelector('code');
    if (!code) return;
    const lang = (code.className.match(/language-(\w+)/) || [])[1] || '';
    const toolbar = document.createElement('div');
    toolbar.className = 'code-toolbar';
    toolbar.innerHTML = `
      <span class="code-lang">${lang}</span>
      <button class="copy-btn" onclick="copyCode(this)">Copy</button>
    `;
    pre.insertBefore(toolbar, code);
  });
}

function copyCode(btn) {
  const code = btn.closest('pre').querySelector('code');
  navigator.clipboard.writeText(code.innerText).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

// ── Table of Contents ─────────────────────────────────────────────────────────
function buildTOC(container) {
  const headings = container.querySelectorAll('h2, h3');
  if (headings.length < 3) return;

  const existing = document.querySelector('.toc-panel');
  if (existing) existing.remove();

  const toc = document.createElement('div');
  toc.className = 'toc-panel';
  toc.innerHTML = '<h6>On this page</h6>';

  headings.forEach((h, i) => {
    // Preserve slug IDs stamped by renderer.heading; only assign a fallback if missing
    const id = h.id || slugify(h.textContent) || ('heading-' + i);
    h.id = id;
    const a = document.createElement('a');
    a.href = '#' + id;
    a.textContent = h.textContent;
    a.className = h.tagName === 'H3' ? 'toc-h3' : '';
    a.onclick = (e) => {
      e.preventDefault();
      h.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    toc.appendChild(a);
  });

  document.querySelector('.main').appendChild(toc);

  // Highlight active TOC item on scroll
  const wrap = document.getElementById('contentWrap');
  wrap.addEventListener('scroll', () => {
    const links = toc.querySelectorAll('a');
    let active = null;
    headings.forEach((h, i) => {
      if (h.getBoundingClientRect().top < 100) active = i;
    });
    links.forEach((a, i) => a.classList.toggle('active', i === active));
  }, { passive: true });
}

// ── Search ────────────────────────────────────────────────────────────────────
let allItems = [];
NAV.forEach(g => g.items.forEach(item => allItems.push({ ...item, group: g.group })));

function handleSearch(e) {
  const q = e.target.value.trim().toLowerCase();
  const container = document.getElementById('searchResults');
  if (!q) { container.style.display = 'none'; return; }

  const results = allItems.filter(item =>
    item.label.toLowerCase().includes(q) ||
    item.group.toLowerCase().includes(q) ||
    item.id.toLowerCase().includes(q)
  );

  if (results.length === 0) {
    container.style.display = 'block';
    container.innerHTML = '<div class="search-no-results">No results found</div>';
    return;
  }

  container.style.display = 'block';
  container.innerHTML = results.slice(0, 8).map(item => `
    <div class="search-result-item" onclick="navigate('${item.id}'); clearSearch();">
      <div class="search-result-title">${item.label}</div>
      <div class="search-result-section">${item.group}</div>
    </div>
  `).join('');
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').style.display = 'none';
}
</script>
