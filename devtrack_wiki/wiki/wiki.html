<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevTrack Docs</title>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/devtrack.png" />
  <link rel="apple-touch-icon" href="assets/devtrack.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme" />
  <script async src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    /* ── Reset & Tokens ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sans: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;

      --sidebar-w: 260px;
      --topbar-h: 52px;
      --content-max: 860px;
      --radius: 6px;
      --radius-lg: 10px;

      /* Light theme */
      --bg: #ffffff;
      --bg-subtle: #f8f8f8;
      --bg-muted: #f1f1f1;
      --border: #e5e5e5;
      --border-strong: #d0d0d0;
      --text: #111111;
      --text-muted: #666666;
      --text-faint: #999999;
      --accent: #0070f3;
      --accent-bg: #eff6ff;
      --accent-hover: #0060df;
      --sidebar-bg: #fafafa;
      --sidebar-border: #ebebeb;
      --code-bg: #f6f8fa;
      --code-border: #e1e4e8;
      --nav-hover: #f0f0f0;
      --nav-active-bg: #eff6ff;
      --nav-active-text: #0070f3;
      --scrollbar: #d8d8d8;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.07);
      --shadow-md: 0 4px 12px rgba(0,0,0,.10);
      --callout-note: #eff6ff;
      --callout-note-border: #93c5fd;
      --callout-tip: #f0fdf4;
      --callout-tip-border: #86efac;
      --callout-warn: #fffbeb;
      --callout-warn-border: #fcd34d;
    }

    [data-theme="dark"] {
      --bg: #07090e;
      --bg-subtle: #090d16;
      --bg-muted: #0c1020;
      --border: #1a2035;
      --border-strong: #243050;
      --text: #ededed;
      --text-muted: #94a3b8;
      --text-faint: #4b5563;
      --accent: #22d3ee;
      --accent-bg: rgba(34,211,238,.08);
      --accent-hover: #67e8f9;
      --sidebar-bg: #060810;
      --sidebar-border: #111827;
      --code-bg: #060810;
      --code-border: #1a2035;
      --nav-hover: rgba(34,211,238,.04);
      --nav-active-bg: rgba(34,211,238,.08);
      --nav-active-text: #22d3ee;
      --scrollbar: #1e2d42;
      --callout-note: rgba(34,211,238,.06);
      --callout-note-border: rgba(34,211,238,.4);
      --callout-tip: #0f2a1a;
      --callout-tip-border: #16a34a;
      --callout-warn: #2a1e00;
      --callout-warn-border: #d97706;
    }

    [data-theme="dark"] #hljs-theme { display: none; }
    [data-theme="dark"] #hljs-theme-dark { display: block; }
    #hljs-theme-dark { display: none; }

    html { font-size: 16px; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Scrollbar ─────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 99px; }

    /* ── Layout ────────────────────────────────────────────────────────── */
    .layout { display: flex; height: 100vh; overflow: hidden; }

    /* ── Sidebar ───────────────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .2s ease, transform .2s ease;
      position: relative;
      z-index: 200;
    }
    .sidebar.collapsed { width: 0; }

    .sidebar-head {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--sidebar-border);
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
    .brand-icon {
      width: 30px; height: 30px; border-radius: 7px;
      background: var(--accent); color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; flex-shrink: 0;
    }
    .brand-name { font-size: .95rem; font-weight: 700; letter-spacing: -.02em; }
    .brand-sub { font-size: .72rem; color: var(--text-faint); margin-top: 1px; }

    .sidebar-search {
      margin: 12px 12px 0;
      position: relative;
    }
    .sidebar-search input {
      width: 100%;
      padding: 7px 10px 7px 32px;
      background: var(--bg-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--sans);
      font-size: .8rem;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    .sidebar-search input::placeholder { color: var(--text-faint); }
    .sidebar-search input:focus { border-color: var(--accent); }
    .sidebar-search svg {
      position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px; color: var(--text-faint); pointer-events: none;
    }

    .nav { flex: 1; overflow-y: auto; padding: 8px 0 16px; }

    .nav-group { margin-bottom: 2px; }
    .nav-group-label {
      padding: 8px 16px 4px;
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-faint);
    }
    .nav-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 16px;
      font-size: .83rem;
      color: var(--text-muted);
      text-decoration: none;
      cursor: pointer;
      border-radius: 0;
      transition: background .1s, color .1s;
      border-left: 2px solid transparent;
      white-space: nowrap;
      overflow: hidden;
    }
    .nav-item:hover { background: var(--nav-hover); color: var(--text); transform: translateX(3px); }
    .nav-item.active {
      background: var(--nav-active-bg);
      color: var(--nav-active-text);
      border-left-color: var(--accent);
      font-weight: 600;
      box-shadow: inset 0 0 20px rgba(34,211,238,.04);
    }

    /* ── Sidebar version badge ───────────────────────────────────────── */
    .sidebar-version {
      display: flex; align-items: center; justify-content: space-between;
      margin: 10px 12px 0;
      padding: 6px 10px;
      background: var(--bg-muted); border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: .72rem; font-family: 'JetBrains Mono', monospace;
    }
    .sidebar-version-tag { color: var(--accent); font-weight: 600; }
    .sidebar-version-status { display: flex; align-items: center; gap: 5px; color: var(--text-faint); }
    .sidebar-version-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #22c55e; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
    .nav-item svg { width: 14px; height: 14px; flex-shrink: 0; opacity: .7; }
    .nav-item.active svg { opacity: 1; }

    /* ── Topbar ────────────────────────────────────────────────────────── */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

    .topbar {
      height: var(--topbar-h);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
      background: var(--bg);
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-toggle {
      padding: 6px; border-radius: var(--radius);
      border: 1px solid var(--border);
      background: none; cursor: pointer; color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      transition: background .1s, color .1s;
    }
    .topbar-toggle:hover { background: var(--bg-muted); color: var(--text); }
    .topbar-toggle svg { width: 15px; height: 15px; }

    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--text-muted); flex: 1; }
    .breadcrumb .sep { opacity: .4; }
    .breadcrumb .current { color: var(--text); font-weight: 500; }
    .breadcrumb .home-link { color: var(--text-muted); text-decoration: none; transition: color .15s; }
    .breadcrumb .home-link:hover { color: var(--accent); }

    .topbar-actions { display: flex; gap: 8px; margin-left: auto; }
    .icon-btn {
      padding: 6px; border-radius: var(--radius);
      border: 1px solid var(--border);
      background: none; cursor: pointer; color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      transition: background .1s, color .1s; font-size: .8rem;
    }
    .icon-btn:hover { background: var(--bg-muted); color: var(--text); }
    .icon-btn svg { width: 15px; height: 15px; }

    .version-chip {
      font-size: .72rem; font-weight: 500; padding: 2px 8px;
      background: var(--bg-muted); border: 1px solid var(--border);
      border-radius: 99px; color: var(--text-muted);
    }

    /* ── Content Area ──────────────────────────────────────────────────── */
    .content-wrap { flex: 1; overflow-y: auto; }
    .content-inner {
      max-width: calc(var(--content-max) + 80px);
      margin: 0 auto;
      padding: 40px 40px 80px;
    }

    /* ── Loading / Error states ─────────────────────────────────────────── */
    .state-msg {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 300px; gap: 12px;
      color: var(--text-muted); font-size: .9rem; text-align: center;
    }
    .spinner {
      width: 28px; height: 28px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Home / Landing ─────────────────────────────────────────────────── */
    .home-hero {
      border-bottom: 1px solid var(--border);
      padding-bottom: 40px; margin-bottom: 48px;
    }
    .home-badge {
      display: inline-block; font-size: .72rem; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase;
      padding: 3px 10px; border-radius: 99px;
      background: var(--accent-bg); color: var(--accent);
      border: 1px solid var(--accent); margin-bottom: 16px;
    }
    .home-title {
      font-size: 2.4rem; font-weight: 700; letter-spacing: -.04em;
      line-height: 1.15; color: var(--text); margin-bottom: 12px;
    }
    .home-title span { color: var(--accent); }
    .home-sub { font-size: 1.05rem; color: var(--text-muted); max-width: 560px; line-height: 1.65; }

    .home-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px; margin-bottom: 48px;
    }
    .home-card {
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 18px 20px; cursor: pointer; text-decoration: none;
      color: var(--text); background: var(--bg);
      transition: border-color .15s, box-shadow .15s, transform .1s;
      display: block;
    }
    .home-card:hover {
      border-color: var(--accent);
      box-shadow: 0 8px 28px rgba(34,211,238,.08), 0 0 0 1px rgba(34,211,238,.06);
      transform: translateY(-3px);
    }
    .home-card-icon { font-size: 1.4rem; margin-bottom: 10px; }
    .home-card-title { font-size: .9rem; font-weight: 600; margin-bottom: 4px; }
    .home-card-desc { font-size: .8rem; color: var(--text-muted); line-height: 1.5; }

    .quick-start-box {
      background: var(--code-bg); border: 1px solid var(--code-border);
      border-radius: var(--radius-lg); padding: 20px 24px; margin-bottom: 48px;
    }
    .quick-start-box h3 { font-size: .95rem; margin-bottom: 14px; color: var(--text); }

    .feature-list { display: flex; flex-direction: column; gap: 12px; }
    .feature-item { display: flex; gap: 12px; align-items: flex-start; }
    .feature-dot {
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--accent-bg); border: 1px solid var(--accent);
      color: var(--accent); font-size: .65rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px;
    }
    .feature-item h4 { font-size: .88rem; font-weight: 600; margin-bottom: 2px; }
    .feature-item p { font-size: .82rem; color: var(--text-muted); }
    .feature-item kbd {
      display: inline-block; font-family: var(--mono); font-size: .72rem;
      background: var(--bg-muted); border: 1px solid var(--border-strong);
      border-radius: 3px; padding: 0 4px; line-height: 1.5;
      color: var(--text); box-shadow: 0 1px 0 var(--border-strong);
    }

    /* ── Markdown Rendered Content ─────────────────────────────────────── */
    .md-body { max-width: var(--content-max); font-size: 1.0625rem; line-height: 1.75; }

    .md-body h1 {
      font-size: 2.1rem; font-weight: 700; letter-spacing: -.04em;
      line-height: 1.2; margin-bottom: 14px; color: var(--text);
      border-bottom: 1px solid var(--border); padding-bottom: 14px;
    }
    .md-body h2 {
      font-size: 1.45rem; font-weight: 600; letter-spacing: -.02em;
      line-height: 1.3; margin: 40px 0 14px; color: var(--text);
      border-bottom: 1px solid var(--border); padding-bottom: 8px;
    }
    .md-body h3 {
      font-size: 1.15rem; font-weight: 600;
      margin: 30px 0 10px; color: var(--text);
    }
    .md-body h4 {
      font-size: 1.0rem; font-weight: 600;
      margin: 22px 0 8px; color: var(--text);
    }
    .md-body h5, .md-body h6 {
      font-size: .95rem; font-weight: 600;
      margin: 18px 0 6px; color: var(--text-muted);
    }

    .md-body p { margin-bottom: 18px; }
    .md-body p:last-child { margin-bottom: 0; }

    .md-body a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .1s; }
    .md-body a:hover { border-bottom-color: var(--accent); }

    .md-body ul, .md-body ol {
      padding-left: 24px; margin-bottom: 16px;
    }
    .md-body li { margin-bottom: 5px; }
    .md-body li p { margin-bottom: 4px; }

    .md-body strong { font-weight: 600; }
    .md-body em { font-style: italic; }

    .md-body blockquote {
      border-left: 3px solid var(--accent);
      padding: 10px 16px; margin: 20px 0;
      background: var(--accent-bg); border-radius: 0 var(--radius) var(--radius) 0;
    }
    .md-body blockquote p { color: var(--text-muted); margin: 0; font-size: .9rem; }

    .md-body hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

    /* ── Mermaid Diagrams ───────────────────────────────────────────────── */
    .mermaid {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      margin: 24px 0;
      overflow-x: auto;
      text-align: center;
    }
    .mermaid svg { max-width: 100%; height: auto; }

    /* ── Code ──────────────────────────────────────────────────────────── */
    .md-body code {
      font-family: var(--mono);
      font-size: .83em;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      padding: 1px 5px;
      border-radius: 4px;
      color: var(--text);
    }

    .md-body pre {
      position: relative;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: var(--radius-lg);
      margin: 20px 0;
      overflow: hidden;
    }
    .md-body pre code {
      display: block;
      overflow-x: auto;
      padding: 16px 20px;
      background: transparent;
      border: none;
      border-radius: 0;
      font-size: .82rem;
      line-height: 1.65;
    }

    .code-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px;
      background: rgba(0,0,0,.25);
      border-bottom: 1px solid var(--border);
    }
    .code-lang {
      font-size: .68rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
    }
    .copy-btn {
      font-family: 'JetBrains Mono', monospace; font-size: .7rem;
      padding: 3px 10px; border-radius: var(--radius);
      border: 1px solid var(--border);
      background: transparent; color: var(--text-faint);
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn.copied { color: #22c55e; border-color: #22c55e; }

    /* ── Content entry animation ─────────────────────────────────────── */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .content-inner { animation: fadeSlideUp .35s ease both; }

    /* ── Grid overlay on topbar ──────────────────────────────────────── */
    .topbar {
      background-image:
        linear-gradient(to right, rgba(255,255,255,.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.015) 1px, transparent 1px);
      background-size: 3rem 3rem;
    }

    /* ── Tables ────────────────────────────────────────────────────────── */
    .md-body .table-wrap { overflow-x: auto; margin: 20px 0; }
    .md-body table {
      width: 100%; border-collapse: collapse;
      font-size: .85rem; border-radius: var(--radius-lg);
      overflow: hidden; border: 1px solid var(--border);
    }
    .md-body th {
      background: var(--bg-muted); text-align: left;
      padding: 9px 14px; font-weight: 700; font-size: .78rem;
      letter-spacing: .05em; text-transform: uppercase;
      color: var(--text-faint); border-bottom: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
    }
    .md-body td { padding: 9px 14px; border-bottom: 1px solid var(--border); }
    .md-body tr:last-child td { border-bottom: none; }
    .md-body tr:hover td { background: rgba(34,211,238,.03); }

    /* ── Search Results ─────────────────────────────────────────────────── */
    .search-results {
      padding: 4px 0;
    }
    .search-result-item {
      padding: 8px 16px; cursor: pointer;
      border-left: 2px solid transparent;
      transition: background .1s;
    }
    .search-result-item:hover {
      background: var(--nav-hover); border-left-color: var(--accent);
    }
    .search-result-title { font-size: .82rem; font-weight: 500; color: var(--text); }
    .search-result-section { font-size: .72rem; color: var(--text-faint); margin-top: 2px; }
    .search-no-results { padding: 12px 16px; font-size: .82rem; color: var(--text-faint); }

    /* ── TOC ────────────────────────────────────────────────────────────── */
    .toc-panel {
      position: fixed; right: 0; top: var(--topbar-h);
      width: 200px; height: calc(100vh - var(--topbar-h));
      overflow-y: auto; padding: 24px 16px;
      border-left: 1px solid var(--border);
      background: var(--bg);
      font-size: .78rem;
    }
    .toc-panel h6 {
      font-size: .68rem; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text-faint);
      margin-bottom: 10px;
    }
    .toc-panel a {
      display: block; padding: 3px 0 3px 10px;
      color: var(--text-muted); text-decoration: none;
      border-left: 1px solid var(--border);
      transition: color .1s, border-color .1s;
      line-height: 1.5;
    }
    .toc-panel a:hover { color: var(--text); border-left-color: var(--accent); }
    .toc-panel a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 500; }
    .toc-panel a.toc-h3 { padding-left: 22px; font-size: .74rem; }
    @media (max-width: 1200px) { .toc-panel { display: none; } }

    /* ── Mobile ─────────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed; left: 0; top: 0; bottom: 0;
        transform: translateX(-100%); width: var(--sidebar-w);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar.collapsed { transform: translateX(-100%); width: var(--sidebar-w); }
      .content-inner { padding: 24px 20px 60px; }
      .home-title { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme-dark" />

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <a class="brand" href="#" onclick="navigate('home');return false;">
        <div class="brand-icon">D</div>
        <div>
          <div class="brand-name">DevTrack</div>
          <div class="brand-sub">Developer Automation</div>
        </div>
      </a>
      <div class="sidebar-version">
        <span class="sidebar-version-tag">v3.1.1</span>
        <span class="sidebar-version-status">
          <span class="sidebar-version-dot"></span>
          live
        </span>
      </div>
      <div class="sidebar-search" style="margin-top:8px;">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
        <input type="text" id="searchInput" placeholder="Search docs…" autocomplete="off" />

  FIRST_DAY: `<div class="md-body">
<h1>Your First Day with DevTrack</h1>
<p>This walkthrough assumes you have never used DevTrack. By the end, the daemon will be watching one repository, your first ticket-linked commit will be recorded, and you will know exactly where to review anything DevTrack intends to send.</p>

<blockquote><p><strong>The mental model:</strong> DevTrack is a silent background worker. You continue using Git normally. It reads branch names and commits, prepares ticket updates and reports, assigns confidence, and places every outbound action in a review queue before it can leave your machine.</p></blockquote>

<h2>Before You Start</h2>
<p>You need Git and a DevTrack binary on your <code>PATH</code>. For the default managed mode you also need a PostgreSQL database and an Ollama service. They may run on this computer, in Docker, or on another trusted machine.</p>
<div class="table-wrap"><table>
<thead><tr><th>Component</th><th>Why it is needed</th><th>Can you continue without it?</th></tr></thead>
<tbody>
<tr><td>Go client</td><td>Daemon, Git monitor, local SQLite, queue, connectors, TUI and MCP</td><td>No — this is DevTrack</td></tr>
<tr><td>PostgreSQL</td><td>Persistence for the optional Python AI server</td><td>Yes in lightweight mode</td></tr>
<tr><td>Ollama</td><td>Private local text generation and enrichment</td><td>Yes; Git observation continues and generation degrades</td></tr>
<tr><td>PM token</td><td>Lets reviewed actions reach GitHub, GitLab, Azure DevOps or Jira</td><td>Yes; choose no PM integration for a local evaluation</td></tr>
</tbody></table></div>

<h2>Step 1 — Choose a Mode</h2>
<div class="table-wrap"><table>
<thead><tr><th>Mode</th><th>Choose it when</th><th>What runs</th></tr></thead>
<tbody>
<tr><td><strong>Managed</strong></td><td>You want the normal local experience with AI reports and voice features.</td><td>The Go daemon manages a local Python server. PostgreSQL is required by that server.</td></tr>
<tr><td><strong>Lightweight</strong></td><td>You want Git monitoring, local queue, connectors, alerts, TUI and MCP without Python.</td><td>Only the Go client and local SQLite.</td></tr>
<tr><td><strong>External</strong></td><td>Your Python server and PostgreSQL live on another host or in a container.</td><td>The local Go client connects to <code>DEVTRACK_SERVER_URL</code>.</td></tr>
</tbody></table></div>

<h2>Step 2 — Prepare the Dependencies</h2>
<p>For managed mode, follow <a href="#POSTGRES_SETUP" onclick="navigate('POSTGRES_SETUP');return false;">PostgreSQL Setup</a>. Then follow <a href="#LLM_GUIDE" onclick="navigate('LLM_GUIDE');return false;">LLM Setup</a>. If those services already exist on the network, write down their URLs; you do not need to reinstall them locally.</p>

<h2>Step 3 — Run Setup from the Repository You Want to Watch</h2>
<pre><code class="language-bash">cd /path/to/your/project
devtrack setup</code></pre>
<p>The wizard asks for the deployment mode, repository, AI provider, identity and PM integration. It writes a private environment file, creates <code>workspaces.yaml</code>, and registers the configuration so later commands load it automatically. You do not need to run <code>source .env</code>.</p>
<p>If you are evaluating locally, choose <strong>None</strong> for the PM platform. You can add the integration later without repeating the entire install.</p>

<h2>Step 4 — Check Readiness</h2>
<pre><code class="language-bash">devtrack doctor
devtrack start
devtrack status
devtrack logs -f</code></pre>
<p>In managed mode, setup may finish before Python dependencies or a model download finish. This is expected. <code>doctor</code> explains which capability is ready, degraded, or still installing. If background preparation failed, use <code>devtrack doctor --repair</code>.</p>

<h2>Step 5 — Make a Ticket-Linked Commit</h2>
<p>DevTrack gets its strongest signal from the branch name. Replace <code>PROJ-123</code> with a real ticket ID used by your team:</p>
<pre><code class="language-bash">git switch -c feature/PROJ-123-first-devtrack-test
# edit a file normally
git add path/to/file
git commit -m "PROJ-123: describe the change"</code></pre>
<p>DevTrack observes the completed commit. It never holds the commit open waiting for a model or project-management API. If no ticket can be identified, it records the commit as unlinked and moves on.</p>

<h2>Step 6 — Inspect What Happened</h2>
<pre><code class="language-bash">devtrack commits
devtrack queue list
devtrack queue status
devtrack logs</code></pre>
<p>A prepared PM comment or state change includes its action type, target, confidence and expiry. Read <a href="#PENDING_ACTIONS" onclick="navigate('PENDING_ACTIONS');return false;">Pending Actions</a> before approving anything during your first evaluation.</p>

<h2>Step 7 — Generate Your First EOD Narrative</h2>
<pre><code class="language-bash">devtrack eod generate
devtrack eod show
devtrack eod status</code></pre>
<p>The narrative is generated from work already observed; DevTrack does not ask you to reconstruct your day. Delivery is still staged as an action. See <a href="#EOD_AND_VOICE" onclick="navigate('EOD_AND_VOICE');return false;">EOD &amp; Your Voice</a> to train the local voice profile.</p>

<h2>What Success Looks Like</h2>
<ul>
<li><code>devtrack status</code> reports the daemon running.</li>
<li>Your repository appears in <code>devtrack workspace list</code>.</li>
<li>The ticket ID is visible in recent activity or logs after the commit.</li>
<li>Any external update appears in the pending queue before dispatch.</li>
<li>Git still works normally if PostgreSQL, Ollama or a PM API is temporarily unavailable.</li>
</ul>
<p>Next, configure additional repositories in <a href="#WORKSPACES" onclick="navigate('WORKSPACES');return false;">Workspaces</a>, then install login-time startup from <a href="#AUTOSTART" onclick="navigate('AUTOSTART');return false;">Auto-Start</a>.</p>
</div>`,

  POSTGRES_SETUP: `<div class="md-body">
<h1>PostgreSQL Setup</h1>
<p>PostgreSQL is required only by the Python server. The Go client never connects to PostgreSQL: it keeps local observation, queue and MCP data in SQLite. Lightweight mode therefore needs no PostgreSQL at all.</p>

<h2>Option A — Local Docker Container</h2>
<p>This is the simplest reproducible setup for a workstation. Choose a strong password and keep it out of Git.</p>
<pre><code class="language-bash">docker run -d \
  --name devtrack-postgres \
  --restart unless-stopped \
  -e POSTGRES_USER=devtrack \
  -e POSTGRES_PASSWORD=&lt;choose-a-strong-password&gt; \
  -e POSTGRES_DB=devtrack \
  -p 127.0.0.1:5432:5432 \
  -v devtrack-postgres-data:/var/lib/postgresql/data \
  postgres:16</code></pre>
<p>Use this connection string when <code>devtrack setup</code> asks for <code>POSTGRES_URL</code>:</p>
<pre><code class="language-text">postgresql://devtrack:&lt;choose-a-strong-password&gt;@localhost:5432/devtrack</code></pre>

<h2>Option B — PostgreSQL on Another LAN Host</h2>
<p>Use the database host's LAN address in the URL. PostgreSQL must listen on that interface, <code>pg_hba.conf</code> must allow the DevTrack host, and the host firewall must permit TCP 5432 only from the trusted subnet.</p>
<pre><code class="language-text">postgresql://devtrack:&lt;password&gt;@&lt;postgres-host&gt;:5432/devtrack</code></pre>
<blockquote><p>Do not expose port 5432 to the public internet. Prefer a private LAN, VPN or SSH tunnel, and scope firewall rules to the DevTrack client address or subnet.</p></blockquote>

<h2>Option C — Repository Compose Stack</h2>
<p>For a source checkout, the server Compose file starts PostgreSQL and waits for its health check before starting the Python service:</p>
<pre><code class="language-bash">cd Devtrack_/devtrack_server
cp .env_sample .env
# edit .env and set POSTGRES_URL plus required secrets
docker compose up -d devtrack_server
docker compose ps</code></pre>

<h2>Verify the Database Before Starting DevTrack</h2>
<pre><code class="language-bash">docker ps --filter name=devtrack-postgres
docker logs devtrack-postgres --tail 30
pg_isready -h localhost -p 5432 -U devtrack</code></pre>
<p>If <code>pg_isready</code> is not installed on the host, run it inside the container:</p>
<pre><code class="language-bash">docker exec devtrack-postgres pg_isready -U devtrack -d devtrack</code></pre>

<h2>Schema Migrations</h2>
<p>The Python server validates <code>POSTGRES_URL</code> and applies Alembic migrations during startup. It does not silently fall back to a server-side SQLite database. For a manual source-checkout check:</p>
<pre><code class="language-bash">cd Devtrack_/devtrack_server
uv run python -m backend.db.migrate</code></pre>

<h2>Common Failures</h2>
<div class="table-wrap"><table>
<thead><tr><th>Symptom</th><th>What to check</th></tr></thead>
<tbody>
<tr><td>Connection refused</td><td>Container status, host name, port mapping, listen address and firewall.</td></tr>
<tr><td>Password authentication failed</td><td>User/password in <code>POSTGRES_URL</code>; changing Docker environment variables does not rewrite an existing data volume.</td></tr>
<tr><td>Database does not exist</td><td>The URL must end with a database name such as <code>/devtrack</code>.</td></tr>
<tr><td>Works on host, fails in container</td><td>Inside a container, <code>localhost</code> means that container. Use the Compose service name or reachable host address.</td></tr>
<tr><td>Migration error</td><td>Read the first migration failure in server logs; do not delete the data volume as a first response.</td></tr>
</tbody></table></div>
</div>`,

  PENDING_ACTIONS: `<div class="md-body">
<h1>Pending Actions</h1>
<p>The pending-actions queue is DevTrack's safety boundary. Ticket comments, state changes, reports, email and Git actions are staged with an explicit confidence score before dispatch. There is no supported direct-send fallback.</p>

<h2>Read the Queue</h2>
<pre><code class="language-bash">devtrack queue
devtrack queue list
devtrack queue list --all
devtrack queue status</code></pre>
<p>The default view shows pending actions. <code>--all</code> includes recent posted and rejected rows. Each row shows an ID, status, confidence, action type, target and expiry.</p>

<h2>Review an Action</h2>
<ol>
<li>Confirm the target ticket, repository, recipient or branch.</li>
<li>Read the generated content and check that it is factually supported by the observed work.</li>
<li>Use the confidence as context, not as a substitute for checking the action.</li>
<li>Approve, edit or reject by numeric ID.</li>
</ol>
<pre><code class="language-bash">devtrack queue approve &lt;id&gt;
devtrack queue edit &lt;id&gt; '{"content":"corrected text"}'
devtrack queue reject &lt;id&gt;
devtrack queue flag &lt;id&gt;</code></pre>
<p>Approval marks the local row approved and asks the configured server or connector to execute it. If a remote service is unavailable, the local outbox remains intact for retry; a failed network call must not block Git.</p>

<h2>Confidence and Expiry</h2>
<div class="table-wrap"><table>
<thead><tr><th>Confidence</th><th>Default review window</th><th>Interpretation</th></tr></thead>
<tbody>
<tr><td>Above 0.90</td><td>2 minutes</td><td>Strong signal; still visible and rejectable.</td></tr>
<tr><td>0.70–0.90</td><td>5 minutes</td><td>Normal review tier.</td></tr>
<tr><td>Below 0.70</td><td>15 minutes</td><td>Low confidence; prominently flagged for review.</td></tr>
<tr><td>New action type</td><td>30 minutes</td><td>Conservative first-use review period.</td></tr>
</tbody></table></div>
<p>Trust thresholds can tighten as DevTrack learns from approvals, edits and rejections. Confidence must always remain visible.</p>

<h2>If the Queue Looks Empty</h2>
<ul>
<li>Check <code>devtrack logs -f</code> for an unlinked ticket, degraded server, or connector error.</li>
<li>Confirm the branch contains a ticket ID or set one explicitly with <code>devtrack work start PROJ-123</code>.</li>
<li>Remember that server-generated actions live in PostgreSQL. Local mirroring depends on the opt-in client-event sync setting.</li>
<li>Use <code>devtrack eod status</code> for the latest EOD action even when the local queue view has not mirrored the server row.</li>
</ul>
</div>`,

  EOD_AND_VOICE: `<div class="md-body">
<h1>End-of-Day Reports and Your Voice</h1>
<p>DevTrack builds an end-of-day narrative from commits and work sessions already observed. It should sound like you when a local voice profile exists and degrade to clear template or raw output when AI services are unavailable.</p>

<h2>Generate and Inspect a Report</h2>
<pre><code class="language-bash">devtrack eod generate
devtrack eod show
devtrack eod status</code></pre>
<p><code>generate</code> prints the narrative and reports the staged action ID when queueing succeeds. <code>show</code> prints the most recent saved narrative. <code>status</code> shows its date, action ID and state.</p>

<h2>Teach DevTrack How You Write</h2>
<p>Voice learning stays local. Seed from existing Git commit messages, generate a profile, then inspect its status:</p>
<pre><code class="language-bash">devtrack voice seed
devtrack voice profile
devtrack voice status</code></pre>
<p>Add a high-quality example manually when a particular writing context needs guidance:</p>
<pre><code class="language-bash">devtrack voice add --context comment "Fixed the refresh flow and added regression coverage."</code></pre>
<p>Supported contexts include commit, description, report, task and comment. A missing profile never blocks generation; the system simply omits the learned-style layer.</p>

<h2>A Practical First Week</h2>
<ol>
<li>Let DevTrack observe normal ticket-linked commits for several days.</li>
<li>Run <code>devtrack voice seed</code> and review the corpus count.</li>
<li>Generate the profile and an EOD report.</li>
<li>Edit inaccurate wording in the pending queue instead of sending it unchanged.</li>
<li>Reject unsupported claims. Corrections are learning signals for future output.</li>
</ol>

<h2>Privacy Boundary</h2>
<p>Commit history, writing examples, corrections and the voice profile remain local unless you explicitly configure an external provider or synchronization feature. When a cloud LLM is enabled, only the prompt text needed for that request is sent; DevTrack documentation must never imply that cloud providers are active by default.</p>
</div>`,

  SETUP_WIZARD: `<div class="md-body">
<h1>Setup Wizard</h1>
<p>The <strong>setup wizard</strong> is a one-command interactive onboarding flow that configures DevTrack from scratch — no manual <code>.env</code> editing required. It walks through server mode, LLM provider, credentials, workspace, project-management platform, and shell integration, then writes a complete environment file under the DevTrack XDG data directory and registers it so every subsequent <code>devtrack</code> invocation auto-loads it. Managed mode also collects and validates the required PostgreSQL URL.</p>

<div class="home-badge" style="margin-bottom:24px;background:var(--callout-tip);border-color:var(--callout-tip-border);color:#166534;">Available in the latest public release — v3.1.1</div>
<blockquote><p>v3.1.1 includes the background bootstrap, <code>doctor</code>, first-run MCP guidance, voice seeding, and LLM fast lane described below.</p></blockquote>

<h2>Running the Wizard</h2>
<pre><code class="language-bash">devtrack setup</code></pre>
<p>The wizard discovers or installs the components required by the selected mode. No flags or environment variables are needed to run it.</p>
<p>If a <code>.env</code> already exists, the wizard asks before overwriting — the existing file is preserved unless you explicitly confirm.</p>

<h2>Wizard Steps</h2>
<div class="table-wrap"><table>
<thead><tr><th>Step</th><th>What happens</th></tr></thead>
<tbody>
<tr><td><strong>1. Prerequisites</strong></td><td>Checks <code>git</code>, which the Go-native product uses immediately. Managed Python/<code>uv</code>/Ollama work runs later in the background and cannot block the wizard.</td></tr>
<tr><td><strong>2. Server mode</strong></td><td>Choose <strong>Managed</strong> (daemon starts the optional local Python server — default) or <strong>External</strong> (provide a URL for a separately-running backend). Go-native capabilities remain usable without a ready server; advanced users can still set <code>DEVTRACK_SERVER_MODE=lightweight</code> directly.</td></tr>
<tr><td><strong>3. Workspace</strong></td><td>Prompts for the git repository to monitor. Defaults to the project root. Warns if the path is not a git repository.</td></tr>
<tr><td><strong>4. LLM provider</strong></td><td>Offers Ollama (local, default), OpenAI, Anthropic, Groq, or Skip. Setup reuses the first installed generation-capable Ollama model and ignores embedding-only models. If no local model is ready, an already-present OpenAI/Anthropic key can be accepted as a temporary fallback without displaying it; declining keeps setup local-only.</td></tr>
<tr><td><strong>5. Identity</strong></td><td>Optional email address — used to filter your own comments in integrations and to identify you in reports.</td></tr>
<tr><td><strong>6. PM platform</strong></td><td>GitHub Issues, Azure DevOps, Jira, or None. Prompts for the relevant tokens/credentials.</td></tr>
<tr><td><strong>7. Data directories</strong></td><td>Creates all required subdirectories under <code>Data/</code> (<code>db/</code>, <code>logs/</code>, <code>pids/</code>, <code>configs/</code>, <code>learning/</code>, <code>reports/</code>, <code>tls/</code>).</td></tr>
<tr><td><strong>8. XDG home</strong></td><td><strong>(v2.1.0-dev)</strong> Creates <code>~/.devtrack/</code> if it does not exist.</td></tr>
<tr><td><strong>9. workspaces.yaml</strong></td><td>Writes a starter <code>workspaces.yaml</code> under the DevTrack XDG data directory and sets <code>WORKSPACES_FILE</code> in the generated environment file.</td></tr>
<tr><td><strong>10. Write .env</strong></td><td>Generates a complete <code>.env</code> under the DevTrack XDG data directory with visible runtime defaults and your answers. <code>ADMIN_SECRET_KEY</code> is auto-generated; Managed mode requires a valid <code>postgresql://</code> URL with a database name. Written with <code>chmod 0600</code>.</td></tr>
<tr><td><strong>11. Register .env</strong></td><td>Writes the <code>.env</code> path to <code>~/.devtrack/devtrack.conf</code>. All future <code>devtrack</code> commands pick this up automatically via <code>AutoLoadEnv()</code>.</td></tr>
<tr><td><strong>12. Shell integration</strong></td><td><strong>(v2.1.0-dev)</strong> Writes <code>eval "$(devtrack shell-init)"</code> directly to the detected shell profile (<code>~/.zshrc</code> or <code>~/.bashrc</code>) — no manual copy-paste. No <code>source .env</code> needed.</td></tr>
<tr><td><strong>13. Autostart</strong></td><td>Prompts to install OS-native autostart via <code>devtrack autostart-install</code>.</td></tr>
<tr><td><strong>14. Background bootstrap</strong></td><td>Managed mode starts a detached, idempotent sparse checkout, <code>uv sync</code>, and a local Ollama model pull only when setup found no usable installed generation model. Atomic state and a local log make every step visible in <code>devtrack doctor</code> and <code>devtrack status</code>.</td></tr>
<tr><td><strong>15. First-run quick win</strong></td><td>Setup immediately suggests <code>devtrack mcp setup</code> and the question “What am I working on?” — both SQLite-backed and available without Python. In Managed mode, when the optional local AI server becomes ready, the daemon mines enabled local Git workspaces once, builds the voice profile, and suggests <code>devtrack work report</code>. External mode never sends local learning data automatically.</td></tr>
</tbody>
</table></div>

<h2>After Setup</h2>
<pre><code class="language-bash"># 1. Start DevTrack — managed dependencies and env are already configured
devtrack start

# 2. Check the daemon and optional server bootstrap
devtrack status
devtrack doctor
devtrack logs</code></pre>

<p>Git monitoring, SQLite, scheduling, and MCP are ready while the optional AI server installs. A failed or interrupted bootstrap does not stop those capabilities; use <code>devtrack doctor --repair</code> to retry safely.</p>
<pre><code class="language-bash">devtrack mcp setup
# Reload Claude Code, then ask: "What am I working on?"</code></pre>
<p>In Managed mode, voice mining starts automatically after the local AI server is reachable and never blocks daemon startup. The completed profile count is kept locally and appears in <code>status</code>/<code>doctor</code> with the next command: <code>devtrack work report</code>. External mode leaves local learning data untouched.</p>

<blockquote><p><strong>No more <code>source .env</code>:</strong> Once <code>devtrack setup</code> completes, every <code>devtrack</code> command auto-loads the registered <code>.env</code> file. Shell exports, CI variables, and secrets managers always take precedence over file values — the file is only applied for keys not already in the environment.</p></blockquote>

<h2>Re-running Setup</h2>
<p>Run <code>devtrack setup</code> again at any time to reconfigure. The wizard asks before overwriting the existing <code>.env</code>. Answering <strong>n</strong> leaves everything unchanged.</p>
<pre><code class="language-bash">devtrack setup   # re-run wizard (asks before overwriting)</code></pre>

<h2>AutoLoadEnv — Automatic .env Resolution</h2>
<p>The Go daemon calls <code>AutoLoadEnv()</code> at the very start of <code>main()</code>, before any command processing. It resolves and loads the <code>.env</code> file using the following priority order:</p>
<div class="table-wrap"><table>
<thead><tr><th>Priority</th><th>Source</th><th>Use case</th></tr></thead>
<tbody>
<tr><td><strong>1</strong></td><td><code>DEVTRACK_ENV_FILE</code> env var</td><td>Explicit override — CI, Docker, 1Password wrapper scripts</td></tr>
<tr><td><strong>2</strong></td><td><code>~/.devtrack/devtrack.conf</code></td><td>Path registered by <code>devtrack setup</code> — normal developer use</td></tr>
<tr><td><strong>3</strong></td><td><code>.env</code> next to the binary</td><td>Release tarball / portable installs where the binary lives with the project</td></tr>
</tbody>
</table></div>

<h3>Key Behaviours</h3>
<ul>
<li><strong>Existing env vars are never overridden</strong> — shell exports, CI variables, and secret managers always win over the file.</li>
<li><strong>Silent on missing file</strong> — if no <code>.env</code> is found via any path, <code>AutoLoadEnv()</code> returns silently. The daemon continues and will surface missing-variable errors as before.</li>
<li><strong>Quote stripping and inline comments</strong> — supports <code>KEY="quoted value"</code>, <code>KEY='single quoted'</code>, and inline <code># comments</code> on unquoted values.</li>
<li><strong>Variable expansion not supported</strong> — generated <code>.env</code> files use absolute paths to avoid this requirement.</li>
</ul>

<h3>devtrack.conf Format</h3>
<p>The registration file at <code>~/.devtrack/devtrack.conf</code> is a single line containing the absolute path to the active <code>.env</code> file:</p>
<pre><code>/home/alice/projects/automation_tools/.env</code></pre>
<p>Written with <code>chmod 0600</code>. Managed exclusively by <code>devtrack setup</code> and <code>RegisterEnvFile()</code> in <code>devtrack_client/internal/config/loadenv.go</code>.</p>

<h2>CI / Docker / Automated Environments</h2>
<p>In non-interactive environments, skip the wizard entirely and use the explicit override:</p>
<pre><code class="language-bash"># CI: set DEVTRACK_ENV_FILE to point to a pre-baked .env
export DEVTRACK_ENV_FILE=/run/secrets/devtrack.env
devtrack start

# Docker: pass env vars directly — AutoLoadEnv no-ops when all vars are already set
docker run --env-file .env devtrack start</code></pre>

<h2>Implementation Files</h2>
<div class="table-wrap"><table>
<thead><tr><th>File</th><th>Purpose</th></tr></thead>
<tbody>
<tr><td><code>devtrack_client/setup.go</code></td><td><code>RunSetup()</code> wizard, <code>SetupConfig</code> struct, <code>generateEnvContent()</code> template, <code>detectProjectRoot()</code>, prerequisite checks, shell and autostart instructions</td></tr>
<tr><td><code>devtrack_client/server_bootstrap.go</code></td><td>Detached managed-server worker, atomic progress state, duplicate-run lock, capability map, and <code>doctor --repair</code></td></tr>
<tr><td><code>devtrack_client/internal/config/loadenv.go</code></td><td><code>AutoLoadEnv()</code>, <code>resolveEnvFilePath()</code>, <code>loadDotEnv()</code> parser, <code>RegisterEnvFile()</code></td></tr>
</tbody>
</table></div>
</div>`,

  SERVER_TUI: `<div class="md-body">
<h1>Python Server TUI</h1>
<p>The Server TUI is an operator tool for inspecting the optional Python backend. It is different from <code>devtrack tui</code>: the Go client TUI shows developer activity and alerts, while this Python TUI focuses on server process health and trigger throughput.</p>
<h2>Why It Exists</h2>
<p>Managed mode normally starts the server automatically. Use this tool when diagnosing a headless or external server, watching resource use, reviewing server logs, or restarting the webhook process without a browser.</p>
<h2>Launch</h2>
<pre><code class="language-bash">cd Devtrack_/devtrack_server
uv sync
uv run python -m backend.server_tui</code></pre>
<blockquote><p><code>devtrack server-tui</code> is not a Go client command. Server operator tools run from the Python environment with <code>uv</code>.</p></blockquote>
<h2>What It Shows</h2>
<ul>
<li>The <code>webhook_server</code> PID, state, CPU, memory and uptime.</li>
<li>Webhook-server and Ollama reachability.</li>
<li>Triggers today, commits today, last trigger time and errors from the last 24 hours.</li>
<li>A tail view of the selected server log.</li>
</ul>
<p>Telegram, the GitHub/Azure alert poller and Slack alert delivery are Go-client responsibilities and are not Python server processes. In PostgreSQL mode, the stats panel asks the Go daemon for Go-owned trigger counters instead of reading client SQLite directly.</p>
<h2>Controls</h2>
<div class="table-wrap"><table><thead><tr><th>Key</th><th>Action</th></tr></thead><tbody>
<tr><td><code>↑</code>/<code>k</code>, <code>↓</code>/<code>j</code></td><td>Select a process.</td></tr>
<tr><td><code>r</code></td><td>Restart the selected process.</td></tr>
<tr><td><code>s</code>/<code>x</code></td><td>Start or stop the selected process.</td></tr>
<tr><td><code>l</code></td><td>Toggle its log tail.</td></tr>
<tr><td><code>q</code></td><td>Exit the TUI.</td></tr>
</tbody></table></div>
<h2>Failure Behavior</h2>
<p>Missing stats, a stopped daemon or an unavailable data source produce zero/degraded indicators rather than crashing. End users should start with <code>devtrack doctor</code>; this TUI is for server-side diagnosis.</p>
</div>`,

  ADMIN_CONSOLE: `<div class="md-body">
<h1>Admin Console</h1>
<p>The Admin Console is a lightweight web UI for managing DevTrack's Python backend — users, roles, API keys, LLM configuration, integration credentials, license status, and a trigger throughput stats panel — without touching the command line or <code>.env</code> directly. It is built with HTMX + Jinja2 and has no JavaScript build step.</p>

<div class="home-badge" style="margin-bottom:24px;background:var(--callout-tip);border-color:var(--callout-tip-border);color:#166534;">CS-3 complete — v2.0.0</div>

<h2>Launching</h2>
<pre><code class="language-bash">cd Devtrack_/devtrack_server\nuv run python -m backend.admin</code></pre>
<p>Then open <a href="http://localhost:8090/admin/" target="_blank" rel="noopener">http://localhost:8090/admin/</a> in a browser.</p>
<p>The Admin Console runs on a <strong>separate port (8090)</strong> from the webhook server (8089) so it can be firewall-restricted independently in production deployments.</p>

<h3>Single-Process Mode (ADMIN_EMBED)</h3>
<p>Set <code>ADMIN_EMBED=true</code> in <code>.env</code> to mount the admin console directly on the webhook server process (port 8089). In this mode the admin UI is served at <code>/admin</code> on the same port — useful for minimal deployments or containers where running two processes is inconvenient. When <code>ADMIN_EMBED=false</code> (the default) the admin console runs as a separate process and the two apps are fully independent.</p>
<pre><code class="language-bash"># Mount admin on port 8089 instead of starting a separate process
ADMIN_EMBED=true devtrack start   # or set in .env</code></pre>

<h2>Required .env Variables</h2>
<div class="table-wrap"><table>
<thead><tr><th>Variable</th><th>Default</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>ADMIN_PORT</code></td><td><code>8090</code></td><td>Port the admin server listens on (ignored when <code>ADMIN_EMBED=true</code>)</td></tr>
<tr><td><code>ADMIN_HOST</code></td><td><code>0.0.0.0</code></td><td>Bind address (<code>127.0.0.1</code> to restrict to localhost)</td></tr>
<tr><td><code>ADMIN_USERNAME</code></td><td><code>admin</code></td><td>Login username</td></tr>
<tr><td><code>ADMIN_PASSWORD</code></td><td><code>changeme</code></td><td>Login password — <strong>change before exposing to a network</strong></td></tr>
<tr><td><code>ADMIN_SECRET_KEY</code></td><td>—</td><td>Secret used to sign JWT session cookies — required, no default</td></tr>
<tr><td><code>ADMIN_SESSION_HOURS</code></td><td><code>8</code></td><td>Session lifetime in hours before re-login is required</td></tr>
<tr><td><code>ADMIN_EMBED</code></td><td><code>false</code></td><td>Mount admin console on webhook server (single-process mode)</td></tr>
<tr><td><code>SCRYPT_N</code></td><td><code>16384</code></td><td>scrypt CPU/memory cost factor for password hashing</td></tr>
<tr><td><code>SCRYPT_R</code></td><td><code>8</code></td><td>scrypt block size parameter</td></tr>
<tr><td><code>SCRYPT_P</code></td><td><code>1</code></td><td>scrypt parallelisation factor</td></tr>
<tr><td><code>SCRYPT_DKLEN</code></td><td><code>32</code></td><td>scrypt derived key length (bytes)</td></tr>
<tr><td><code>STATS_REFRESH_INTERVAL_SECONDS</code></td><td><code>30</code></td><td>Auto-refresh interval for the trigger-stats HTMX panel on the dashboard</td></tr>
<tr><td><code>PROCESS_REFRESH_INTERVAL_SECONDS</code></td><td><code>15</code></td><td>Auto-refresh interval for the process table on the dashboard</td></tr>
<tr><td><code>AUDIT_LOG_LIMIT</code></td><td><code>200</code></td><td>Maximum audit log entries returned by <code>GET /admin/audit</code></td></tr>
<tr><td><code>LICENSE_CONTACT_EMAIL</code></td><td><code>license@devtrack.dev</code></td><td>Enterprise contact email shown on the license page</td></tr>
</tbody>
</table></div>

<h2>Pages</h2>

<h3>Dashboard</h3>
<p>Live overview of all server processes (same data as the Server TUI), service health checks (webhook server reachability, Ollama availability), and summary stats — total commits logged, work sessions this week, alerts delivered.</p>

<h4>Trigger Stats Panel</h4>
<p>An HTMX-powered stats panel on the dashboard shows four counters that auto-refresh every 30 seconds without a full page reload:</p>
<div class="table-wrap"><table>
<thead><tr><th>Counter</th><th>Description</th></tr></thead>
<tbody>
<tr><td><strong>Triggers today</strong></td><td>Total trigger events (commit + timer) fired since midnight</td></tr>
<tr><td><strong>Commits today</strong></td><td>Commit-type triggers fired since midnight</td></tr>
<tr><td><strong>Last trigger</strong></td><td>Timestamp of the most recent trigger event</td></tr>
<tr><td><strong>Errors (24 h)</strong></td><td>Failed trigger dispatches in the last 24 hours — displayed in red when non-zero</td></tr>
</tbody>
</table></div>
<p><code>backend/server_tui/stats_client.py</code> obtains these Go-owned counters from the daemon's <code>GET /internal/stats</code> endpoint when the PostgreSQL-backed Python server is configured. Its legacy/local path reads <code>devtrack.db</code> from the configured <code>DATABASE_DIR</code>. A stopped daemon, missing database, or unavailable data source degrades the counters to zero instead of crashing the console.</p>

<h3>Users</h3>
<p>Full user lifecycle management without touching <code>.env</code>:</p>
<ul>
<li><strong>Create user</strong> — set username, assign a role (<code>admin</code> or <code>viewer</code>), generate an API key.</li>
<li><strong>Update role</strong> — promote a <code>viewer</code> to <code>admin</code> or demote an <code>admin</code> to <code>viewer</code> with a single click. Role changes take effect immediately.</li>
<li><strong>Soft disable / enable</strong> — disable a user account without deleting it. Disabled users cannot authenticate; their API key is preserved. Re-enable in one click. You cannot disable your own account.</li>
<li><strong>Reset password</strong> — generate a new temporary password for any user and send it via the on-screen flash message. The user is prompted to change it on next login.</li>
<li><strong>Rotate API key</strong> — issue a new API key; the old key is invalidated immediately.</li>
<li><strong>Delete user</strong> — permanently removes the user and their API key.</li>
</ul>

<h3>License</h3>
<p>Displays the active license tier, seat count, T&amp;C acceptance status, and expiry date (for time-limited tiers). Shows a clear indicator of which tier is active — Community, Pro, or Enterprise — and links to the upgrade path. Tier detection is performed by <code>backend/license_manager.py</code> and cached for the session.</p>

<h3>Server</h3>
<p>Read-only view of the active LLM provider configuration (which provider is primary, which are fallbacks), and the status of each external integration credential (Azure DevOps, GitHub, GitLab, Jira, Telegram, Slack). A green tick means the credential is present and the service responded to a ping; red means missing or unreachable.</p>

<h3>Audit Log</h3>
<p>Timestamped log of every admin action — login, user creation/deletion, role change, disable/enable, password reset, key rotation — with the acting username and IP address. Useful for auditing shared team deployments.</p>

<h2>Authentication</h2>
<p>The console uses a <strong>JWT session cookie</strong>. Credentials are set via <code>ADMIN_USERNAME</code> / <code>ADMIN_PASSWORD</code> in <code>.env</code>. On first login you will be prompted to change the default password if <code>ADMIN_PASSWORD=changeme</code> is still set — the console will refuse to serve any page other than the password-change form until it is updated.</p>

<h2>First-Time Setup</h2>
<pre><code class="language-bash"># 1. Generate a secret key (any random string, 32+ chars recommended)
python3 -c "import secrets; print(secrets.token_hex(32))"

# 2. Add to .env
ADMIN_SECRET_KEY=&lt;output from above&gt;
ADMIN_USERNAME=admin
ADMIN_PASSWORD=your-secure-password   # change from default

# 3. Start from the Python checkout
cd Devtrack_/devtrack_server
uv run python -m backend.admin

# Or embed on the webhook server (single-process mode)
# ADMIN_EMBED=true  # add to .env, then devtrack start as normal</code></pre>

<h2>HTTP Route Tests (CS-3)</h2>
<p><code>backend/tests/test_admin_routes.py</code> ships 31 HTTP-level tests covering every admin route introduced or extended in CS-3. The test client fires real HTTP requests against a TestClient-wrapped FastAPI instance — no mocking of route handlers. Coverage includes:</p>
<ul>
<li>Dashboard stats panel HTMX fragment (<code>GET /admin/stats-panel</code>) — correct counter values and zero-degradation when DB absent</li>
<li>User role update (<code>POST /admin/users/{username}/role</code>) — promotion, demotion, self-role-change rejected</li>
<li>Soft disable / enable (<code>POST /admin/users/{username}/disable</code> and <code>/enable</code>) — disabled user cannot auth; self-disable rejected</li>
<li>Password reset (<code>POST /admin/users/{username}/reset-password</code>) — new password accepted, old rejected</li>
<li>License page (<code>GET /admin/license</code>) — renders for all three tiers; correct tier label shown</li>
<li>Unauthenticated access to all new routes returns 302 redirect to login</li>
</ul>

<h2>Design Notes</h2>
<ul>
<li><strong>Dark theme</strong> — matches the DevTrack aesthetic; inherits CSS variables so it respects the system theme.</li>
<li><strong>No JS build step</strong> — HTMX is loaded from CDN; all interactivity is server-rendered HTML fragments. Works without a bundler.</li>
<li><strong>Separate from the webhook server by default</strong> — the admin console and the webhook server (port 8089) are two distinct FastAPI apps. Stopping the admin console does not affect webhook delivery. Use <code>ADMIN_EMBED=true</code> to co-host them.</li>
<li><strong>One server store</strong> — user records, API keys, roles, audit entries, and server events use the required PostgreSQL database through shared SQLAlchemy stores.</li>
</ul>

<blockquote><p><strong>Storage note:</strong> The Go client keeps its offline source of truth in local SQLite and can observe, queue, report, and serve MCP context without a server. The Python server requires PostgreSQL for server-side persistence and aggregate events; startup validates it and applies Alembic migrations. MongoDB is optional and used only as an extra Teams voice-learning source.</p></blockquote>
</div>`,

  SLACK_BOT: `<div class="md-body">
<h1>Slack Bot</h1>
<p>The Slack bot lets you control DevTrack from any Slack channel using a single slash command: <code>/devtrack &lt;subcommand&gt;</code>. It uses <strong>Socket Mode</strong> — no public URL, no firewall rules, no ngrok required.</p>

<li>Add a slash command <code>/devtrack</code> (any Request URL — Socket Mode ignores it)</li>
<li>Add Bot Token Scopes: <code>chat:write</code>, <code>commands</code>, <code>channels:read</code></li>
<li>Install to workspace → get the Bot User OAuth Token (<code>xoxb-...</code>)</li>

<h2>Configuration</h2>
<pre><code class="language-bash">SLACK_ENABLED=true
SLACK_BOT_TOKEN=xoxb-...          # Bot User OAuth Token

<p>The Go daemon does not start the Python Socket Mode command bot. Run it explicitly from a source checkout with <code>cd Devtrack_/devtrack_server &amp;&amp; uv run python -m backend.slack</code>. Go-native Slack alert delivery through <code>SLACK_WEBHOOK_URL</code> is a separate notifier.</p>

<tr><td><code>/devtrack status</code></td><td>Show daemon status (running / stopped)</td></tr>
<tr><td><code>/devtrack logs</code></td><td>Tail the last 20 lines of the daemon log</td></tr>
<tr><td><code>/devtrack trigger</code></td><td>Manually fire a timer trigger</td></tr>
<tr><td><code>/devtrack status</code></td><td>Show runtime and configured-service state</td></tr>
<tr><td><code>/devtrack commits</code></td><td>Show recent commits logged today</td></tr>
<tr><td><code>/devtrack workstart [ticket]</code></td><td>Start a work session, optionally linked to a ticket</td></tr>
<tr><td><code>/devtrack workstop</code></td><td>Stop the active work session</td></tr>
<tr><td><code>/devtrack workadjust &lt;mins&gt;</code></td><td>Override the recorded time for the active/last session</td></tr>
<tr><td><code>/devtrack workstatus</code></td><td>Show today's sessions and the active timer</td></tr>

<h2>Proactive Notifications</h2>

  VACATION_MODE: `<div class="md-body">
<h1>Vacation Mode</h1>
<p>Vacation mode generates a work summary from recent commits on scheduled timer events and scores its confidence while you are away.</p>\n<blockquote><p><strong>Current limitation:</strong> the legacy auto-submit path can post directly instead of staging through <code>pending_actions</code>, which conflicts with DevTrack's trust invariant. Use <code>--no-submit</code> until that path is corrected; treat this as generation-only, not an approved queue bypass.</p></blockquote>

<h2>Enabling Vacation Mode</h2>
<pre><code class="language-bash"># Turn on with optional end date and confidence threshold
devtrack vacation on
devtrack vacation on --until 2026-04-07
devtrack vacation on --until 2026-04-07 --threshold 0.8
devtrack vacation on --until 2026-04-07 --no-submit   # log only, don't post to PM

# Turn off
devtrack vacation off

# Check status
devtrack vacation status</code></pre>

<h2>How It Works</h2>
<ol>
<li>When the DevTrack timer fires (every <code>PROMPT_INTERVAL</code> minutes), vacation mode is checked before any notification is delivered or any update is staged.</li>
<li>If vacation mode is active, <code>VacationAutoResponder</code> collects the recent commits for the workspace and builds a context string.</li>
<li>The context is sent to the configured LLM provider with a prompt that asks for a 1-3 sentence work update <strong>and</strong> a <code>CONFIDENCE: 0.0–1.0</code> score on the same response.</li>
<li>If the confidence meets the configured threshold <strong>and</strong> <code>auto_submit</code> is enabled, the update is posted to the PM tool (Azure DevOps, GitHub, GitLab, or Jira) as a comment, prefixed with <em>"[Auto — vacation mode]"</em>.</li>
<li>If confidence is below threshold, the update is logged but not posted.</li>
</ol>

<h2>Telegram &amp; Slack</h2>
<p>Vacation mode can also be toggled from Telegram and Slack:</p>
<div class="table-wrap"><table>
<thead><tr><th>Telegram</th><th>Slack</th><th>Action</th></tr></thead>
<tbody>
<tr><td><code>/vacation on</code></td><td><code>/devtrack vacation on</code></td><td>Enable vacation mode (indefinite)</td></tr>
<tr><td><code>/vacation on --until 2026-04-07</code></td><td><code>/devtrack vacation on --until 2026-04-07</code></td><td>Enable until date</td></tr>
<tr><td><code>/vacation off</code></td><td><code>/devtrack vacation off</code></td><td>Disable vacation mode</td></tr>
<tr><td><code>/vacation status</code></td><td><code>/devtrack vacation status</code></td><td>Show current state</td></tr>
</tbody>
</table></div>

<h2>Configuration</h2>
<pre><code class="language-bash"># Minimum LLM confidence (0-1) to auto-submit a work update while on vacation
VACATION_CONFIDENCE_THRESHOLD=0.7

# Set to false to log auto-generated updates without posting to PM
VACATION_AUTO_SUBMIT=true</code></pre>
<p>These are the global defaults. The per-session <code>--threshold</code> and <code>--no-submit</code> flags override them and are stored in the database for the duration of vacation mode.</p>

<h2>Flags</h2>
<div class="table-wrap"><table>
<thead><tr><th>Flag</th><th>Description</th></tr></thead>
<tbody>
<tr><td><code>--until YYYY-MM-DD</code></td><td>Auto-expire vacation mode at end of this date</td></tr>
<tr><td><code>--threshold 0.0–1.0</code></td><td>Minimum confidence to auto-post (default: <code>0.7</code>)</td></tr>
<tr><td><code>--no-submit</code></td><td>Generate updates but never post them — logging only</td></tr>
</tbody>
</table></div>

<h2>Expiry</h2>
<p>If <code>--until</code> is set, vacation mode is treated as <strong>expired</strong> on the day after the end date. The daemon resumes its normal silent timer processing automatically. Run <code>devtrack vacation off</code> to clear the record explicitly.</p>

<h2>Database Storage</h2>
<p>Vacation state is stored as a single row in the <code>vacation_mode</code> table in the configured local SQLite database. Setup places <code>devtrack.db</code> under the DevTrack data home's <code>data/db</code> directory (by default <code>~/.local/share/devtrack/data/db</code>, or beneath <code>XDG_DATA_HOME</code> when set). All fields (<code>enabled</code>, <code>enabled_at</code>, <code>until</code>, <code>confidence_threshold</code>, <code>auto_submit</code>) are updated atomically on every <code>on</code> / <code>off</code> call — no config file is written.</p>
</div>`,

  CLOUD_MODE: `<div class="md-body">
<h1>Cloud Mode (CS-4)</h1>
<p>Cloud Mode lets you connect the DevTrack Go daemon on your developer machine to a remote, managed Python backend — no local Python installation required on the developer machine. The daemon uses your cloud credentials for all HTTP trigger POSTs, bypassing the local cert-pinning that applies to self-signed certificates in managed and external modes.</p>

<h2>Quick Start</h2>
<pre><code class="language-bash"># Log in to a remote DevTrack server
devtrack cloud login --url https://myserver.com --key your-api-key

# Check connection status (pings /health, fetches /version, shows key preview)
devtrack cloud status

# Disconnect and revert to managed mode
devtrack cloud logout</code></pre>

<h2>Server Modes</h2>
<div class="table-wrap"><table>
<thead><tr><th>Mode</th><th>Config</th><th>Use case</th></tr></thead>
<tbody>
<tr><td><code>managed</code> (default)</td><td><code>DEVTRACK_SERVER_MODE=managed</code></td><td>Local dev — daemon spawns Python subprocess automatically</td></tr>
<tr><td><code>lightweight</code></td><td><code>DEVTRACK_SERVER_MODE=lightweight</code></td><td>Manual non-managed compatibility value: the daemon does not spawn Python; Go-native features continue, while server-backed calls degrade if no backend is reachable</td></tr>
<tr><td><code>external</code></td><td><code>DEVTRACK_SERVER_MODE=external</code> + <code>DEVTRACK_SERVER_URL=http://host:port</code></td><td>Docker or self-hosted Python backend; uses cert-pinning for TLS</td></tr>
<tr><td><code>cloud</code></td><td>Set via <code>devtrack cloud login</code></td><td>Hosted DevTrack backend; CA-signed cert; API key auth</td></tr>
</tbody>
</table></div>

<h2>How It Works</h2>
<ol>
<li><code>devtrack cloud login --url URL --key KEY</code> tests the <code>/health</code> endpoint, then writes credentials to <code>~/.devtrack/cloud.json</code> (chmod 0600). This file contains <code>mode</code>, <code>url</code>, and <code>api_key</code>.</li>
<li>When cloud mode is active, <code>IsCloudMode()</code> returns <code>true</code> and <code>IsLocalTLS()</code> returns <code>false</code> — the Go HTTP client skips the cert-pinning step that is used for self-signed local certificates, trusting the system CA store instead.</li>
<li>Every trigger POST and health-check request includes the API key in the <code>Authorization</code> header.</li>
<li><code>devtrack cloud logout</code> removes <code>~/.devtrack/cloud.json</code> and restores managed mode.</li>
</ol>

<h2>cloud.json Format</h2>
<pre><code class="language-json">{
  "mode": "cloud",
  "url": "https://myserver.com",
  "api_key": "your-api-key"
}</code></pre>
<p>The file is stored at <code>~/.devtrack/cloud.json</code> with permissions <code>0600</code> — readable only by the current user.</p>

<h2>Status Output</h2>
<p><code>devtrack cloud status</code> pings <code>/health</code> and reports the round-trip latency, fetches <code>/version</code> for the server version string, and displays a masked preview of the API key (first 8 chars + <code>…</code>) so you can confirm the right key is active without exposing it in the terminal.</p>

<h2>Configuration</h2>
<p>Cloud mode does not require any <code>.env</code> changes — credentials are stored in <code>~/.devtrack/cloud.json</code> and loaded at startup automatically. The existing <code>DEVTRACK_SERVER_MODE</code> and <code>DEVTRACK_SERVER_URL</code> variables are ignored when <code>cloud.json</code> is present.</p>

<blockquote><p><strong>Note:</strong> Cloud mode follows the local-first design principle. If the remote server is unreachable, the daemon logs the error and continues operating locally — git monitoring, scheduling, and SQLite logging all continue without interruption. Triggers are re-tried on the next cycle.</p></blockquote>
</div>`,

  TUI_DASHBOARD: `<div class="md-body">
<h1>TUI Dashboard</h1>
<p>The TUI Dashboard is a real-time, alt-screen terminal dashboard built with <strong>Bubble Tea</strong> (charmbracelet/bubbletea). It gives you a live view of daemon health, recent git activity, workspace status, and ticket alerts — all from a single terminal window, with no browser required.</p>

<h2>Launching</h2>
<pre><code class="language-bash">devtrack tui</code></pre>
<p>The dashboard opens in alt-screen mode (full terminal takeover). Press <code>q</code> to quit and return to your shell — the daemon keeps running.</p>

<h2>Tabs</h2>
<p>Navigate between tabs with the <code>Tab</code> key or by pressing <code>1</code>–<code>4</code>.</p>

<pre><code>┌──────────────────────────────────────────────────────────────────────┐
│  [1] Overview  [2] Activity  [3] Workspaces  [4] Alerts              │
└──────────────────────────────────────────────────────────────────────┘</code></pre>

<h3>1 — Overview</h3>
<p>At-a-glance summary of the running daemon:</p>
<ul>
<li>Daemon uptime since last start</li>
<li>Python backend server status and latency (ping to <code>/health</code>)</li>
<li>Today's commit trigger count and timer trigger count</li>

</ul>

<h3>2 — Activity</h3>
<p>A live table of the last 30 trigger records from the SQLite database — both commit triggers (with short commit hash) and timer triggers — with timestamps and the workspace that fired them. Useful for confirming git monitoring is working and seeing recent AI-enhanced commit activity at a glance.</p>

<h3>3 — Workspaces</h3>
<p>A table of every workspace configured in <code>workspaces.yaml</code>:</p>
<div class="table-wrap"><table>
<thead><tr><th>Column</th><th>Description</th></tr></thead>
<tbody>
<tr><td>Name</td><td>Workspace name as defined in workspaces.yaml</td></tr>
<tr><td>Platform</td><td>PM platform (azure / github / gitlab / jira / none)</td></tr>
<tr><td>Enabled</td><td>Whether monitoring is active for this workspace</td></tr>
<tr><td>Path</td><td>Filesystem path being monitored</td></tr>
</tbody>
</table></div>

<h3>4 — Alerts</h3>
<p>The last 30 ticket notifications from the SQLite <code>notifications</code> table — written there by the Go alert poller. Shows source (github / azure), event type, ticket ID, summary, and read/unread state. Like the rest of DevTrack, it works fully offline.</p>

<h2>Key Bindings</h2>
<div class="table-wrap"><table>
<thead><tr><th>Key</th><th>Action</th></tr></thead>

<h2>Auto-Refresh</h2>

<h2>Offline Support</h2>
