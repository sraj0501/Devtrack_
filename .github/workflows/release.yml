name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: devtrack_client/go.mod
          cache-dependency-path: devtrack_client/go.sum

      - name: go test
        working-directory: devtrack_client
        run: go test ./... -timeout 60s

  build-release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: devtrack_client/go.mod
          cache-dependency-path: devtrack_client/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build all platforms
        working-directory: devtrack_client
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT=${GITHUB_SHA:0:7}
          LDFLAGS="-X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.GitCommit=${COMMIT}"
          mkdir -p dist

          # Windows — uploaded as .exe directly
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags "$LDFLAGS" -o dist/devtrack_windows_amd64.exe .
          python ../scripts/package_mcpb.py \
            --binary dist/devtrack_windows_amd64.exe \
            --platform win32 --version "$VERSION" \
            --output dist/devtrack_mcpb_windows_amd64.mcpb

          # macOS + Linux — binary inside archive must be named 'devtrack'
          for GOOS in darwin linux; do
            for GOARCH in amd64 arm64; do
              GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 \
                go build -ldflags "$LDFLAGS" -o dist/devtrack .
              python ../scripts/package_mcpb.py \
                --binary dist/devtrack --platform "$GOOS" --version "$VERSION" \
                --output "dist/devtrack_mcpb_${GOOS}_${GOARCH}.mcpb"
              tar czf "dist/devtrack_${GOOS}_${GOARCH}.tar.gz" -C dist devtrack
              rm dist/devtrack
            done
          done

          echo "--- dist contents ---"
          ls -lh dist/
          echo "--- archive contents ---"
          for f in dist/*.tar.gz; do echo "$f: $(tar tzf $f)"; done

      - name: Validate MCPB manifests
        run: |
          for bundle in devtrack_client/dist/*.mcpb; do
            target="mcpb-validation/$(basename "$bundle" .mcpb)"
            python -m zipfile -e "$bundle" "$target"
            npx --yes @anthropic-ai/mcpb@2.1.2 validate "$target/manifest.json"
          done

      - name: Generate checksums and MCP Registry metadata
        run: |
          (cd devtrack_client/dist && sha256sum * > checksums.txt)
          python scripts/generate_server_json.py \
            --version "${{ github.ref_name }}" \
            --dist devtrack_client/dist

      - name: Install pinned MCP Registry publisher
        run: |
          curl -LO https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz
          curl -LO https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/registry_1.7.9_checksums.txt
          grep ' mcp-publisher_linux_amd64.tar.gz$' registry_1.7.9_checksums.txt | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: Validate MCP Registry metadata
        run: ./mcp-publisher validate devtrack_client/dist/server.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${{ github.ref_name }}.md"
          if [ -f "$NOTES" ]; then
            NOTES_ARGS=(--notes-file "$NOTES")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "${{ github.ref_name }}" \
            devtrack_client/dist/devtrack_windows_amd64.exe \
            devtrack_client/dist/devtrack_darwin_amd64.tar.gz \
            devtrack_client/dist/devtrack_darwin_arm64.tar.gz \
            devtrack_client/dist/devtrack_linux_amd64.tar.gz \
            devtrack_client/dist/devtrack_linux_arm64.tar.gz \
            devtrack_client/dist/*.mcpb \
            devtrack_client/dist/checksums.txt \
            devtrack_client/dist/server.json \
            --title "${{ github.ref_name }}" \
            "${NOTES_ARGS[@]}" \
            --repo "${{ github.repository }}"

      - name: Publish to the official MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish devtrack_client/dist/server.json
