name: devtrack_client CI

on:
  push:
    branches: [dev, main]
    paths:
      - "devtrack_client/**"
      - "mcpb/**"
      - "scripts/package_mcpb.py"
      - "scripts/smoke_mcpb.py"
      - "scripts/generate_server_json.py"
      - "Dockerfile.mcp"
      - ".dockerignore"
      - ".github/workflows/client.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "devtrack_client/**"
      - "mcpb/**"
      - "scripts/package_mcpb.py"
      - "scripts/smoke_mcpb.py"
      - "scripts/generate_server_json.py"
      - "Dockerfile.mcp"
      - ".dockerignore"
      - ".github/workflows/client.yml"

jobs:
  build:
    name: Build & vet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: devtrack_client/go.mod
          cache-dependency-path: devtrack_client/go.sum

      - name: go build
        working-directory: devtrack_client
        run: go build ./...

      - name: go vet
        working-directory: devtrack_client
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: devtrack_client/go.mod
          cache-dependency-path: devtrack_client/go.sum

      - name: go test
        working-directory: devtrack_client
        run: go test ./... -timeout 60s

  api-contract:
    name: API contract tests (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: devtrack_client/go.mod
          cache-dependency-path: devtrack_client/go.sum

      - name: go test (contract)
        working-directory: devtrack_client
        run: go test -run TestAPIContract ./...

  glama-container:
    name: Glama container introspection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build Glama MCP image
        run: docker build --file Dockerfile.mcp --tag devtrack-mcp:ci .

      - name: Verify MCP initialization and tool discovery
        shell: bash
        run: |
          responses="$({
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","clientInfo":{"name":"glama-ci","version":"1.0"}}}'
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
            printf '%s\n' '{"jsonrpc":"2.0","id":3,"method":"shutdown"}'
          } | docker run --rm --interactive devtrack-mcp:ci)"
          RESPONSES="$responses" python - <<'PY'
          import json
          import os

          messages = [json.loads(line) for line in os.environ["RESPONSES"].splitlines()]
          assert messages[0]["result"]["serverInfo"]["name"] == "devtrack"
          tools = messages[1]["result"]["tools"]
          assert len(tools) == 6, f"expected 6 tools, got {len(tools)}"
          assert all(tool["annotations"]["readOnlyHint"] for tool in tools)
          assert messages[2]["result"] is None
          PY

  mcpb-package:
    name: MCPB native smoke (${{ matrix.platform }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win32
            asset_os: windows
            arch: amd64
            binary: devtrack.exe
          - runner: macos-15-intel
            platform: darwin
            asset_os: darwin
            arch: amd64
            binary: devtrack
          - runner: macos-15
            platform: darwin
            asset_os: darwin
            arch: arm64
            binary: devtrack
          - runner: ubuntu-24.04
            platform: linux
            asset_os: linux
            arch: amd64
            binary: devtrack
          - runner: ubuntu-24.04-arm
            platform: linux
            asset_os: linux
            arch: arm64
            binary: devtrack

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: devtrack_client/go.mod
          cache-dependency-path: devtrack_client/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build MCP-capable binary
        working-directory: devtrack_client
        run: |
          python -c "from pathlib import Path; Path('dist').mkdir(exist_ok=True)"
          go build -ldflags "-X main.Version=v3.1.1-rc.1" -o dist/${{ matrix.binary }} .

      - name: Package MCPB
        run: >-
          python scripts/package_mcpb.py
          --binary devtrack_client/dist/${{ matrix.binary }}
          --platform ${{ matrix.platform }}
          --version 3.1.1-rc.1
          --output devtrack_client/dist/devtrack_mcpb_${{ matrix.asset_os }}_${{ matrix.arch }}.mcpb

      - name: Validate manifest with official MCPB CLI
        run: |
          python -m zipfile -e devtrack_client/dist/devtrack_mcpb_${{ matrix.asset_os }}_${{ matrix.arch }}.mcpb mcpb-validation
          npx --yes @anthropic-ai/mcpb@2.1.2 validate mcpb-validation/manifest.json

      - name: Execute extracted MCPB on native runner
        run: >-
          python scripts/smoke_mcpb.py
          devtrack_client/dist/devtrack_mcpb_${{ matrix.asset_os }}_${{ matrix.arch }}.mcpb
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: mcpb-${{ matrix.platform }}-${{ matrix.arch }}
          path: devtrack_client/dist/*.mcpb

  registry-metadata:
    name: MCP Registry metadata validation
    runs-on: ubuntu-latest
    needs: mcpb-package
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: mcpb-*
          path: dist
          merge-multiple: true

      - name: Generate server.json from qualified bundles
        run: python scripts/generate_server_json.py --version v3.1.1-rc.1 --dist dist

      - name: Install pinned MCP Registry publisher
        run: |
          curl -LO https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz
          curl -LO https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/registry_1.7.9_checksums.txt
          grep ' mcp-publisher_linux_amd64.tar.gz$' registry_1.7.9_checksums.txt | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate dist/server.json
