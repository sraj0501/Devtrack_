name: CI

on:
  push:
    branches: [main, bot_automation]
  pull_request:
    branches: [main]

jobs:
  go-test:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: devtrack_client/go.mod
          cache-dependency-path: devtrack_client/go.sum

      - name: go vet
        working-directory: devtrack_client
        run: go vet ./...

      - name: go test
        working-directory: devtrack_client
        run: go test ./...

      - name: go build (smoke test)
        working-directory: devtrack_client
        run: go build -o /dev/null .

  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: devtrack_server
        run: uv sync

      - name: Run pytest
        working-directory: devtrack_server
        run: uv run pytest backend/tests/ -q --tb=short
