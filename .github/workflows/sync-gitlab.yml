name: Sync to GitLab

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  sync-client:
    name: Sync devtrack_client → gitlab-client dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Split subtree and push to gitlab-client dev
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
        run: |
          git remote add gitlab-client \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/devtrack3_cloud/devtrack_client.git"

          git subtree split --prefix=devtrack_client/ -b split-client
          SPLIT_SHA=$(git rev-parse split-client)

          git push --force gitlab-client split-client:dev
          git branch -D split-client

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            git tag -f "$TAG" "$SPLIT_SHA"
            git push --force gitlab-client "refs/tags/${TAG}"
          fi
