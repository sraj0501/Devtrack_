stages:
  - test

variables:
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache

# ---------------------------------------------------------------------------
# core-tests
# Runs the server test suite without AI/spaCy extras.
# Trigger manually (requires self-hosted runner).
# ---------------------------------------------------------------------------
core-tests:
  stage: test
  image: python:3.12-slim
  cache:
    key: uv-server-core-$CI_COMMIT_REF_SLUG
    paths:
      - .venv/
      - .uv-cache/
  before_script:
    - pip install uv --quiet
    - uv sync --group dev
  script:
    - uv run pytest backend/tests/ -x -q --tb=short --ignore=backend/tests/test_nlp_parser.py
  rules:
    - when: manual

# ---------------------------------------------------------------------------
# full-tests
# Runs the server test suite with AI/spaCy extras (slower).
# Trigger manually (requires self-hosted runner).
# ---------------------------------------------------------------------------
full-tests:
  stage: test
  image: python:3.12-slim
  cache:
    key: uv-server-full-$CI_COMMIT_REF_SLUG
    paths:
      - .venv/
      - .uv-cache/
  before_script:
    - pip install uv --quiet
    - uv sync --extra ai --group dev
  script:
    - uv run pytest backend/tests/ -x -q --tb=short
  rules:
    - when: manual

# ---------------------------------------------------------------------------
# api-contract
# Verifies the HTTP API contract tests.
# Trigger manually (requires self-hosted runner).
# ---------------------------------------------------------------------------
api-contract:
  stage: test
  image: python:3.12-slim
  cache:
    key: uv-server-core-$CI_COMMIT_REF_SLUG
    paths:
      - .venv/
      - .uv-cache/
  before_script:
    - pip install uv --quiet
    - uv sync --group dev
  script:
    - uv run pytest backend/tests/test_api_contract.py -v
  rules:
    - when: manual
