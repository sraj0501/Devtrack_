stages:
  - test
  - docker

variables:
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache

# ---------------------------------------------------------------------------
# core-tests
# Runs the server test suite without AI/spaCy extras.
# Triggered on any branch push or MR that touches devtrack_server/.
# ---------------------------------------------------------------------------
core-tests:
  stage: test
  image: python:3.12-slim
  cache:
    key: uv-server-core-$CI_COMMIT_REF_SLUG
    paths:
      - .venv/
      - .uv-cache/
  before_script:
    - pip install uv --quiet
    - cd devtrack_server
    - uv sync --group dev
  script:
    - uv run pytest backend/tests/ -x -q --tb=short --ignore=backend/tests/test_nlp_parser.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - devtrack_server/**
    - if: $CI_COMMIT_BRANCH
      changes:
        - devtrack_server/**

# ---------------------------------------------------------------------------
# full-tests
# Runs the server test suite with AI/spaCy extras (slower; same trigger).
# ---------------------------------------------------------------------------
full-tests:
  stage: test
  image: python:3.12-slim
  cache:
    key: uv-server-full-$CI_COMMIT_REF_SLUG
    paths:
      - .venv/
      - .uv-cache/
  before_script:
    - pip install uv --quiet
    - cd devtrack_server
    - uv sync --extra ai --group dev
  script:
    - uv run pytest backend/tests/ -x -q --tb=short
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - devtrack_server/**
    - if: $CI_COMMIT_BRANCH
      changes:
        - devtrack_server/**

# ---------------------------------------------------------------------------
# api-contract
# Verifies the HTTP API contract tests introduced in TASK-044.
# ---------------------------------------------------------------------------
api-contract:
  stage: test
  image: python:3.12-slim
  cache:
    key: uv-server-core-$CI_COMMIT_REF_SLUG
    paths:
      - .venv/
      - .uv-cache/
  before_script:
    - pip install uv --quiet
    - cd devtrack_server
    - uv sync --group dev
  script:
    - uv run pytest backend/tests/test_api_contract.py -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - devtrack_server/**
    - if: $CI_COMMIT_BRANCH
      changes:
        - devtrack_server/**

# ---------------------------------------------------------------------------
# docker
# Builds the server Docker image. Gated on version tags only.
# No client (Go) code referenced here.
# ---------------------------------------------------------------------------
docker:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE -t $IMAGE_LATEST -f devtrack_server/Dockerfile.server devtrack_server/
    - docker push $IMAGE
    - docker push $IMAGE_LATEST
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
      changes:
        - devtrack_server/**
